# EXPERIMENTAL V3 target. Null_blk-only guard remains mandatory.
# Never autoinstall into a user's current swap setup.
PACKAGE_NAME="swapz"
PACKAGE_VERSION="3.0.0-alpha.10"
BUILT_MODULE_NAME[0]="dm-swapz"
BUILT_MODULE_LOCATION[0]="build/kernel/experimental"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="no"
MAKE[0]="make -C kernel/extent-v3 KDIR=/lib/modules/${kernelver}/build"
CLEAN="make -C kernel/extent-v3 KDIR=/lib/modules/${kernelver}/build clean"
