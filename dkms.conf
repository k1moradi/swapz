# EXPERIMENTAL swapz target. Null_blk-only guard remains mandatory.
# Never autoinstall into a user's current swap setup.
PACKAGE_NAME="swapz"
# The package's copied src/kernel/VERSION is the sole release number.
# This file is sourced by DKMS through Bash; resolve relative to this file.
PACKAGE_VERSION="$(cat "$(dirname "${BASH_SOURCE[0]}")/src/kernel/VERSION")"
BUILT_MODULE_NAME[0]="dm-swapz"
BUILT_MODULE_LOCATION[0]="build/kernel/experimental"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="no"
# DKMS prefixes MAKE with KERNELRELEASE=<kernel>. Reset that assignment after
# DKMS's prefix so the source wrapper runs its staging target before invoking
# Kbuild; otherwise the wrapper enters its Kbuild-only declarations directly.
MAKE[0]="make -C src/kernel KERNELRELEASE= KDIR=/lib/modules/${kernelver}/build"
CLEAN="make -C src/kernel KERNELRELEASE= KDIR=/lib/modules/${kernelver}/build clean"
