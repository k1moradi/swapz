name: Round082 Agent11 actual accepted DM BIO debt HOST_ONLY NO_AUTH
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-a-round081-actual-dm-bio-debt-ownership-noauth.yml'
      - 'tests/runtime/native/fixtures/round081-actual-dm-bio-debt-ownership.c'
      - 'tests/tools/round081-actual-dm-bio-debt-ownership-verify.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-accepted-clone-debt-gcc-clang-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact main checkout, single parent and whitespace before compilation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          read -r -a ancestry <<< "$(git rev-list --parents -n 1 HEAD)"
          test "${#ancestry[@]}" -eq 2
          git rev-parse --verify HEAD^ >/dev/null
          git diff --check HEAD^ HEAD
      - name: Preserve inherited repository standards source prefix
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 -B tests/runtime/native/repository-policy-test.py --enforce
      - name: Verify pinned original Linux and full product source; execute C23 semantic mutants
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            'https://raw.githubusercontent.com/torvalds/linux/c339f4010dea8b0d754f84ace70cd1b089878ef8/drivers/md/dm.c' \
            --output "$RUNNER_TEMP/round081-pinned-dm.c"
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            'https://raw.githubusercontent.com/torvalds/linux/c339f4010dea8b0d754f84ace70cd1b089878ef8/include/linux/device-mapper.h' \
            --output "$RUNNER_TEMP/round081-pinned-device-mapper.h"
          python3 -B tests/tools/round081-actual-dm-bio-debt-ownership-verify.py \
            --pinned-dm "$RUNNER_TEMP/round081-pinned-dm.c" \
            --pinned-header "$RUNNER_TEMP/round081-pinned-device-mapper.h" \
            --json round081-evidence/agent11-actual-upper-debt-host.json
      - name: Upload exact rootless semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round081-agent11-actual-clone-debt-host
          path: round081-evidence/agent11-actual-upper-debt-host.json
          if-no-files-found: warn
          retention-days: 7
