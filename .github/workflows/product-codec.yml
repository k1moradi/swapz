name: Experimental swapz production C qualification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
env:
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/build/python-cache

jobs:
  exact-c:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install native predictor prerequisite
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq liblz4-dev libssl-dev
      - name: Reuse one build directory for native production-C tests
        shell: bash
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          make -C tests/suites SANITIZE=1 test-all
          python3 -B tests/runtime/native/source-contract-test.py -v
          python3 -B tests/runtime/native/zswap-origin-consumer-source-test.py
          python3 -B tests/runtime/native/zswap-origin-producer-consumer-abi-test.py -v
          python3 -B tests/runtime/native/pinned-linux-preflight-evidence-test.py -v
          python3 -B tests/runtime/native/pinned-gcc-build-info-source-test.py -v
          python3 -B tests/runtime/native/zswap-compressed-admission-test.py -v
          python3 -B tests/runtime/native/zswap-compressed-consumer-test.py -v
          git diff --check
      - name: Run compiled guarded compressed-zswap descriptor/readback fixture
        shell: bash
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          # These samples are deterministic test-owned data, not actual zswap streams.
          source=tests/runtime/native/codec/zswap-direct-handoff.c
          mkdir -p build/tests/zswap-direct-handoff
          for compiler in gcc clang; do
            command -v "$compiler" >/dev/null
            artifact="build/tests/zswap-direct-handoff/$compiler-test"
            "$compiler" -std=gnu11 -O2 -Wall -Wextra -Werror \
              -Wconversion -Wshadow -Wformat=2 -Wstrict-prototypes \
              -fsanitize=undefined -fno-sanitize-recover=all \
              -o "$artifact" "$source" -lcrypto
            "$artifact"
          done
      - name: ThreadSanitizer publication and slot-reuse probes
        if: matrix.arch == 'x86_64'
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          make -C tests/suites clean
          make -C tests/suites THREAD_SANITIZE=1 test-concurrency
  compile-only:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel header prerequisites, no module loading
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential linux-headers-generic-hwe-24.04
      - name: Compile swapz W=1 and W=2
        shell: bash
        run: |
          set -euo pipefail
          phase="header-selection"
          trap 'status=$?; printf "::error::COMPILE_ONLY_FAILED phase=%s exit=%s\n" "$phase" "$status" >&2' ERR
          # Rolling runner HWE headers are not a minimum/maximum kernel support claim.
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)"
          if [[ -z "$KDIR" || ! -f "$KDIR/include/config/kernel.release" ]]; then
            echo "No usable runner-installed generic kernel headers" >&2
            false
          fi
          header_release="$(cat "$KDIR/include/config/kernel.release")"
          if [[ "${KDIR##*/}" != "linux-headers-$header_release" ]]; then
            echo "Header directory and kernel.release disagree" >&2
            false
          fi
          runner_arch="$(uname -m)"
          case "${{ matrix.arch }}:$runner_arch" in
            x86_64:x86_64|arm64:aarch64) ;;
            *) echo "Matrix architecture and runner architecture disagree" >&2; false ;;
          esac
          phase="compiler-check"
          compiler_version="$(gcc -dumpfullversion -dumpversion)"
          if ! grep -qx 'CONFIG_CC_IS_GCC=y' "$KDIR/include/config/auto.conf"; then
            echo "Kernel headers do not record GCC as the kernel compiler" >&2
            false
          fi
          kernel_compiler_text="$(sed -n 's/^CONFIG_CC_VERSION_TEXT=//p' "$KDIR/include/config/auto.conf")"
          kernel_compiler_version="${kernel_compiler_text##* }"
          if [[ -z "$kernel_compiler_text" || ! "$kernel_compiler_version" =~ ^[0-9]+([.][0-9]+)*$ ]]; then
            echo "Kernel headers do not expose a usable GCC version" >&2
            false
          fi
          if [[ "${kernel_compiler_version%%.*}" != "${compiler_version%%.*}" ]]; then
            echo "Build compiler major version does not match kernel headers" >&2
            echo "KERNEL_COMPILER_VERSION=$kernel_compiler_version" >&2
            echo "BUILD_COMPILER_VERSION=$compiler_version" >&2
            false
          fi
          source_sha="$(git rev-parse HEAD)"
          target_blob="$(git rev-parse HEAD:src/kernel/dm-target.c)"
          echo "KERNEL_VERSION_RANGE=UNSPECIFIED (runner-selected HWE headers only)"
          echo "KERNEL_HEADERS=${KDIR##*/}"
          echo "KERNEL_RELEASE=$header_release"
          echo "ARCHITECTURE=$runner_arch"
          echo "COMPILER=gcc $compiler_version"
          echo "KERNEL_COMPILER_VERSION=$kernel_compiler_version"
          echo "SOURCE_SHA=$source_sha"
          echo "TARGET_BLOB=$target_blob"

          build_log="$(mktemp)"
          trap 'rm -f "$build_log"' EXIT
          show_build_failure() {
            local total_lines first_error_line first_line last_line
            total_lines="$(wc -l < "$build_log")"
            if (( total_lines == 0 )); then
              echo "No compiler output captured" >&2
              return
            fi
            first_error_line="$(awk '
              /error:|warning:|Error [0-9]+|^make.*\*\*\*/ &&
              !/^warning: the compiler differs from the one used to build the kernel$/ &&
              !/^warning: pahole version differs from the one used to build the kernel$/ &&
              !/^\/usr\/src\/linux-headers-[^:]+:[0-9]+:[0-9]+: warning:/ {
                print NR
                exit
              }' "$build_log")"
            if (( total_lines <= 160 )); then
              first_line=1
              last_line="$total_lines"
            elif [[ -n "$first_error_line" ]]; then
              first_line=$((first_error_line > 12 ? first_error_line - 12 : 1))
              last_line=$((first_line + 159))
            else
              first_line=$((total_lines - 159))
              last_line="$total_lines"
            fi
            printf 'BUILD_FAILURE_LOG lines=%s-%s of %s (first diagnostic when available)\n' \
              "$first_line" "$last_line" "$total_lines" >&2
            sed -n "${first_line},${last_line}p" "$build_log" |
              sed -e "s#${GITHUB_WORKSPACE}#[workspace]#g" \
                  -e "s#${RUNNER_TEMP}#[runner-temp]#g" >&2
          }
          compile_variant() {
            local variant="$1" artifact="$2"
            shift 2
            phase="$variant"
            if ! make -s -C src/kernel KDIR="$KDIR" -j2 "$@" all >"$build_log" 2>&1; then
              show_build_failure
              return 1
            fi
            # Compiler-major compatibility is checked before ignoring Kbuild's command-name notice.
            if ! awk '
              /warning:/ &&
              !/^warning: the compiler differs from the one used to build the kernel$/ &&
              !/^warning: pahole version differs from the one used to build the kernel$/ &&
              !/^\/usr\/src\/linux-headers-[^:]+:[0-9]+:[0-9]+: warning:/ {
                exit 1
              }' "$build_log"; then
              echo "Compiler warning in $variant build" >&2
              show_build_failure
              return 1
            fi
            # Warn on external header diagnostics without treating them as module source.
            local header_warning_count
            header_warning_count="$(grep -Ec '^/usr/src/linux-headers-[^:]+:[0-9]+:[0-9]+: warning:' "$build_log" || true)"
            if [[ "$header_warning_count" != 0 ]]; then
              printf 'EXTERNAL_KERNEL_HEADER_WARNINGS phase=%s count=%s\n' "$variant" "$header_warning_count"
            fi
            if [[ ! -s "$artifact" ]]; then
              echo "Missing module artifact for $variant" >&2
              return 1
            fi
            sha256sum "$artifact"
          }
          compile_variant W=1 build/kernel/w1/dm-swapz.ko W=1
          # Separate linked Kbuild profile: default build above is unchanged.
          # This profile compiles the previously unused imported kernel codec
          # and admission/READ helpers into a non-loadable CI-only artifact.
          # A missing kernel API/export must FAIL here, not become a mock PASS.
          phase="round024-dm-ingress-kbuild"
          compile_variant round024_ingress build/kernel/round024-dm-ingress/dm-swapz.ko \
            SWAPZ_STAGE="$PWD/build/kernel/round024-dm-ingress" \
            KCFLAGS="-DSWAPZ_ROUND024_DM_IMPORT_KBUILD_PROBE=1 -DSWAPZ_ROUND028_DM_OWNED_READBACK_TEST=1 -DSWAPZ_ROUND030_DM_COMPRESSED_COMMIT_TEST=1 -DSWAPZ_ROUND031_DM_LZ4_SIDECAR_TEST=1" W=1
          phase="round024-dm-ingress-object-identity"
          if ! nm -a build/kernel/round024-dm-ingress/dm-target.o |
              grep -q 'swapz_round024_dm_import_kbuild_probe'; then
            echo "Missing real dm-target compile-only ingress symbol" >&2
            false
          fi
          phase="round025-dm-authority-object-identity"
          if ! nm -a build/kernel/round024-dm-ingress/dm-target.o |
              grep -q 'swapz_round025_dm_authority_kbuild_probe'; then
            echo "Missing Round025 source-derived DM generation/GC/ACK gate" >&2
            false
          fi
          phase="round026-dm-map-snapshot-object-identity"
          for symbol in swapz_round026_dm_capture_read_snapshot \
                        swapz_round026_dm_revalidate_and_refuse; do
            if ! nm -a build/kernel/round024-dm-ingress/dm-target.o |
                grep -q "$symbol"; then
              echo "::error::Missing source-real Round026 ordered map snapshot: $symbol" >&2
              false
            fi
          done
          phase="round028-owned-readback-object-identity"
          for symbol in swapz_round028_dm_stage_owned_payload \
                        swapz_round028_dm_owned_lower_readback; do
            if ! nm -a build/kernel/round024-dm-ingress/dm-target.o |
                grep -q "$symbol"; then
              echo "::error::Missing Round028 actual guarded DM $symbol" >&2
              false
            fi
            if nm -a build/kernel/w1/dm-target.o |
                grep -q "$symbol"; then
              echo "::error::Round028 helper leaked into ordinary default build" >&2
              false
            fi
          done
          phase="round030-compressed-commit-real-object-identity"
          for symbol in swapz_round030_dm_commit_owned_lz4 \
                        swapz_round030_dm_read_owned_lz4; do
            if ! nm -a build/kernel/round024-dm-ingress/dm-target.o |
                grep -q "$symbol"; then
              echo "::error::Round030 actual ordered source C missing $symbol" >&2
              false
            fi
            if nm -a build/kernel/w1/dm-target.o | grep -q "$symbol"; then
              echo "::error::Round030 source symbol leaked into default module" >&2
              false
            fi
          done
          phase="round031-lz4-sidecar-real-object-identity"
          for symbol in swapz_round031_dm_sidecar_init \
                        swapz_round031_dm_commit_with_sidecar \
                        swapz_round031_dm_read_with_sidecar \
                        swapz_round031_dm_forget_on_swapoff_or_teardown; do
            if ! nm -a build/kernel/round024-dm-ingress/dm-target.o |
                grep -q "$symbol"; then
              echo "::error::Round031 genuine DM C source symbol missing $symbol" >&2
              false
            fi
            if nm -a build/kernel/w1/dm-target.o |
                grep -q "$symbol"; then
              echo "::error::Round031 source symbol leaked into default C" >&2
              false
            fi
          done
          echo "ROUND031_DM_PER_PAGE_VOLATILE_SOURCE_LZ4_SOURCE_COMPILE_ONLY_NO_LIVE"
          echo "ROUND030_DM_TRUE_LOWER_STAGE_COMMIT_COMPILE_ONLY_NO_LIVE"
          echo "ROUND028_DM_OWNED_READBACK_COMPILED_OPT_IN_NO_LIVE"
          echo "ROUND026_DM_READ_SNAPSHOT_ACTUAL_MODULE_KBUILD_COMPILED_NO_LIVE"
          echo "ROUND025_DM_AUTHORITY_ACTUAL_MODULE_KBUILD_COMPILED_DEFAULT_OFF"
          echo "ROUND024_DM_INGRESS_ACTUAL_MODULE_KBUILD_COMPILED_NO_LIVE_ADMISSION"
          compile_variant W=2 build/kernel/w2/dm-swapz.ko W=2
          # A normal build is deliberately separate from warning variants:
          # it remains the only artifact eligible for owned-RAM loading.
          compile_variant normal build/kernel/experimental/dm-swapz.ko
          phase="vermagic"
          module_vermagic="$(modinfo -F vermagic build/kernel/experimental/dm-swapz.ko)"
          if [[ -z "$module_vermagic" || "${module_vermagic%% *}" != "$header_release" ]]; then
            echo "Module vermagic does not match selected kernel headers" >&2
            echo "EXPECTED_KERNEL_RELEASE=$header_release" >&2
            echo "MODULE_VERMAGIC=${module_vermagic:-unavailable}" >&2
            false
          fi
          phase="manifest"
          echo "COMPILE_ONLY_NO_MODULE_INSERTION"
          mkdir -p build/deploy
          {
            echo "git_head=$source_sha"
            echo "target_blob=$target_blob"
            echo "kernel_headers=${KDIR##*/}"
            echo "kernel_release=$header_release"
            echo "architecture=$runner_arch"
            echo "compiler=gcc $compiler_version"
            echo "kernel_compiler_version=$kernel_compiler_version"
            echo "kernel_version_range=UNSPECIFIED"
            echo "version=$(cat src/kernel/VERSION)"
            sha256sum build/kernel/experimental/dm-swapz.ko
            echo "vermagic=$module_vermagic"
          } > build/deploy/compiled-module-manifest.txt
      - name: Publish experimental swapz compile-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: swapz-module-${{ matrix.arch }}-${{ github.sha }}
          path: |
            build/kernel/experimental/dm-swapz.ko
            build/deploy/compiled-module-manifest.txt
          if-no-files-found: error
          retention-days: 7
