name: Experimental swapz production C qualification

on:
  push:
    branches: [main, ci/next-make-test-read-service]
    paths:
      - 'src/kernel/**'
      - 'tests/suites/**'
      - 'tests/runtime/native/**'
      - 'tests/runtime/benchmark/**'
      - 'Makefile'
      - 'tests/tools/**'
      - 'docs/ROADMAP.md'
      - '.github/workflows/product-codec.yml'
  workflow_dispatch:

permissions:
  contents: read
env:
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/build/python-cache

jobs:
  exact-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install native predictor prerequisite
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq liblz4-dev
      - name: Reuse one build directory for native production-C tests
        shell: bash
        run: |
          set -euo pipefail
          make -C tests/suites SANITIZE=1 test-all
          python3 -B tests/runtime/native/source-contract-test.py -v
          git diff --check
  compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel header prerequisites, no module loading
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential linux-headers-generic-hwe-24.04
      - name: Compile swapz W=1 and W=2
        shell: bash
        run: |
          set -euo pipefail
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)"
          test -n "$KDIR"
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          echo "TARGET_BLOB=$(git rev-parse HEAD:src/kernel/dm-target.c)"
          make -C src/kernel KDIR="$KDIR" W=1 -j2 all
          test -s build/kernel/w1/dm-swapz.ko
          sha256sum build/kernel/w1/dm-swapz.ko
          make -C src/kernel KDIR="$KDIR" W=2 -j2 all
          test -s build/kernel/w2/dm-swapz.ko
          sha256sum build/kernel/w2/dm-swapz.ko
          # A normal build is deliberately separate from warning variants:
          # it remains the only artifact eligible for owned-RAM loading.
          make -C src/kernel KDIR="$KDIR" -j2 all
          test -s build/kernel/experimental/dm-swapz.ko
          sha256sum build/kernel/experimental/dm-swapz.ko
          echo "COMPILE_ONLY_NO_MODULE_INSERTION"
          mkdir -p build/deploy
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "kernel_headers=$KDIR"
            echo "version=$(cat src/kernel/VERSION)"
            sha256sum build/kernel/experimental/dm-swapz.ko
            modinfo -F vermagic build/kernel/experimental/dm-swapz.ko
          } > build/deploy/compiled-module-manifest.txt
      - name: Publish experimental swapz compile-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: swapz-module-${{ github.sha }}
          path: |
            build/kernel/experimental/dm-swapz.ko
            build/deploy/compiled-module-manifest.txt
          if-no-files-found: error
          retention-days: 7
