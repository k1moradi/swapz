name: Experimental swapz production C qualification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
env:
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/build/python-cache

jobs:
  exact-c:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install native predictor prerequisite
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq liblz4-dev
      - name: Reuse one build directory for native production-C tests
        shell: bash
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          make -C tests/suites SANITIZE=1 test-all
          python3 -B tests/runtime/native/source-contract-test.py -v
          git diff --check
      - name: ThreadSanitizer publication and slot-reuse probes
        if: matrix.arch == 'x86_64'
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          make -C tests/suites clean
          make -C tests/suites THREAD_SANITIZE=1 test-concurrency
  compile-only:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel header prerequisites, no module loading
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential linux-headers-generic-hwe-24.04
      - name: Compile swapz W=1 and W=2
        shell: bash
        run: |
          set -euo pipefail
          phase="header-selection"
          trap 'status=$?; printf "::error::COMPILE_ONLY_FAILED phase=%s exit=%s\n" "$phase" "$status" >&2' ERR
          # Rolling runner HWE headers are not a minimum/maximum kernel support claim.
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)"
          if [[ -z "$KDIR" || ! -f "$KDIR/include/config/kernel.release" ]]; then
            echo "No usable runner-installed generic kernel headers" >&2
            false
          fi
          header_release="$(cat "$KDIR/include/config/kernel.release")"
          if [[ "${KDIR##*/}" != "linux-headers-$header_release" ]]; then
            echo "Header directory and kernel.release disagree" >&2
            false
          fi
          runner_arch="$(uname -m)"
          case "${{ matrix.arch }}:$runner_arch" in
            x86_64:x86_64|arm64:aarch64) ;;
            *) echo "Matrix architecture and runner architecture disagree" >&2; false ;;
          esac
          compiler_version="$(gcc -dumpfullversion -dumpversion)"
          source_sha="$(git rev-parse HEAD)"
          target_blob="$(git rev-parse HEAD:src/kernel/dm-target.c)"
          echo "KERNEL_VERSION_RANGE=UNSPECIFIED (runner-selected HWE headers only)"
          echo "KERNEL_HEADERS=${KDIR##*/}"
          echo "KERNEL_RELEASE=$header_release"
          echo "ARCHITECTURE=$runner_arch"
          echo "COMPILER=gcc $compiler_version"
          echo "SOURCE_SHA=$source_sha"
          echo "TARGET_BLOB=$target_blob"

          build_log="$(mktemp)"
          trap 'rm -f "$build_log"' EXIT
          show_build_failure() {
            local total_lines first_error_line first_line last_line
            total_lines="$(wc -l < "$build_log")"
            if (( total_lines == 0 )); then
              echo "No compiler output captured" >&2
              return
            fi
            first_error_line="$(awk '
              /error:|warning:|Error [0-9]+|^make.*\*\*\*/ &&
              !/^warning: the compiler differs from the one used to build the kernel$/ &&
              !/^warning: pahole version differs from the one used to build the kernel$/ {
                print NR
                exit
              }' "$build_log")"
            if (( total_lines <= 160 )); then
              first_line=1
              last_line="$total_lines"
            elif [[ -n "$first_error_line" ]]; then
              first_line=$((first_error_line > 12 ? first_error_line - 12 : 1))
              last_line=$((first_line + 159))
            else
              first_line=$((total_lines - 159))
              last_line="$total_lines"
            fi
            printf 'BUILD_FAILURE_LOG lines=%s-%s of %s (first diagnostic when available)\n' \
              "$first_line" "$last_line" "$total_lines" >&2
            sed -n "${first_line},${last_line}p" "$build_log" |
              sed -e "s#${GITHUB_WORKSPACE}#[workspace]#g" \
                  -e "s#${RUNNER_TEMP}#[runner-temp]#g" >&2
          }
          compile_variant() {
            local variant="$1" artifact="$2"
            shift 2
            phase="$variant"
            if ! make -s -C src/kernel KDIR="$KDIR" -j2 "$@" all >"$build_log" 2>&1; then
              show_build_failure
              return 1
            fi
            # Kbuild tool-identity notices are not source/compiler diagnostics.
            if ! awk '
              /warning:/ &&
              !/^warning: the compiler differs from the one used to build the kernel$/ &&
              !/^warning: pahole version differs from the one used to build the kernel$/ {
                exit 1
              }' "$build_log"; then
              echo "Compiler warning in $variant build" >&2
              show_build_failure
              return 1
            fi
            if [[ ! -s "$artifact" ]]; then
              echo "Missing module artifact for $variant" >&2
              return 1
            fi
            sha256sum "$artifact"
          }
          compile_variant W=1 build/kernel/w1/dm-swapz.ko W=1
          compile_variant W=2 build/kernel/w2/dm-swapz.ko W=2
          # A normal build is deliberately separate from warning variants:
          # it remains the only artifact eligible for owned-RAM loading.
          compile_variant normal build/kernel/experimental/dm-swapz.ko
          phase="manifest"
          echo "COMPILE_ONLY_NO_MODULE_INSERTION"
          mkdir -p build/deploy
          {
            echo "git_head=$source_sha"
            echo "target_blob=$target_blob"
            echo "kernel_headers=${KDIR##*/}"
            echo "kernel_release=$header_release"
            echo "architecture=$runner_arch"
            echo "compiler=gcc $compiler_version"
            echo "kernel_version_range=UNSPECIFIED"
            echo "version=$(cat src/kernel/VERSION)"
            sha256sum build/kernel/experimental/dm-swapz.ko
            modinfo -F vermagic build/kernel/experimental/dm-swapz.ko
          } > build/deploy/compiled-module-manifest.txt
      - name: Publish experimental swapz compile-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: swapz-module-${{ matrix.arch }}-${{ github.sha }}
          path: |
            build/kernel/experimental/dm-swapz.ko
            build/deploy/compiled-module-manifest.txt
          if-no-files-found: error
          retention-days: 7
