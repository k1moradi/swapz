name: Private kernel debug and static contracts

on:
  push:
    branches: [main]
    paths:
      - 'tests/tools/kernel-debug-qualify.py'
      - 'tests/tools/qualify-kernel-debug-owned.sh'
      - 'tests/runtime/native/kernel-debug-qualification-test.py'
      - 'tests/tools/deploy-nullblk.sh'
      - 'tests/tools/device-roundtrip.c'
      - 'tests/tools/direct-read-probe.c'
      - 'tests/tools/direct-write-probe.c'
      - 'tests/tools/nullblk-identity.sh'
      - 'tests/tools/quiet-lower-io.sh'
      - 'tests/tools/swap-inventory.sh'
      - 'Makefile'
      - 'packaging/sign-module.sh'
      - 'src/kernel/**'
      - 'docs/testing_standards.md'
      - '.github/workflows/kernel-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rootless-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject false kernel-debug PASS and unsafe invocation syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/tools/qualify-kernel-debug-owned.sh
          python3 -B tests/runtime/native/kernel-debug-qualification-test.py -v
          python3 -B tests/tools/kernel-debug-qualify.py probe
          # Static and synthetic evidence is NOT a loaded instrumented-kernel PASS.
          echo "KERNEL_DEBUG_LOADED_KASAN_LOCKDEP=NOT_RUN (requires owned KASAN+lockdep host evidence)"
          echo "KERNEL_DEBUG_LOADED_KCSAN=NOT_RUN (requires separate owned KCSAN host evidence)"
          git diff --check

  sparse-compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install bounded compile-only prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential linux-headers-generic-hwe-24.04 curl
      - name: Run kernel sparse and optional installed Smatch
        shell: bash
        run: |
          set -euo pipefail
          # HWE 7.0 is required by the module; distro sparse 0.6.4 cannot
          # handle __typeof_unqual__ and Kbuild disables its CHECK phase.
          # Build exactly the Debian source release in CI (no host install).
          sparse_archive="build/tests/sparse-0.6.5-rc1.tar.gz"
          sparse_description="build/tests/sparse-0.6.5-rc1.dsc"
          sparse_source="$PWD/build/tests/sparse-0.6.5-rc1-src"
          mkdir -p build/tests "$sparse_source"
          curl --fail --location --silent --show-error --retry 3 \
            'https://deb.debian.org/debian/pool/main/s/sparse/sparse_0.6.5~rc1.orig.tar.gz' \
            --output "$sparse_archive"
          curl --fail --location --silent --show-error --retry 3 \
            'https://deb.debian.org/debian/pool/main/s/sparse/sparse_0.6.5~rc1-2.dsc' \
            --output "$sparse_description"
          # Debian's published archive MD5 gives an independent fixed
          # identity; the exact SHA256 is also checked against its .dsc.
          printf '%s  %s\n' '45c43188a3021711ef92f187729d0656' "$sparse_archive" | md5sum --check -
          expected_sha="$(awk '/^Checksums-Sha256:/{in_section=1;next} in_section && $3=="sparse_0.6.5~rc1.orig.tar.gz" { print $1; exit }' "$sparse_description")"
          [[ "$expected_sha" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$expected_sha" "$sparse_archive" | sha256sum --check -
          tar -xzf "$sparse_archive" -C "$sparse_source" --strip-components=1
          make -C "$sparse_source" -j2 sparse
          export PATH="$sparse_source:$PATH"
          sparse --version
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)"
          test -n "$KDIR"
          python3 -B tests/tools/kernel-debug-qualify.py static --kdir "$KDIR"
          echo "KERNEL_DEBUG_STATIC_COMPILE_ONLY_NO_MODULE_LOADING"
