name: Private kernel debug and static contracts

on:
  push:
    branches: [main]
    paths:
      - 'tests/tools/kernel-debug-qualify.py'
      - 'tests/tools/qualify-kernel-debug-owned.sh'
      - 'tests/runtime/native/kernel-debug-qualification-test.py'
      - 'src/kernel/**'
      - 'docs/testing_standards.md'
      - '.github/workflows/kernel-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rootless-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject false kernel-debug PASS and unsafe invocation syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/tools/qualify-kernel-debug-owned.sh
          python3 -B tests/runtime/native/kernel-debug-qualification-test.py -v
          python3 -B tests/tools/kernel-debug-qualify.py probe
          git diff --check

  sparse-compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install bounded compile-only prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential linux-headers-generic sparse
      - name: Run kernel sparse and optional installed Smatch
        shell: bash
        run: |
          set -euo pipefail
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-6.8.*-generic' | sort -V | tail -1)"
          test -n "$KDIR"
          python3 -B tests/tools/kernel-debug-qualify.py static --kdir "$KDIR"
          echo "KERNEL_DEBUG_STATIC_COMPILE_ONLY_NO_MODULE_LOADING"
