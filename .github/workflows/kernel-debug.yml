name: Private kernel debug and static contracts

on:
  push:
    branches: [main]
    paths:
      - 'tests/tools/kernel-debug-qualify.py'
      - 'tests/tools/qualify-kernel-debug-owned.sh'
      - 'tests/runtime/native/kernel-debug-qualification-test.py'
      - 'tests/runtime/native/kernel-debug-main-range-test.py'
      - 'tests/runtime/native/round093-native-evidence-collector-test.py'
      - 'tests/tools/round093-native-evidence-collector.py'
      - 'tests/tools/deploy-nullblk.sh'
      - 'tests/tools/device-roundtrip.c'
      - 'tests/tools/direct-read-probe.c'
      - 'tests/tools/direct-write-probe.c'
      - 'tests/tools/nullblk-identity.sh'
      - 'tests/tools/quiet-lower-io.sh'
      - 'tests/tools/swap-inventory.sh'
      - 'Makefile'
      - 'packaging/sign-module.sh'
      - 'src/kernel/**'
      - 'docs/testing_standards.md'
      - '.github/workflows/kernel-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rootless-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # A direct-main push can advance more than one linear commit.
          fetch-depth: 0
      - name: Verify exact direct-main range and complete standards prefix
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SOURCE: ${{ github.sha }}
          PUSH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          standards = "docs/testing_standards.md"
          sha = re.compile(r"[0-9a-f]{40}")
          commit = "<unavailable>"

          class InvalidRange(Exception):
              pass

          def require(condition, reason):
              if not condition:
                  raise InvalidRange(reason)

          def git(*args, reason):
              # Only fixed reasons and validated Git SHAs reach the console.
              try:
                  result = subprocess.run(
                      ("git", "--no-replace-objects", *args),
                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                      timeout=15, check=False)
              except (OSError, subprocess.TimeoutExpired):
                  raise InvalidRange(reason) from None
              require(result.returncode == 0, reason)
              return result.stdout

          def standards_bytes(revision):
              entry = git("ls-tree", "-z", revision, "--", standards,
                          reason="standards_tree_unavailable")
              require(re.fullmatch(rb"100(?:644|755) blob [0-9a-f]{40}\t" +
                                   standards.encode() + rb"\x00", entry),
                      "standards_regular_blob_required")
              data = git("show", f"{revision}:{standards}",
                         reason="standards_blob_unavailable")
              require(data, "standards_empty")
              return data

          try:
              source = os.environ.get("SOURCE", "")
              before = os.environ.get("BEFORE", "")
              require(sha.fullmatch(source) and source != "0" * 40, "invalid_source")
              require(sha.fullmatch(before) and before != "0" * 40, "invalid_before")
              require(os.environ.get("PUSH_REF") == "refs/heads/main", "not_main_push")
              require(git("symbolic-ref", "--quiet", "HEAD", reason="not_main_checkout") ==
                      b"refs/heads/main\n", "not_main_checkout")
              require(git("rev-parse", "--verify", "HEAD^{commit}",
                          reason="checkout_unavailable").strip() == source.encode(),
                      "source_checkout_mismatch")
              commit = source
              require(git("rev-parse", "--is-shallow-repository",
                          reason="history_unavailable").strip() == b"false",
                      "shallow_history")
              for revision in (before, source):
                  require(git("cat-file", "-t", revision,
                              reason="commit_unavailable").strip() == b"commit",
                          "commit_object_required")
              git("merge-base", "--is-ancestor", before, source,
                  reason="before_not_ancestor_or_history_missing")
              commits = git("rev-list", "--first-parent", "--reverse", f"{before}..{source}",
                            reason="range_unavailable").decode("ascii").splitlines()
              require(commits and commits[-1] == source and
                      all(sha.fullmatch(item) for item in commits), "invalid_range")
              parent = before
              commit = parent
              previous = standards_bytes(parent)
              for commit in commits:
                  # Inspect the actual direct parents, not a net diff or a
                  # first-parent traversal that could silently accept merges.
                  parents = git("rev-list", "--parents", "-n", "1", commit,
                                reason="parent_unavailable").split()
                  require(parents == [commit.encode(), parent.encode()],
                          "nonlinear_or_discontinuous_range")
                  git("diff", "--check", "--no-ext-diff", "--no-textconv", parent, commit,
                      "--", reason="commit_diff_check_failed")
                  current = standards_bytes(commit)
                  require(current.startswith(previous), "historical_standards_prefix_changed")
                  previous = current
                  parent = commit
              require(Path(standards).read_bytes() == previous, "checkout_standards_mismatch")
          except (InvalidRange, OSError, UnicodeError) as error:
              reason = str(error) if isinstance(error, InvalidRange) else "checkout_or_metadata_unavailable"
              print(f"SOURCE_CONTRACT_MISMATCH: commit={commit} first_error={reason}", file=sys.stderr)
              print("corrective_action=verify exact main push history and each commit; "
                    "do not amend or force-push published commits", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Reject false kernel-debug PASS and unsafe invocation syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/runtime/native/kernel-debug-main-range-test.py -v
          bash -n tests/tools/qualify-kernel-debug-owned.sh
          python3 -B tests/runtime/native/kernel-debug-qualification-test.py -v
          python3 -B tests/runtime/native/round093-native-evidence-collector-test.py -v
          python3 -B tests/tools/kernel-debug-qualify.py probe
          # Static and synthetic evidence is NOT a loaded instrumented-kernel PASS.
          echo "KERNEL_DEBUG_LOADED_KASAN_LOCKDEP=NOT_RUN (requires owned KASAN+lockdep host evidence)"
          echo "KERNEL_DEBUG_LOADED_KCSAN=NOT_RUN (requires separate owned KCSAN host evidence)"
          git diff --check

  sparse-compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install bounded compile-only prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential linux-headers-generic-hwe-24.04 curl
      - name: Run kernel sparse and optional installed Smatch
        shell: bash
        run: |
          set -euo pipefail
          # HWE 7.0 is required by the module; distro sparse 0.6.4 cannot
          # handle __typeof_unqual__ and Kbuild disables its CHECK phase.
          # Build exactly the Debian source release in CI (no host install).
          sparse_archive="build/tests/sparse-0.6.5-rc1.tar.gz"
          sparse_description="build/tests/sparse-0.6.5-rc1.dsc"
          sparse_source="$PWD/build/tests/sparse-0.6.5-rc1-src"
          mkdir -p build/tests "$sparse_source"
          curl --fail --location --silent --show-error --retry 3 \
            'https://deb.debian.org/debian/pool/main/s/sparse/sparse_0.6.5~rc1.orig.tar.gz' \
            --output "$sparse_archive"
          curl --fail --location --silent --show-error --retry 3 \
            'https://deb.debian.org/debian/pool/main/s/sparse/sparse_0.6.5~rc1-2.dsc' \
            --output "$sparse_description"
          # Debian's published archive MD5 gives an independent fixed
          # identity; the exact SHA256 is also checked against its .dsc.
          printf '%s  %s\n' '45c43188a3021711ef92f187729d0656' "$sparse_archive" | md5sum --check -
          expected_sha="$(awk '/^Checksums-Sha256:/{in_section=1;next} in_section && $3=="sparse_0.6.5~rc1.orig.tar.gz" { print $1; exit }' "$sparse_description")"
          [[ "$expected_sha" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$expected_sha" "$sparse_archive" | sha256sum --check -
          tar -xzf "$sparse_archive" -C "$sparse_source" --strip-components=1
          make -C "$sparse_source" -j2 sparse
          export PATH="$sparse_source:$PATH"
          sparse --version
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)"
          test -n "$KDIR"
          python3 -B tests/tools/kernel-debug-qualify.py static --kdir "$KDIR"
          echo "KERNEL_DEBUG_STATIC_COMPILE_ONLY_NO_MODULE_LOADING"
