name: "Round067 pinned native DM real suspend requeue replacement KUnit NO_AUTH (automatic non-VM source)"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-a-round067-original-dm-dispatch-runtime-noauth.yml'
      - '.github/workflows/phase-a-round067-original-dm-dispatch-runtime-noauth-source-push.yml'
      - 'tests/runtime/native/fixtures/round067-original-dm-dispatch-runtime.cfrag'
      - 'tests/tools/round067-stage-original-dm-dispatch-runtime.py'
      - 'tests/tools/round067-original-dm-runtime-host-verify.py'
      - 'docs/handoff/zswapz/round067/agent3-evidence.md'
permissions:
  contents: read
jobs:
  exact-new-C-source-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Strict actual new source-C and executed semantic mutants
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"
          git diff --check HEAD^ HEAD
          python3 -B tests/tools/round067-original-dm-runtime-host-verify.py
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('tests/tools/round067-stage-original-dm-dispatch-runtime.py').read_text())
          print('ROUND067_NATIVE_STAGE_PYTHON_SYNTAX_PASS')
          PY
      - name: Preserve complete prior and peer standards policy
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 -B tests/runtime/native/repository-policy-test.py --enforce
