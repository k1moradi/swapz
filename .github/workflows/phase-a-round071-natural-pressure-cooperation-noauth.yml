name: Round071 natural-pressure cooperation HOST policy no-auth
on:
  push:
    branches: [main]
    paths:
      - 'tests/runtime/native/fixtures/round071-natural-pressure-cooperation.c'
      - 'tests/tools/round071-natural-pressure-cooperation-verify.py'
      - 'src/kernel/codec.h'
      - 'src/kernel/zswap-import-codec.h'
      - 'src/kernel/zswap-direct-handoff.h'
      - 'tests/runtime/native/fixtures/round052-natural-pressure-scheduling.c'
      - 'docs/testing_standards.md'
      - '.github/workflows/phase-a-round071-natural-pressure-cooperation-noauth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gcc-clang-asan-ubsan-compiled-semantic-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact clean sole-main commit admission
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
      - name: Install unprivileged host compilation prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc clang liblz4-dev libssl-dev
      - name: Real read-only swapz headers, GCC and Clang strict sanitizer execution and 48 executed C mutants
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/tools/round071-natural-pressure-cooperation-verify.py \
            --json round071-evidence/host-policy.json \
            --ktap round071-evidence/host-policy.ktap
      - name: Preserve existing canonical testing standards prefix
        run: python3 -B tests/runtime/native/repository-policy-test.py --enforce
      - name: Attach explicitly HOST-MODEL-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round071-agent6-host-model-only
          path: round071-evidence/
          if-no-files-found: warn
