name: Original ticket stage and diagnostic regressions (no VM)
on:
  push:
    branches: [main]
    paths:
      - 'src/kernel/zswap-original-ticket.c'
      - 'src/kernel/zswap-original-ticket.h'
      - 'src/kernel/codec.c'
      - 'src/kernel/codec.h'
      - 'tests/runtime/native/fixtures/round086-original-ticket-kunit.c'
      - 'tests/tools/round086-original-ticket-kernel-verify.py'
      - '.github/workflows/phase-a-round086-original-ticket-kernel-noauth.yml'
permissions:
  contents: read
jobs:
  original-ticket-rootless-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          fetch-depth: 2
          persist-credentials: false
      - name: Exact main source and canonical standards before compilation
        working-directory: swapz
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD^)" = "$SWAPZ_PUSH_BEFORE_SHA"
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
          python3 -B tests/runtime/native/repository-policy-test.py --enforce
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          path: linux
          fetch-depth: 1
          persist-credentials: false
      - name: Pristine original stage preflight and exact postimages
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p round087-agent11-evidence
          verifier=swapz/tests/tools/round086-original-ticket-kernel-verify.py
          for phase in verify-only stage verify-stage; do
            python3 -B "$verifier" "$phase" --linux-root linux \
              --manifest "round087-agent11-evidence/$phase.json"
          done
          git -C linux diff --check
      - name: Rootless diagnostic extraction regressions before build
        run: python3 -B swapz/tests/tools/round086-original-ticket-kernel-verify.py diagnostic-regressions
      - name: Retain rootless stage and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-ticket-rootless-stage-no-vm
          path: round087-agent11-evidence/
          if-no-files-found: warn
          retention-days: 14
