name: Round092 Agent11 guarded module boundary host NO_AUTH
on:
  push:
    branches: [main]
    paths:
      - 'tests/tools/round092-original-module-boundary.patch'
      - 'tests/tools/round092-original-module-boundary-verify.py'
      - 'tests/runtime/native/fixtures/round092-original-module-boundary.c'
      - 'tests/runtime/native/fixtures/round092-module-shim.h'
      - '.github/workflows/phase-a-round092-original-module-boundary-host-noauth.yml'
permissions:
  contents: read
jobs:
  guarded-module-boundary-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source and canonical policy
        working-directory: swapz
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD^)" = "$SWAPZ_PUSH_BEFORE_SHA"
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
          python3 -B tests/runtime/native/repository-policy-test.py --enforce
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          previous = subprocess.check_output(["git", "show", "HEAD^:docs/testing_standards.md"])
          current = Path("docs/testing_standards.md").read_bytes()
          assert current.startswith(previous) and len(current) > len(previous)
          print("complete standards prefix", len(previous), len(current), hashlib.sha256(previous).hexdigest())
          PY
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          path: linux
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            mm/zswap.c
            mm/page_io.c
            include/linux/swap_ops.h
            include/linux/blk_types.h
            include/linux/bio.h
            block/bio.c
            mm/zsmalloc.c
            mm/swapfile.c
            mm/swap.h
            include/linux/swap.h
            include/linux/bvec.h
            include/linux/blkdev.h
            include/linux/workqueue.h
            include/crypto/acompress.h
            include/crypto/sha2.h
      - name: Stage exact frozen originals and qualify new module boundary helpers
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p round092-agent11-evidence
          python3 -B swapz/tests/tools/round092-original-module-boundary-verify.py \
            --linux linux --output round092-agent11-evidence
      - name: Retain exact-source bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round092-agent11-module-boundary-host
          path: round092-agent11-evidence/
          if-no-files-found: warn
          retention-days: 14
