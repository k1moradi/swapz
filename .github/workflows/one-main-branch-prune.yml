name: One main branch consolidation cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-main-branch-prune.yml'
      - '.github/scripts/prune-consolidated-branches.py'
      - 'docs/branch-consolidation-2026-10-13.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-main-branch-prune
  cancel-in-progress: false
jobs:
  prune-after-historical-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Safely prune only original branch heads with complete main ancestry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/prune-consolidated-branches.py
