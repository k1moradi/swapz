name: Round084 pinned original credential host and stage only NO_AUTH
on:
  push:
    branches: [main]
    paths:
      - 'tests/runtime/native/fixtures/round084-original-store-credential-*.cfrag'
      - 'tests/tools/round084-stage-original-store-credential.py'
      - 'tests/tools/round084-original-store-credential-verify.py'
      - '.github/workflows/phase-a-round084-original-store-credential-noauth.yml'
permissions:
  contents: read
jobs:
  original-credential-strict-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          fetch-depth: 2
          persist-credentials: false
      - name: Exact main source and canonical standards before any compiler
        working-directory: swapz
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD^)" = "$SWAPZ_PUSH_BEFORE_SHA"
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
          python3 -B tests/runtime/native/repository-policy-test.py --enforce
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          path: linux
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            mm/zswap.c
            mm/zsmalloc.c
            crypto/lz4.c
            crypto/lzo.c
            crypto/lzo-rle.c
            crypto/scompress.c
            include/crypto/acompress.h
            include/crypto/sha2.h
            include/linux/crc32.h
            lib/lzo/lzo1x_compress.c
            lib/lzo/lzo1x_compress_safe.c
            lib/lz4/lz4_compress.c
      - name: Actual pinned original stage plan and negative anchors
        run: |
          set -Eeuo pipefail
          python3 -B swapz/tests/tools/round084-stage-original-store-credential.py \
            --linux-root linux --manifest "$RUNNER_TEMP/r084-stage.json" --verify-only
      - name: Install ephemeral host compiler dependencies
        run: |
          set -Eeuo pipefail
          sudo -n apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gcc clang libssl-dev
      - name: Actual staged credential helper strict sanitizer baseline and semantic mutants
        run: python3 -B swapz/tests/tools/round084-original-store-credential-verify.py host
  original-credential-pinned-uml:
    needs: original-credential-strict-host
    name: Original host and source checks only (no VM)
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          fetch-depth: 2
          persist-credentials: false
      - name: Exact source parent and clean product
        working-directory: swapz
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD^)" = "$SWAPZ_PUSH_BEFORE_SHA"
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          path: linux
          fetch-depth: 1
          persist-credentials: false
      - name: Actual pristine original stage and exact postimage before build
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p round084-evidence
          python3 -B swapz/tests/tools/round084-stage-original-store-credential.py \
            --linux-root linux --manifest round084-evidence/stage.json --verify-only
          python3 -B swapz/tests/tools/round084-stage-original-store-credential.py \
            --linux-root linux --manifest round084-evidence/stage.json --stage
          python3 -B swapz/tests/tools/round084-stage-original-store-credential.py \
            --linux-root linux --manifest round084-evidence/stage.json --verify-stage
      - name: Retain source-only evidence (no VM)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round084-original-store-credential-native-source-only
          path: round084-evidence/
          if-no-files-found: warn
          retention-days: 14
