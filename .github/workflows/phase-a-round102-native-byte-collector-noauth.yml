name: Round105 private sealed evidence directed NO_AUTH
on:
  push:
    branches: [main]
    paths:
      - 'src/kernel/native-observation-adapter.c'
      - 'src/kernel/native-observation-adapter.h'
      - 'src/kernel/native-observation-owner.c'
      - 'src/kernel/native-observation-owner.h'
      - 'tests/tools/round103-private-byte-correlation.py'
      - 'tests/tools/round105-private-evidence.py'
      - 'tests/tools/round105-producer-shapes.py'
      - 'tests/runtime/native/fixtures/round105-private-evidence.c'
      - 'tests/runtime/native/round105-private-evidence-test.py'
      - 'tests/runtime/native/fixtures/round103-recorder-correlation.c'
      - 'tests/runtime/native/round103-recorder-correlation-test.py'
      - 'src/kernel/native-observation-byte-bridge.c'
      - 'src/kernel/native-observation-byte-bridge.h'
      - 'src/kernel/native-observation-integration.h'
      - 'tests/runtime/native/fixtures/round104-byte-bridge.c'
      - 'tests/runtime/native/round104-byte-bridge-test.py'
      - 'src/kernel/native-observation-byte-collector.c'
      - 'src/kernel/native-observation-byte-collector.h'
      - 'tests/tools/round102-private-byte-reference.py'
      - 'tests/runtime/native/fixtures/round102-byte-collector.c'
      - 'tests/runtime/native/fixtures/round102-byte-export-fixture.c'
      - 'tests/runtime/native/round102-private-byte-reference-test.py'
      - '.github/workflows/phase-a-round102-native-byte-collector-noauth.yml'
permissions:
  contents: read
jobs:
  private-evidence-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source, frozen oracle and complete standards prefix
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          umask 077
          evidence="$RUNNER_TEMP/round105-agent2"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$PUSH_BEFORE"
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
          freeze=ae7dc02e5db07fc6d133e02ffd558cb68c8e3159
          test "$(git rev-parse "$freeze^{tree}")" = 3cc943f1e9dd46d6174f18e5adf7519a7e2f3f7c
          for path in tests/tools/native-observation-byte-oracle.py \
                      tests/tools/native-observation-current-export.py \
                      tests/tools/native-observation-export.py \
                      tests/runtime/native/independent-byte-oracle-test.py \
                      tests/tools/round102-private-byte-reference.py \
                      src/kernel/native-observation-adapter.c \
                      src/kernel/native-observation-adapter.h \
                      tests/runtime/native/fixtures/native-observation-adapter-host-model.h \
                      tests/runtime/native/fixtures/native-observation-owner-host-model.h; do
            test "$(git hash-object "$path")" = "$(git rev-parse "$freeze:$path")"
          done
          test "$(git hash-object src/kernel/native-observation-integration.h)" = e3bca3367459c7f79960105f63e9ddef4e95b4d6
          python3 -B - <<'PY'
          from pathlib import Path
          import subprocess
          parent = subprocess.check_output(["git", "show", "HEAD^:docs/testing_standards.md"])
          current = Path("docs/testing_standards.md").read_bytes()
          assert current.startswith(parent) and len(current) > len(parent)
          print("complete standards prefix", len(parent), len(current))
          PY
          git rev-parse HEAD HEAD^ > "$evidence/source-parent.txt"
          git ls-files -s tests/tools/round105-private-evidence.py \
            tests/tools/round105-producer-shapes.py \
            tests/runtime/native/fixtures/round105-private-evidence.c \
            tests/runtime/native/round105-private-evidence-test.py \
            src/kernel/native-observation-adapter.{c,h} \
            src/kernel/native-observation-owner.{c,h} \
            src/kernel/native-observation-byte-bridge.{c,h} \
            src/kernel/native-observation-integration.h \
            tests/runtime/native/fixtures/round104-byte-bridge.c \
            tests/runtime/native/round104-byte-bridge-test.py \
            tests/tools/round103-private-byte-correlation.py \
            tests/runtime/native/fixtures/round103-recorder-correlation.c \
            tests/runtime/native/round103-recorder-correlation-test.py \
            src/kernel/native-observation-byte-collector.c \
            src/kernel/native-observation-byte-collector.h \
            tests/tools/round102-private-byte-reference.py \
            tests/runtime/native/fixtures/round102-byte-collector.c \
            tests/runtime/native/fixtures/round102-byte-export-fixture.c \
            tests/runtime/native/round102-private-byte-reference-test.py \
            .github/workflows/phase-a-round102-native-byte-collector-noauth.yml \
            > "$evidence/source-blobs.txt"
      - name: Provision real kernel build prerequisites on hosted runner
        run: |
          set -Eeuo pipefail
          sudo -n apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential binutils bc bison flex libelf-dev libssl-dev pkg-config clang \
            openssl perl python3 xz-utils cpio
          dpkg-query -W libelf-dev libssl-dev gcc binutils
      - name: Changed private export and combined frozen producer contracts
        run: |
          set -Eeuo pipefail
          umask 077
          evidence="$RUNNER_TEMP/round105-agent2"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          mkdir -p "$scratch/include/linux" "$scratch/include/crypto"
          for header in types atomic rcupdate build_bug limits string; do
            printf '#include "native-observation-adapter-host-model.h"\n' > "$scratch/include/linux/$header.h"
          done
          for header in export kernel mutex slab vmalloc; do
            printf '#include "native-observation-owner-host-model.h"\n' > "$scratch/include/linux/$header.h"
          done
          printf '#include "native-observation-owner-host-model.h"\n' > "$scratch/include/crypto/sha2.h"
          python3 -B tests/tools/round105-producer-shapes.py "$scratch/round105-producer-shapes.h" \
            2>&1 | tee "$evidence/producer-shapes.log"
          for cc in gcc clang; do
            "$cc" --version > "$evidence/$cc-version.txt"
            "$cc" -std=c2x -D_POSIX_C_SOURCE=200809L -DSWAPZ_NATIVE_OBSERVATION_ADAPTER \
              -DSWAPZ_TRIAL_OBSERVATION -DSWAPZ_ROUND104_INTEGRATION_TEST "-DSWAPZ_OBSERVATION_BUILD_SOURCE=\"$GITHUB_SHA\"" \
              -O2 -g -Wall -Wextra -Werror -Wpedantic -Wconversion -Wsign-conversion -Wshadow \
              -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer \
              -fno-pie -no-pie -pthread -I"$scratch/include" -I"$scratch" -Isrc/kernel \
              -Itests/runtime/native/fixtures src/kernel/native-observation-adapter.c \
              src/kernel/native-observation-owner.c src/kernel/native-observation-byte-collector.c \
              src/kernel/native-observation-byte-bridge.c \
              tests/runtime/native/fixtures/round105-private-evidence.c -lcrypto \
              -o "$scratch/correlation" 2>&1 | tee "$evidence/$cc-ordinal-compile.log"
            python3 -B tests/runtime/native/round105-private-evidence-test.py \
              "$GITHUB_SHA" "$scratch/correlation" 2>&1 | tee "$evidence/$cc-correlation.log"
          done
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          path: frozen-linux
          persist-credentials: false
      - name: Directed changed owner and bridge objects only, exact Linux SMP generated headers
        run: |
          set -Eeuo pipefail
          umask 077
          evidence="$RUNNER_TEMP/round105-agent2"
          linux="$GITHUB_WORKSPACE/frozen-linux"
          test "$(git -C "$linux" rev-parse HEAD)" = c339f4010dea8b0d754f84ace70cd1b089878ef8
          test -z "$(git -C "$linux" status --porcelain --untracked-files=all)"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          build="$scratch/build"
          component="$linux/mm/round105-byte-observation"
          test ! -e "$component"
          mkdir -p "$build" "$component"
          for stem in native-observation-adapter native-observation-owner native-observation-byte-collector native-observation-byte-bridge; do
            for suffix in c h; do
              name="$stem.$suffix"
              cp "src/kernel/$name" "$component/"
              test "$(git hash-object "$component/$name")" = "$(git rev-parse "HEAD:src/kernel/$name")"
            done
          done
          cp src/kernel/native-observation-integration.h "$component/"
          test "$(git hash-object "$component/native-observation-integration.h")" = e3bca3367459c7f79960105f63e9ddef4e95b4d6
          printf 'obj-y := native-observation-adapter.o native-observation-owner.o native-observation-byte-collector.o native-observation-byte-bridge.o\n' > "$component/Makefile"
          printf 'ccflags-y += -Werror -DSWAPZ_NATIVE_OBSERVATION_ADAPTER -DSWAPZ_TRIAL_OBSERVATION -DSWAPZ_ROUND104_INTEGRATION_TEST\n' >> "$component/Makefile"
          printf 'CFLAGS_native-observation-owner.o += -DSWAPZ_OBSERVATION_BUILD_SOURCE=\\"%s\\"\n' "$GITHUB_SHA" >> "$component/Makefile"
          printf '\nobj-y += round105-byte-observation/\n' >> "$linux/mm/Makefile"
          # Independent selected objects need only genuine original Linux
          # headers; no MM/DM overlay or same-round peer implementation.
          make_args=(-C "$linux" O="$build" ARCH=x86_64 CC=gcc)
          make "${make_args[@]}" allnoconfig 2>&1 | tee "$evidence/allnoconfig.log"
          "$linux/scripts/config" --file "$build/.config" --enable SMP --enable TREE_RCU \
            --enable MODULES --set-val NR_CPUS 4 --disable TINY_RCU --disable MODULE_SIG \
            --disable DEBUG_INFO --disable DEBUG_INFO_BTF
          make "${make_args[@]}" olddefconfig 2>&1 | tee "$evidence/olddefconfig.log"
          for key in SMP TREE_RCU MODULES; do grep -qx "CONFIG_$key=y" "$build/.config"; done
          grep -qx 'CONFIG_NR_CPUS=4' "$build/.config"
          if grep -qx 'CONFIG_TINY_RCU=y' "$build/.config"; then exit 1; fi
          cp "$build/.config" "$evidence/effective.config"
          make "${make_args[@]}" -j2 modules_prepare 2>&1 | tee "$evidence/prepare.log"
          for stem in native-observation-owner native-observation-byte-bridge; do
            make "${make_args[@]}" -j2 "mm/round105-byte-observation/$stem.o" \
              2>&1 | tee "$evidence/$stem-object.log"
            object="$build/mm/round105-byte-observation/$stem.o"
            test -s "$object"
            nm "$object" > "$evidence/$stem-symbols.txt"
            cp "$object" "$evidence/$stem.o"
          done
          grep -Eq ' T swapz_trial_observation_export_private$' "$evidence/native-observation-owner-symbols.txt"
          if grep -q '__ksymtab_swapz_trial_observation_export_private' "$evidence/native-observation-owner-symbols.txt"; then exit 1; fi
          grep -Eq ' T swapz_trial_observation_append_sequence$' "$evidence/native-observation-owner-symbols.txt"
          for symbol in bind_scope active stage_input finish_input event invalidate; do
            grep -Eq " T swapz_trial_byte_$symbol$" "$evidence/native-observation-byte-bridge-symbols.txt"
          done
          grep -F ' U swapz_byte_bridge_export' "$evidence/native-observation-owner-symbols.txt"
          (cd "$evidence"; sha256sum effective.config native-observation-*.o > SHA256SUMS; cat SHA256SUMS)
          printf 'PASS directed changed owner and bridge objects only; AUTH=0 Phase A BLOCKED\n'
      - name: Retain bounded redacted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round105-agent2-collector
          path: ${{ runner.temp }}/round105-agent2/
          if-no-files-found: warn
          retention-days: 14
