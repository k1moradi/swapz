name: Round067 actual original compressed memory lower read GC no-auth proof
on:
  push:
    branches: [main]
    paths:
      - 'src/kernel/authority.c'
      - 'src/kernel/authority.h'
      - 'tests/runtime/native/fixtures/round067-import-disk-payload-read.c'
      - 'tests/tools/round067-import-disk-payload-read-verify.py'
      - '.github/workflows/phase-a-round067-import-disk-payload-read-noauth.yml'
      - 'docs/testing_standards.md'
  workflow_dispatch:
jobs:
  source-bound-original-compressed-memory-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Original source exact sole main and whitespace
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
      - name: Install only disposable host LZO LZ4 and SHA link prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends liblzo2-dev liblz4-dev libssl-dev clang gcc
          test -f /usr/include/lzo/lzo1x.h
          test -f /usr/include/lz4.h
          test -f /usr/include/openssl/sha.h
      - name: Real production authority linked GCC Clang LZO1X LZ4 4096-byte decoder and 20 semantic mutants
        run: python3 -B tests/tools/round067-import-disk-payload-read-verify.py
      - name: Preserve exact Round066 real allocator pin retire GC mutants
        run: python3 -B tests/tools/round066-authority-import-owned-map-verify.py
      - name: Preserve Round059 original imported lifetime refusal
        run: python3 -B tests/tools/round059-authority-import-lifetime.py
      - name: Preserve Round057 actual product RAW 4096 CRC flush GC
        run: python3 -B tests/tools/round057-transaction-product.py
      - name: Enforce original canonical first-parent testing standards
        run: python3 -B tests/runtime/native/repository-policy-test.py --enforce
