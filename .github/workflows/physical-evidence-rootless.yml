name: Rootless physical evidence adversarial audit
on:
  push:
    branches: [main]
    paths:
      - 'tests/runtime/benchmark/physical-campaign-evidence.py'
      - 'tests/runtime/benchmark/qualification.py'
      - 'tests/runtime/benchmark/physical-campaign-evidence-test.py'
      - '.github/workflows/physical-evidence-rootless.yml'
      - 'docs/testing_standards.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial-physical-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The patch-hygiene step intentionally reads HEAD^.
          fetch-depth: 2
      - name: Synthetic-only adversarial physical evidence regression
        run: python3 -B tests/runtime/benchmark/physical-campaign-evidence-test.py -v
      - name: Validate committed patch whitespace
        run: git diff --check HEAD^ HEAD
