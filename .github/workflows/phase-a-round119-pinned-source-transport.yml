name: Round119 A10 pinned Linux source transport AUTH0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-a-round119-pinned-source-transport.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          fetch-depth: 0
          persist-credentials: false
      - name: Exact task and transport source
        working-directory: swapz
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$SWAPZ_PUSH_BEFORE_SHA"
          test "$SWAPZ_PUSH_BEFORE_SHA" = c80097ba6ed9f9a80a955726c802f138e27c53c8
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          test "$(git rev-parse c5237321d0eb01002cec990deebff60c6f39ac64^{tree})" = 327f200f9e45e4f06a335945cc8fbd6f41aa4f65
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
          test "$(git hash-object tests/tools/round119-pinned-source-transport.py)" = aa36a89b28c02f92eddc0b6e369e59886cbe1082
          test "$(git hash-object tests/runtime/native/round119-pinned-source-transport-test.py)" = d928211225a85fb1069f454e49cbcd0bc32395a8
          python3 -B tests/runtime/native/repository-policy-test.py --enforce
          python3 -B - <<'PYTHON'
          import ast, subprocess
          from pathlib import Path
          old = subprocess.check_output(["git", "show", "HEAD^:docs/testing_standards.md"])
          new = Path("docs/testing_standards.md").read_bytes()
          assert new.startswith(old) and len(new) > len(old)
          for path in ("tests/tools/round119-pinned-source-transport.py", "tests/runtime/native/round119-pinned-source-transport-test.py"):
              ast.parse(Path(path).read_bytes(), filename=path)
          PYTHON
          python3 -B tests/runtime/native/round119-pinned-source-transport-test.py
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          path: linux
          fetch-depth: 1
          persist-credentials: false
      - name: Export exact complete source and independently restore
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir evidence
          python3 -B swapz/tests/tools/round119-pinned-source-transport.py export linux transport > evidence/export.json
          python3 -B swapz/tests/tools/round119-pinned-source-transport.py restore transport restored > evidence/restore.json
          cp transport/manifest.json evidence/manifest.json
          cat evidence/restore.json
          git --version
          python3 --version
          for tool in gcc make ld as nm readelf objdump bc bison flex perl pkg-config openssl cpio xz modinfo; do
            if command -v "$tool" >/dev/null; then printf '%s available\n' "$tool"; else printf '%s missing\n' "$tool"; fi
          done > evidence/toolchain.txt
          gcc --version >> evidence/toolchain.txt
          make --version >> evidence/toolchain.txt
          ld --version >> evidence/toolchain.txt
          for library in libelf openssl; do
            if pkg-config --exists "$library"; then pkg-config --modversion "$library" >> evidence/toolchain.txt; else printf '%s missing\n' "$library" >> evidence/toolchain.txt; fi
          done
      - name: Upload verified source manifest and restore evidence
        uses: actions/upload-artifact@v4
        with:
          name: round119-source-manifest
          path: evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source chunk 00
        if: success() && hashFiles('transport/chunk-00.packpart') != ''
        uses: actions/upload-artifact@v4
        with:
          name: round119-source-chunk-00
          path: transport/chunk-00.packpart
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
