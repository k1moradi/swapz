name: Round090 selected-DM composed source host
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-a-round088-selected-dm-admission-host.yml'
      - 'tests/tools/round088-selected-dm-admission-verify.py'
      - 'tests/tools/round088-original-dm-selected-clone.patch'
      - 'tests/tools/round089-selected-dm-registry-verify.py'
      - 'tests/tools/round090-selected-dm-composition-verify.py'
permissions:
  contents: read
jobs:
  selected-dm-source-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source and canonical policy
        working-directory: swapz
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          test "$(git rev-parse HEAD^)" = "$SWAPZ_PUSH_BEFORE_SHA"
          test -z "$(git status --porcelain)"
          git diff --check "$SWAPZ_PUSH_BEFORE_SHA" HEAD
          python3 -B tests/runtime/native/repository-policy-test.py --enforce
      - name: Exact target source strict C guard and semantic mutants
        working-directory: swapz
        run: |
          set -Eeuo pipefail
          python3 -B tests/tools/round088-selected-dm-admission-verify.py
          python3 -B tests/tools/round089-selected-dm-registry-verify.py
          python3 -B tests/tools/round090-selected-dm-composition-verify.py
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          path: linux
          fetch-depth: 1
          sparse-checkout: |
            drivers/md/dm.c
            include/linux/bvec.h
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Pristine original DM patch applicability and exact postimage
        run: |
          set -Eeuo pipefail
          test "$(git -C linux rev-parse HEAD)" = c339f4010dea8b0d754f84ace70cd1b089878ef8
          test "$(git -C linux hash-object drivers/md/dm.c)" = 1881d86111fb2e655893ad898cf21b88f0e4e7f3
          test "$(git -C linux hash-object include/linux/bvec.h)" = b63914ff56e33df302055fabf2a84ba490bc8d2c
          patch="$GITHUB_WORKSPACE/swapz/tests/tools/round088-original-dm-selected-clone.patch"
          git -C linux apply --check "$patch"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          mkdir -p "$scratch/drivers/md"
          cp linux/drivers/md/dm.c "$scratch/drivers/md/dm.c"
          (
            cd "$scratch"
            git apply --check "$patch"
            git apply "$patch"
            if grep -n 'bi_bvec_done' drivers/md/dm.c; then exit 1; fi
            test "$(git hash-object drivers/md/dm.c)" = 554dd8215ec6be0cfeaa016ca25e772ac6d363ff
            git apply --reverse "$patch"
            test "$(git hash-object drivers/md/dm.c)" = 1881d86111fb2e655893ad898cf21b88f0e4e7f3
          )
          test -z "$(git -C linux status --porcelain)"
          echo ROUND090_ORIGINAL_DM_PATCH_APPLICABLE_POSTIMAGE_VERIFIED_NOT_COMPILED_AUTH0
