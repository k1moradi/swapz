name: "Round093 shared storage value handles HOST ONLY NO_AUTH"
on:
  push:
    branches: [main]
    paths:
      - "src/kernel/zswap-original-storage-value.c"
      - "src/kernel/zswap-original-storage-value.h"
      - "tests/runtime/native/fixtures/round092-shared-storage-value.c"
      - "tests/tools/round092-shared-storage-value-verify.py"
      - ".github/workflows/phase-a-round092-shared-storage-value-host-noauth.yml"
permissions:
  contents: read
jobs:
  shared-storage-value-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact main source and actual storage value ABI sanitizer qualification
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 -B tests/tools/round092-shared-storage-value-verify.py "$RUNNER_TEMP/agent5-value"
      - name: Preserve result and private first cause
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round093-agent5-shared-storage-value
          path: ${{ runner.temp }}/agent5-value
          if-no-files-found: warn
          retention-days: 14
