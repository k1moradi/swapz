name: "Round094 shared storage value handles HOST ONLY NO_AUTH"
on:
  push:
    branches: [main]
    paths:
      - "src/kernel/zswap-original-storage-value.c"
      - "src/kernel/zswap-original-storage-value.h"
      - "tests/runtime/native/fixtures/round092-shared-storage-value.c"
      - "tests/tools/round092-shared-storage-value-verify.py"
      - "tests/runtime/native/fixtures/round094-shared-storage-real-decoder.c"
      - "tests/tools/round094-shared-storage-real-decoder-verify.py"
      - ".github/workflows/phase-a-round092-shared-storage-value-host-noauth.yml"
permissions:
  contents: read
jobs:
  shared-storage-value-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact main source and actual storage value ABI sanitizer qualification
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 -B tests/tools/round092-shared-storage-value-verify.py "$RUNNER_TEMP/agent5-value"
      - name: Preserve result and private first cause
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round094-agent5-shared-storage-value-modeled
          path: ${{ runner.temp }}/agent5-value
          if-no-files-found: warn
          retention-days: 14
  shared-storage-real-decoder-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          path: original-linux
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            mm/zswap.c
            crypto/lzo.c
            crypto/lz4.c
            include/linux/lzo.h
            include/linux/lz4.h
            lib/lzo/lzo1x_compress.c
            lib/lzo/lzo1x_compress_safe.c
            lib/lzo/lzo1x_decompress_safe.c
            lib/lzo/lzodefs.h
            lib/lz4/lz4_compress.c
            lib/lz4/lz4_decompress.c
            lib/lz4/lz4defs.h
      - name: Actual pinned storage and original codecs, RAM lower only
        working-directory: swapz
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 -B tests/tools/round094-shared-storage-real-decoder-verify.py ../original-linux "$RUNNER_TEMP/agent5-real"
      - name: Retain private first cause and real join verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round094-agent5-shared-storage-real-decoder
          path: ${{ runner.temp }}/agent5-real
          if-no-files-found: warn
          retention-days: 14
