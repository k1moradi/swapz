name: "Phase A pinned Linux zswap provenance source prototype"

on:
  push:
    paths:
      - ".github/workflows/phase-a-zswap-origin-prototype.yml"
      - "tests/tools/stage-pinned-linux-zswap-origin.py"
      - "tests/runtime/native/pinned-linux-zswap-origin-stage-test.py"
      - "tests/runtime/native/pinned-linux-zswap-compressed-handoff-test.py"
      - "tests/runtime/native/pinned-linux-origin-paired-module-test.py"
      - "src/kernel/dm-target.c"
      - "tests/runtime/native/zswap-origin-consumer-source-test.py"
      - "tests/runtime/native/zswap-origin-producer-consumer-abi-test.py"
      - "tests/runtime/native/zswap-origin-owned-ram-qualification.py"
      - "tests/runtime/native/zswap-origin-loaded-evidence-contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modified-linux-producer-objects:
    name: "Modified pinned Linux CONFIG_ZSWAP=y/n and matched dm-swapz module Kbuild"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: "Initialize fail-closed evidence even if checkout fails"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zswap-origin-evidence"
          for profile in enabled disabled; do
            printf 'result=NOT_RUN\nreason=checkout_or_source_staging_not_completed\n' \
              > "$RUNNER_TEMP/zswap-origin-evidence/$profile.txt"
          done
      - name: "Checkout committed swapz staging program (read only)"
        uses: actions/checkout@v4
        with:
          path: swapz
          persist-credentials: false
      - name: "Checkout exact full upstream Linux source (read only)"
        uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          fetch-depth: 1
          path: linux
          persist-credentials: false
      - name: "Install pinned Linux and external module Kbuild host prerequisites"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends build-essential bc bison flex \
            libelf-dev libssl-dev kmod binutils
      - name: "Run source-controlled rootless staging regression"
        shell: bash
        run: |
          set -euo pipefail
          python3 -B swapz/tests/runtime/native/pinned-linux-zswap-origin-stage-test.py \
            > "$RUNNER_TEMP/zswap-origin-rootless.log" 2>&1 || {
            result=$?
            echo "::error::Producer source staging regression failed (exit $result)"
            tail -n 35 "$RUNNER_TEMP/zswap-origin-rootless.log"
            exit "$result"
          }
      - name: "Run actual DM origin and compiled once-only foreground-commit source regressions"
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            swapz/tests/runtime/native/zswap-origin-consumer-source-test.py \
            swapz/tests/runtime/native/zswap-origin-producer-consumer-abi-test.py; do
            if python3 -B "$script" > "$RUNNER_TEMP/zswap-origin-dm-contract.log" 2>&1; then
              :
            else
              result=$?
              echo "::error::Matched consumer source/ABI regression failed (exit $result)"
              tail -n 35 "$RUNNER_TEMP/zswap-origin-dm-contract.log"
              exit "$result"
            fi
          done
      - name: "Run read-only owned-RAM provenance and 4096-byte guard"
        shell: bash
        run: |
          set -euo pipefail
          runner=swapz/tests/runtime/native/zswap-origin-owned-ram-qualification.py
          log_file="$RUNNER_TEMP/zswap-origin-owned-ram-rootless.log"
          if python3 -B "$runner" --self-test > "$log_file" 2>&1; then
            :
          else
            first_exit=$?
            echo "::error::Owned RAM offline contract regression failed (exit $first_exit)"
            tail -n 20 "$log_file"
            exit "$first_exit"
          fi
          # This must refuse even in an untrusted hosted runner; a source
          # compiler/build never grants live-swap, mapper or module ownership.
          if python3 -B "$runner" --preflight > "$log_file" 2>&1; then
            first_exit=0
          else
            first_exit=$?
          fi
          if [[ "$first_exit" != 2 ]] ||
             ! grep -q '^ENVIRONMENT_NOT_QUALIFIED first_cause=' "$log_file" ||
             ! grep -Fxq 'LOADED_STORED_ENTRY=NOT_RUN' "$log_file" ||
             ! grep -Fxq '4096_READBACK=NOT_RUN' "$log_file" ||
             ! grep -Fxq 'PHASE_A=BLOCKED PHASE_B=DISABLED DIRECT_COMPRESSED=DISABLED' "$log_file"; then
            echo "::error::Unsafe owned-RAM preflight result (exit $first_exit)"
            exit 3
          fi
      - name: "Run untrusted loaded-candidate identity/ownership negative regressions"
        shell: bash
        run: |
          set -euo pipefail
          candidate_guard=swapz/tests/runtime/native/zswap-origin-loaded-evidence-contract.py
          candidate_log="$RUNNER_TEMP/zswap-origin-loaded-candidate-rootless.log"
          if python3 -B "$candidate_guard" --self-test > "$candidate_log" 2>&1; then
            :
          else
            first_exit=$?
            echo "::error::Loaded candidate identity/ownership tests failed (exit $first_exit)"
            tail -n 20 "$candidate_log"
            exit "$first_exit"
          fi
          # Empty input is an unsafe candidate, never a loaded-kernel PASS.
          candidate_file="$RUNNER_TEMP/zswap-origin-loaded-untrusted.json"
          : > "$candidate_file"
          if python3 -B "$candidate_guard" --inspect-candidate "$candidate_file" \
              --expected-source-sha "$GITHUB_SHA" > "$candidate_log" 2>&1; then
            candidate_exit=0
          else
            candidate_exit=$?
          fi
          if [[ "$candidate_exit" != 2 ]] ||
             ! grep -Fxq 'ENVIRONMENT_NOT_QUALIFIED first_cause=manifest_file_type_or_size' "$candidate_log" ||
             ! grep -Fxq 'LOADED_STORED_ENTRY=NOT_RUN' "$candidate_log" ||
             ! grep -Fxq '4096_READBACK=NOT_RUN' "$candidate_log" ||
             ! grep -Fxq 'PHASE_A=BLOCKED PHASE_B=DISABLED DIRECT_COMPRESSED=DISABLED' "$candidate_log"; then
            echo "::error::Loaded candidate refused to fail closed (exit $candidate_exit)"
            exit 3
          fi
      - name: "Run disabled compressed handoff source/ownership negative regression"
        shell: bash
        run: |
          set -euo pipefail
          python3 -B swapz/tests/runtime/native/pinned-linux-zswap-compressed-handoff-test.py \
            > "$RUNNER_TEMP/zswap-origin-compressed-rootless.log" 2>&1 || {
            result=$?
            echo "::error::Disabled compressed source contract failed (exit $result)"
            tail -n 35 "$RUNNER_TEMP/zswap-origin-compressed-rootless.log"
            exit "$result"
          }
      - name: "Run matched source/module verifier regressions on full workflow"
        shell: bash
        run: |
          set -euo pipefail
          python3 -B swapz/tests/runtime/native/pinned-linux-origin-paired-module-test.py \
            --self-test --workflow "$PWD/swapz/.github/workflows/phase-a-zswap-origin-prototype.yml" \
            > "$RUNNER_TEMP/zswap-origin-paired-rootless.log" 2>&1 || {
            result=$?
            echo "::error::Paired Kbuild rootless source regression failed (exit $result)"
            tail -n 35 "$RUNNER_TEMP/zswap-origin-paired-rootless.log"
            exit "$result"
          }
      - name: "Modify actual pinned Linux C and H in disposable full checkout"
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/zswap-origin-evidence"
          if ! python3 -B swapz/tests/tools/stage-pinned-linux-zswap-origin.py \
              --linux-root linux --manifest "$evidence_dir/source-manifest.json" \
              --with-round024-zswap-kbuild-probe; then
            echo "::error::Exact Linux identity/blob or source staging failure"
            exit 1
          fi
          git -C linux diff --check -- \
            mm/zswap.c mm/page_io.c include/linux/swap_ops.h \
            include/linux/blk_types.h include/linux/bio.h block/bio.c
          # Exact changed-path allowlist; reject foreign, missing or unexpected changes.
          expected="$(printf '%s\n' block/bio.c include/linux/bio.h \
            include/linux/blk_types.h include/linux/swap_ops.h mm/page_io.c mm/zswap.c)"
          actual="$(git -C linux diff --name-only | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Unexpected modified Linux source paths"
            exit 1
          fi
          printf 'source_stage=PASS\nsource_modified=yes\n' \
            > "$evidence_dir/staging-status.txt"
      - name: "Build modified Linux and matched source-linked swapz module for both configurations"
        shell: bash
        env:
          KBUILD_JOBS: "2"
        run: |
          set -Eeuo pipefail
          evidence_dir="$RUNNER_TEMP/zswap-origin-evidence"
          current_manifest="$evidence_dir/setup.txt"
          current_phase=initialization
          log_file="$RUNNER_TEMP/zswap-origin-build.log"
          trap 'code=$?; if (( code != 0 )); then printf "result=FAIL\nfirst_failure_phase=%s\nfirst_failure_exit_code=%d\n" "$current_phase" "$code" >> "$current_manifest"; fi' EXIT

          if [[ "$KBUILD_JOBS" != 2 ]]; then
            echo "::error::Kbuild resource bound changed"
            exit 2
          fi
          git -C linux rev-parse HEAD | grep -Fx \
            'c339f4010dea8b0d754f84ace70cd1b089878ef8' >/dev/null
          if [[ ! -s "$evidence_dir/source-manifest.json" ]]; then
            echo "::error::Modified Linux C/H manifest is missing"
            exit 1
          fi
          current_phase=verify_swapz_checkout
          swapz_sha="$(git -C swapz rev-parse HEAD)"
          if [[ "$swapz_sha" != "$GITHUB_SHA" ]] ||
             [[ -n "$(git -C swapz status --porcelain --untracked-files=all)" ]] ||
             [[ ! -f swapz/src/kernel/Makefile ]] ||
             [[ ! -f swapz/src/kernel/dm-target.c ]]; then
            echo "::error::Source-linked swapz checkout SHA, cleanliness or source mismatch"
            exit 1
          fi
          current_phase=verify_stock_bio_preimage
          stock_bio_header="$RUNNER_TEMP/zswap-origin-stock-bio.h"
          git -C linux show HEAD:include/linux/bio.h > "$stock_bio_header"
          if grep -Fq 'BIO_HAS_ZSWAP_STORED_WRITEBACK_ORIGIN' "$stock_bio_header" ||
             ! grep -Fxq '#define BIO_HAS_ZSWAP_STORED_WRITEBACK_ORIGIN 1' \
               linux/include/linux/bio.h; then
            echo "::error::BIO origin capability missing from staged source or present in stock"
            exit 1
          fi
          build_info_source="$RUNNER_TEMP/zswap-origin-build-info.h"
          printf '#define SWAPZ_BUILD_SOURCE_SHA "%s"\n#define SWAPZ_BUILD_SOURCE_CLEAN 1\n#define SWAPZ_BUILD_SOURCE_CLEAN_STRING "1"\n' \
            "$swapz_sha" > "$build_info_source"
          build_info_sha256="$(sha256sum "$build_info_source" | cut -d' ' -f1)"
          # No commands below write to live block devices or running kernel.
          run_logged() {
            local command_name="$1" command_exit_code=0 warning_count=0
            shift
            current_phase="$command_name"
            printf '%s_command=' "$command_name" >> "$current_manifest"
            printf '%q ' "$@" >> "$current_manifest"
            printf '\n' >> "$current_manifest"
            if "$@" > "$log_file" 2>&1; then
              command_exit_code=0
            else
              command_exit_code=$?
            fi
            printf '%s_exit_code=%d\n' "$command_name" "$command_exit_code" \
              >> "$current_manifest"
            if (( command_exit_code != 0 )); then
              echo "::error::Modified Linux $profile $command_name failed ($command_exit_code)"
              tail -n 30 "$log_file"
              return "$command_exit_code"
            fi
            # W=1 diagnostics are not silently reclassified as green linked builds.
            warning_count="$(grep -Eic '(^|[[:space:]])warning:' "$log_file" || true)"
            printf '%s_warning_count=%s\n' "$command_name" "$warning_count" \
              >> "$current_manifest"
            if [[ "$command_name" == swapz_module_kbuild ]]; then
              printf 'module_warning_count=%s\n' "$warning_count" >> "$current_manifest"
            fi
            if [[ "$command_name" == kernel_export_build ]]; then
              # Only exact pinned unmodified upstream kernel-doc diagnostics
              # may be accepted. Modified producer and GCC warnings still fail.
              current_phase=kernel_export_build_warnings
              if ! python3 -B swapz/tests/runtime/native/pinned-linux-origin-paired-module-test.py \
                  --classify-kernel-doc-warnings --kernel-log "$log_file" \
                  --linux-root "$PWD/linux" \
                  --source-manifest "$evidence_dir/source-manifest.json" \
                  --source-sha "$(git -C linux rev-parse HEAD)" \
                  --profile "$requested_zswap" \
                  --kernel-export-exit "$command_exit_code" >> "$current_manifest"; then
                echo "::error::Modified Linux $profile kernel exporter baseline warning gate failed"
                tail -n 30 "$log_file"
                return 3
              fi
            elif (( warning_count != 0 )); then
              current_phase="${command_name}_warnings"
              echo "::error::Modified Linux $profile $command_name emitted warnings"
              tail -n 30 "$log_file"
              return 3
            fi
          }

          for profile in enabled disabled; do
            current_manifest="$evidence_dir/$profile.txt"
            build_dir="$RUNNER_TEMP/zswap-origin-build-$profile"
            mkdir -p "$build_dir"
            requested_zswap=y
            option=--enable
            expected_config=CONFIG_ZSWAP=y
            if [[ "$profile" == disabled ]]; then
              requested_zswap=n
              option=--disable
              expected_config='# CONFIG_ZSWAP is not set'
            fi
            {
              printf 'build_state=IN_PROGRESS\nsource_repository=torvalds/linux\n'
              printf 'source_sha=c339f4010dea8b0d754f84ace70cd1b089878ef8\n'
              printf 'source_modified=yes\nrequested_zswap=%s\n' "$requested_zswap"
              printf 'swapz_sha=%s\nmodule_build_source_sha=%s\nmodule_build_source_clean=1\n' \
                "$swapz_sha" "$swapz_sha"
              printf 'compiler=%s\n' "$(gcc --version | sed -n '1p')"
              printf 'kbuild_jobs=%s\nkbuild_warning_level=1\n' "$KBUILD_JOBS"
              printf 'evidence_class=HOSTED_PATCHED_LINUX_MATCHED_SWAPZ_MODULE_KBUILD\n'
              printf 'phase_a_qualified=no\nphase_b_enabled=no\n'
            } > "$current_manifest"
            run_logged defconfig make -s -C linux "O=$build_dir" CC=gcc defconfig
            run_logged scripts_config linux/scripts/config --file "$build_dir/.config" \
              --enable SWAP "$option" ZSWAP \
              --enable MODULES --enable MD --enable BLK_DEV_DM --enable CRYPTO_LZ4
            run_logged olddefconfig make -s -C linux "O=$build_dir" CC=gcc olddefconfig
            current_phase=verify_effective_configuration
            if ! grep -Fxq 'CONFIG_SWAP=y' "$build_dir/.config" || \
               ! grep -Fxq "$expected_config" "$build_dir/.config" ||
               ! grep -Fxq 'CONFIG_MODULES=y' "$build_dir/.config" ||
               ! grep -Fxq 'CONFIG_BLK_DEV_DM=y' "$build_dir/.config" ||
               ! grep -Fxq 'CONFIG_CRYPTO_LZ4=y' "$build_dir/.config" ||
               ! grep -Fxq 'CONFIG_LZ4_COMPRESS=y' "$build_dir/.config" ||
               ! grep -Fxq 'CONFIG_LZ4_DECOMPRESS=y' "$build_dir/.config"; then
              echo "::error::Effective CONFIG_SWAP/ZSWAP/DM/LZ4 configuration fallback"
              exit 1
            fi
            printf 'effective_swap=y\neffective_zswap=%s\n' "$requested_zswap" \
              >> "$current_manifest"
            printf 'effective_modules=y\neffective_blk_dev_dm=y\n' >> "$current_manifest"
            printf 'effective_crypto_lz4=y\neffective_lz4_compress=y\neffective_lz4_decompress=y\n' \
              >> "$current_manifest"
            printf 'config_sha256=%s\n' \
              "$(sha256sum "$build_dir/.config" | cut -d' ' -f1)" \
              >> "$current_manifest"
            run_logged prepare make -s -C linux "O=$build_dir" CC=gcc \
              "-j$KBUILD_JOBS" W=1 prepare
            current_phase=verify_kbuild_recorded_compiler
            recorded_compiler="$(sed -n 's/^CONFIG_CC_VERSION_TEXT=//p' \
              "$build_dir/include/config/auto.conf")"
            if [[ "$recorded_compiler" != *gcc* ]]; then
              echo "::error::Kernel Kbuild compiler did not match GCC"
              exit 1
            fi
            printf 'kbuild_recorded_compiler=%s\n' "$recorded_compiler" >> "$current_manifest"
            objects=(mm/page_io.o block/bio.o)
            if [[ "$profile" == enabled ]]; then
              objects+=(mm/zswap.o)
            fi
            run_logged compile_objects make -s -C linux "O=$build_dir" CC=gcc \
              "-j$KBUILD_JOBS" W=1 "${objects[@]}"
            current_phase=verify_compiled_postimage_objects
            for object in "${objects[@]}"; do
              if [[ ! -s "$build_dir/$object" ]]; then
                echo "::error::Compiled modified object missing: $object"
                exit 1
              fi
              printf 'object=%s sha256=%s\n' "$object" \
                "$(sha256sum "$build_dir/$object" | cut -d' ' -f1)" \
                >> "$current_manifest"
            done
            if [[ "$profile" == disabled && -e "$build_dir/mm/zswap.o" ]]; then
              echo "::error::ZSWAP-disabled build unexpectedly emitted zswap object"
              exit 1
            fi
            # A source-anchored unused producer function must actually be
            # compiled under explicit CI-only flags, then removed from the
            # default object before complete kernel and matched module build.
            if [[ "$profile" == enabled ]]; then
              current_phase=round024_default_producer_off
              if nm -a "$build_dir/mm/zswap.o" |
                  grep -q 'zswap_swapz_round024_producer_kbuild_probe'; then
                echo "::error::Default producer includes compile-only probe" >&2
                exit 1
              fi
              run_logged round024_producer_probe make -s -C linux \
                "O=$build_dir" CC=gcc "-j$KBUILD_JOBS" W=1 \
                KCFLAGS="-DSWAPZ_ROUND024_ZSWAP_KBUILD_PROBE=1 -Werror" mm/zswap.o
              current_phase=round024_verify_original_compiler_object
              if ! nm -a "$build_dir/mm/zswap.o" |
                  grep -q 'zswap_swapz_round024_producer_kbuild_probe'; then
                echo "::error::No original pinned mm/zswap.o probe symbol" >&2
                exit 1
              fi
              run_logged round024_producer_restore_default make -s -C linux \
                "O=$build_dir" CC=gcc "-j$KBUILD_JOBS" W=1 \
                KCFLAGS=-Werror mm/zswap.o
              current_phase=round024_verify_default_restore
              if nm -a "$build_dir/mm/zswap.o" |
                  grep -q 'zswap_swapz_round024_producer_kbuild_probe'; then
                echo "::error::Compile-only producer leaked into default build" >&2
                exit 1
              fi
              echo "ROUND024_PINNED_ZSWAP_PRODUCER_REAL_KBUILD_DEFAULT_OFF"
            fi
            # A matched external .ko needs the *same modified* kernel's complete
            # exported symbols. Neither modules_prepare nor vmlinux alone is enough.
            run_logged modules_prepare make -s -C linux "O=$build_dir" CC=gcc \
              "-j$KBUILD_JOBS" W=1 modules_prepare
            run_logged kernel_export_build make -s -C linux "O=$build_dir" CC=gcc \
              "-j$KBUILD_JOBS" W=1 vmlinux
            run_logged kernel_export_modules make -s -C linux "O=$build_dir" CC=gcc \
              "-j$KBUILD_JOBS" W=1 modules
            current_phase=verify_complete_kernel_exports
            if [[ ! -s "$build_dir/Module.symvers" ]]; then
              echo "::error::Modified Linux complete Module.symvers is missing or empty"
              exit 1
            fi
            printf 'module_symvers_sha256=%s\n' \
              "$(sha256sum "$build_dir/Module.symvers" | cut -d' ' -f1)" \
              >> "$current_manifest"
            kernel_release="$(make -s -C linux "O=$build_dir" CC=gcc kernelrelease)"
            if [[ -z "$kernel_release" ]]; then
              echo "::error::Paired kernel release identity missing"
              exit 1
            fi
            printf 'kernel_release=%s\n' "$kernel_release" >> "$current_manifest"

            # Prevent a prior profile's or earlier run's module from satisfying
            # this linked Kbuild; each disposable stage has a distinct path.
            module_stage="$RUNNER_TEMP/zswap-origin-module-$profile"
            mkdir -p "$module_stage"
            rm -f "$module_stage/dm-swapz.ko"
            run_logged swapz_module_kbuild make -s -C swapz/src/kernel \
              "KDIR=$build_dir" "SWAPZ_STAGE=$module_stage" \
              "SWAPZ_BUILD_INFO=$build_info_source" CC=gcc \
              "-j$KBUILD_JOBS" W=1 all
            current_phase=verify_linked_module_exists
            module_artifact="$module_stage/dm-swapz.ko"
            if [[ ! -s "$module_artifact" ]]; then
              echo "::error::Matched patched Linux did not link dm-swapz.ko"
              exit 1
            fi
            printf 'module_linked=yes\nmodule_bytes=%s\nmodule_sha256=%s\n' \
              "$(stat -c '%s' "$module_artifact")" \
              "$(sha256sum "$module_artifact" | cut -d' ' -f1)" \
              >> "$current_manifest"
            printf 'build_info_sha256=%s\n' "$build_info_sha256" >> "$current_manifest"
            current_phase=verify_elf_structure
            if ! readelf -h "$module_artifact" > "$log_file" 2>&1 ||
               ! grep -Eq 'Class:[[:space:]]+ELF64' "$log_file" ||
               ! grep -Eq 'Type:[[:space:]]+REL' "$log_file"; then
              echo "::error::Linked module is not a valid ELF64 relocatable"
              tail -n 15 "$log_file"
              exit 1
            fi
            current_phase=verify_patched_source_still_exact
            expected="$(printf '%s\n' block/bio.c include/linux/bio.h \
              include/linux/blk_types.h include/linux/swap_ops.h mm/page_io.c mm/zswap.c)"
            actual="$(git -C linux diff --name-only | LC_ALL=C sort)"
            if [[ "$actual" != "$expected" ]] ||
               [[ -n "$(git -C linux ls-files --others --exclude-standard)" ]] ||
               [[ "$(git -C linux rev-parse HEAD)" != \
                  c339f4010dea8b0d754f84ace70cd1b089878ef8 ]] ||
               [[ "$(git -C swapz rev-parse HEAD)" != "$swapz_sha" ]] ||
               [[ -n "$(git -C swapz status --porcelain --untracked-files=all)" ]]; then
              echo "::error::Modified source allowlist or swapz checkout changed after build"
              exit 1
            fi
            printf 'kunit=NOT_RUN_NO_DEDICATED_PINNED_KUNIT_CASE\n' >> "$current_manifest"
            current_phase=verify_matched_paired_artifacts
            python3 -B swapz/tests/runtime/native/pinned-linux-origin-paired-module-test.py \
              --manifest "$current_manifest" \
              --source-manifest "$evidence_dir/source-manifest.json" \
              --linux-root "$PWD/linux" --stock-bio-header "$stock_bio_header" \
              --build-dir "$build_dir" --module-stage "$module_stage" \
              --swapz-root "$PWD/swapz" --profile "$requested_zswap" \
              --swapz-sha "$swapz_sha"
            printf 'result=PASS\n' >> "$current_manifest"
          done
          current_manifest=""
      - name: "Retain source, build and first-failure evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "phase-a-zswap-origin-modified-linux-prototype"
          path: |
            ${{ runner.temp }}/zswap-origin-evidence/*.txt
            ${{ runner.temp }}/zswap-origin-evidence/*.json
          if-no-files-found: ignore
          retention-days: 7
