name: Round074 original natural eviction lease copy-budget host no-auth
on:
  push:
    branches: [main]
    paths:
      - 'tests/runtime/native/fixtures/round074-eviction-lease-copy-budget.c'
      - 'tests/tools/round074-eviction-lease-copy-budget-verify.py'
      - 'src/kernel/codec.h'
      - 'src/kernel/zswap-import-codec.h'
      - 'src/kernel/zswap-import-admission.h'
      - 'src/kernel/zswap-direct-handoff.h'
      - '.github/workflows/phase-a-round074-eviction-lease-copy-budget-host-noauth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gcc-clang-asan-ubsan-original-lease-copy-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact clean source SHA and no-whitespace-drift admission
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
      - name: Install unprivileged host-only C build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc clang liblz4-dev libssl-dev
      - name: Actual read-only product headers GCC Clang strict ASan UBSan 50 executed semantic C mutants
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/tools/round074-eviction-lease-copy-budget-verify.py \
            --json round074-evidence/agent6-host-policy.json \
            --ktap round074-evidence/agent6-host-policy.ktap
      - name: Exact-source canonical first-parent testing standard
        run: python3 -B tests/runtime/native/repository-policy-test.py --enforce
      - name: Attach host-model evidence only, never kernel KUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round074-agent6-host-only
          path: round074-evidence/
          if-no-files-found: warn
