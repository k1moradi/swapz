name: Round071 original zswap pool retirement decoder native NO_AUTH
on:
  push:
    branches: [main]
    paths:
      - 'tests/runtime/native/fixtures/round071-original-pool-retirement-kunit.cfrag'
      - 'tests/tools/round071-stage-original-pool-retirement.py'
      - 'tests/tools/round071-original-pool-retirement-verify.py'
      - '.github/workflows/phase-a-round071-original-pool-retirement-noauth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          fetch-depth: 1
          sparse-checkout: |
            include/linux/lzo.h
            kernel/module/main.c
            crypto/Kconfig
            lib/Kconfig
            lib/crc/Kconfig
            lib/crypto/Kconfig
            mm/Kconfig
            mm/zswap.c
          sparse-checkout-cone-mode: false
          path: linux
          persist-credentials: false
      - name: Pristine original, strict source GCC Clang ASan UBSan, executed real owner C semantic mutants
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          test "$(git -C swapz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C linux rev-parse HEAD)" = c339f4010dea8b0d754f84ace70cd1b089878ef8
          test -z "$(git -C swapz status --porcelain --untracked-files=all)"
          test -z "$(git -C linux status --porcelain --untracked-files=all)"
          git -C swapz diff --check HEAD^ HEAD
          python3 -B swapz/tests/tools/round071-stage-original-pool-retirement.py self-test
          python3 -B swapz/tests/tools/round071-original-pool-retirement-verify.py self-test
          python3 -B swapz/tests/tools/round068-original-decoder-owner-kunit-verify.py self-test
          python3 -B swapz/tests/tools/round069-original-decoder-kconfig-verify.py self-test
          python3 -B swapz/tests/tools/round069-original-decoder-kconfig-verify.py original --linux-root linux
          python3 -B - <<'PY'
          import subprocess
          from pathlib import Path
          source = Path('linux/mm/zswap.c').resolve()
          result = subprocess.run(['git', '-C', 'linux', 'hash-object', str(source)],
                                  text=True, capture_output=True, check=True)
          assert result.stdout.strip() == 'ae19e301fced7e357a4c7587dfdd6abb890b9163'
          print('ROUND071_ORIGINAL_POOL_PRISTINE_MM_BLOB_PASS')
          PY
          log="$RUNNER_TEMP/round071-host-deps.log"
          if ! sudo -n apt-get update -qq >"$log" 2>&1 || \
             ! sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                 --no-install-recommends liblzo2-dev liblz4-dev libssl-dev >>"$log" 2>&1; then
            echo '::error::ROUND071_POOL_FIRST_ERROR phase=host-dependency-install' >&2
            exit 3
          fi
          python3 -B swapz/tests/tools/round066-original-decoder-owner-verify.py --linux-root linux
          python3 -B swapz/tests/tools/round066-decoder-drain-release-verify.py \
            --owner-source swapz/src/kernel/zswap-import-decoder-owner.c \
            --owner-header swapz/src/kernel/zswap-import-decoder-owner.h
          echo 'ROUND071_ORIGINAL_POOL_HOST_PASS gcc_clang_real_owner_C_ASAN_UBSAN=YES compiled_executed_C_mutants=22 native_pending=YES'
  original-uml-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    needs: source-host
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          fetch-depth: 1
          path: linux
          persist-credentials: false
      - name: Install ephemeral native UML build requirements, no privileged tests
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          log="$RUNNER_TEMP/round071-native-deps.log"
          if ! sudo -n apt-get update -qq >"$log" 2>&1 || \
             ! sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                 --no-install-recommends build-essential bc bison flex clang \
                 libelf-dev libssl-dev libncurses-dev liblz4-dev python3 \
                 python3-pyelftools binutils >>"$log" 2>&1; then
            echo '::error::ROUND071_POOL_FIRST_ERROR phase=native-dependency-install' >&2
            exit 3
          fi
      - name: Stage immutable inherited decoder and real original pool witness, verify all postimages
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          test "$(git -C swapz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C linux rev-parse HEAD)" = c339f4010dea8b0d754f84ace70cd1b089878ef8
          python3 -B swapz/tests/tools/round069-original-decoder-kconfig-verify.py original --linux-root linux
          python3 -B swapz/tests/tools/round068-original-decoder-owner-kunit-verify.py stage \
            --linux-root linux --manifest "$RUNNER_TEMP/round071-inherited-owner.json"
          python3 -B swapz/tests/tools/round071-stage-original-pool-retirement.py stage \
            --linux-root linux --manifest "$RUNNER_TEMP/round071-original-pool.json" \
            --decoder-manifest "$RUNNER_TEMP/round071-inherited-owner.json"
          python3 -B swapz/tests/tools/round071-stage-original-pool-retirement.py verify-stage \
            --linux-root linux --manifest "$RUNNER_TEMP/round071-original-pool.json"
          git -C linux diff --check
          echo 'ROUND071_ORIGINAL_MM_PRISTINE_PLUS_ASSERTED_TEST_WITNESS_PASS'
      - name: Compile and execute original UML pool retirement and original LZO LZ4 owner KUnit
        shell: bash
        timeout-minutes: 95
        run: |
          set -Eeuo pipefail
          umask 077
          phase=original-uml-build-run
          out="$RUNNER_TEMP/round071-pool-uml"
          request="$RUNNER_TEMP/round071-pool.kunitconfig"
          result="$RUNNER_TEMP/round071-pool.json"
          log="$RUNNER_TEMP/round071-pool-first-error.log"
          cat >"$request" <<'KUNIT_CFG'
          CONFIG_KUNIT=y
          CONFIG_BLOCK=y
          CONFIG_SWAP=y
          CONFIG_ZSWAP=y
          CONFIG_ZSWAP_DEFAULT_ON=y
          # CONFIG_ZSWAP_SHRINKER_DEFAULT_ON is not set
          CONFIG_CRYPTO=y
          CONFIG_CRYPTO_SHA256=y
          CONFIG_CRYPTO_LIB_SHA256=y
          CONFIG_CRYPTO_LZO=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_CRC32C=y
          CONFIG_CRC32=y
          CONFIG_LZO_COMPRESS=y
          CONFIG_LZO_DECOMPRESS=y
          CONFIG_LZ4_COMPRESS=y
          CONFIG_LZ4_DECOMPRESS=y
          # CONFIG_KUNIT_ALL_TESTS is not set
          # CONFIG_CGROUPS is not set
          KUNIT_CFG
          if timeout -k 10s 82m python3 -B linux/tools/testing/kunit/kunit.py run \
              --arch=um --build_dir="$out" --kunitconfig="$request" \
              --make_options="KCFLAGS=-Werror" --jobs=2 --timeout=180 \
              --json="$result" 'swapz_round0*' >"$log" 2>&1; then
            echo 'ROUND071_GENUINE_PINNED_ORIGINAL_UML_BOOT_KUNIT_EXECUTED'
          else
            code=$?
            if test -s "$out/.config"; then
              python3 -B swapz/tests/tools/round069-original-decoder-kconfig-verify.py \
                compare --request "$request" --effective "$out/.config" --mode corrected || :
            fi
            grep -E -m1 'fatal error:|error:|undefined reference|not ok|Kernel panic|KASAN:' "$log" || tail -n 20 "$log"
            echo "::error::ROUND071_POOL_FIRST_ERROR phase=$phase exit=$code" >&2
            exit "$code"
          fi
          phase=effective-original-config
          python3 -B swapz/tests/tools/round069-original-decoder-kconfig-verify.py \
            compare --request "$request" --effective "$out/.config" --mode corrected
          test -x "$out/linux" && test -s "$out/test.log" && test -s "$result"
          for entry in CONFIG_KUNIT=y CONFIG_ZSWAP=y CONFIG_ZSWAP_DEFAULT_ON=y \
              CONFIG_CRYPTO_LZO=y CONFIG_CRYPTO_LZ4=y CONFIG_CRYPTO_CRC32C=y \
              CONFIG_LZO_COMPRESS=y CONFIG_LZO_DECOMPRESS=y \
              CONFIG_LZ4_COMPRESS=y CONFIG_LZ4_DECOMPRESS=y; do
            grep -Fxq "$entry" "$out/.config" || {
              echo "::error::ROUND071_POOL_FIRST_ERROR phase=config missing=$entry" >&2
              exit 3
            }
          done
          grep -Fxq '# CONFIG_ZSWAP_SHRINKER_DEFAULT_ON is not set' "$out/.config"
          phase=native-six-case-JSON-KTAP
          if python3 -B swapz/tests/tools/round071-original-pool-retirement-verify.py \
              verify-native --result "$result" --kernel-log "$out/test.log" >"$log" 2>&1; then
            cat "$log"
          else
            code=$?
            cat "$log" >&2
            echo "::error::ROUND071_POOL_FIRST_ERROR phase=$phase exit=$code" >&2
            exit "$code"
          fi
          echo 'ROUND071_GENUINE_ORIGINAL_ZSWAP_POOL_RCU_DESTRUCTOR_AND_DECODER_NATIVE_PASS original_lzo_lz4=YES KUnit=6/6 close_cycles=48 SOURCE_AUTH=0 PHASE_A=BLOCKED'
