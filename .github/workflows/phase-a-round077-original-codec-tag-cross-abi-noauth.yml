name: Round077 Agent7 original LZO1X vs direct ZSTD codec tag2 HOST no-auth
on:
  push:
    branches: [main]
    paths:
      - 'tests/runtime/native/fixtures/round077-original-codec-tag-cross-abi.c'
      - 'tests/tools/round077-original-codec-tag-cross-abi-verify.py'
      - 'src/kernel/zswap-direct-handoff.h'
      - 'src/kernel/zswap-import-codec.h'
      - 'src/kernel/zswap-import-decoder-owner.c'
      - 'src/kernel/zswap-import-decoder-owner.h'
      - 'src/kernel/codec.h'
      - 'src/kernel/codec.c'
      - 'src/kernel/authority.h'
      - '.github/workflows/phase-a-round077-original-codec-tag-cross-abi-noauth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-gcc-clang-original-vs-direct-codec-abi-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact source on sole main and clean nonforce diff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
      - name: Install rootless source test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc clang liblz4-dev libssl-dev
      - name: Compile and execute real source GCC and Clang ASan UBSan plus 64 separately compiled executed C mutants
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/tools/round077-original-codec-tag-cross-abi-verify.py \
            --json round077-agent7-evidence/host.json \
            --ktap round077-agent7-evidence/host.ktap
      - name: Enforce canonical exact-source testing standards policy
        shell: bash
        run: python3 -B tests/runtime/native/repository-policy-test.py --enforce
      - name: Attach bounded host-only JSON and KTAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round077-agent7-codec-tag-cross-abi-host-only
          path: round077-agent7-evidence/
          if-no-files-found: warn
