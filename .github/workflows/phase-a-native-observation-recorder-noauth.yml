name: Native observation recorder host NO_AUTH
on:
  push:
    branches: [main]
    paths:
      - 'tests/tools/native-observation-recorder.h'
      - 'tests/tools/native-observation-recorder.c'
      - 'tests/tools/native-observation-export.py'
      - 'tests/runtime/native/fixtures/native-observation-recorder.c'
      - 'tests/runtime/native/native-observation-export-test.py'
      - 'docs/handoff/zswapz/round095/agent2-native-recorder-readiness.md'
      - '.github/workflows/phase-a-native-observation-recorder-noauth.yml'
permissions:
  contents: read
jobs:
  recorder-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source and complete historical standards prefix
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD^)" = "$SWAPZ_PUSH_BEFORE_SHA"
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
          python3 -B tests/runtime/native/repository-policy-test.py --enforce
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          previous = subprocess.check_output(["git", "show", "HEAD^:docs/testing_standards.md"])
          current = Path("docs/testing_standards.md").read_bytes()
          assert current.startswith(previous) and len(current) > len(previous)
          print("complete standards prefix", len(previous), len(current), hashlib.sha256(previous).hexdigest())
          PY
      - name: Changed recorder reservation concurrency only
        run: |
          set -Eeuo pipefail
          umask 077
          out="$RUNNER_TEMP/native-observation-recorder"
          mkdir -p "$out"
          for compiler in gcc clang; do
            "$compiler" --version | head -1
            "$compiler" -std=c2x -O2 -g -Wall -Wextra -Wconversion -Wsign-conversion -Wshadow -Wpedantic -Werror \
              -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie -pthread \
              -Itests/tools tests/tools/native-observation-recorder.c \
              tests/runtime/native/fixtures/native-observation-recorder.c \
              -o "$out/$compiler-recorder" 2>&1 | tee "$out/$compiler-compile.log"
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
              "$out/$compiler-recorder" concurrent "$(printf 'ab%.0s' {1..32})" \
              2>&1 | tee "$out/$compiler-recorder.log"
            rm "$out/$compiler-recorder"
          done
      - name: Retain bounded prototype diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-observation-recorder-concurrency-host
          path: ${{ runner.temp }}/native-observation-recorder/*.log
          if-no-files-found: warn
          retention-days: 14
