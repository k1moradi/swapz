name: "Phase A pinned Linux BIO sideband CI-only feasibility"

on:
  # Historical native lane: explicit dispatch only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-bio-ci-only-source:
    name: "Pinned BIO GCC CONFIG_ZSWAP=y/n Kbuild + KUnit compile (never loaded)"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout published swapz source
        uses: actions/checkout@v4
        with:
          path: swapz
          persist-credentials: false
      - name: Checkout exact upstream Linux source
        uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          fetch-depth: 1
          path: linux
          persist-credentials: false
      - name: Install source-only Kbuild and host-test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends build-essential bc bison flex \
            libelf-dev libssl-dev clang python3 binutils
      - name: Host GCC/Clang ASan/UBSan and exact pinned source regressions
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$GITHUB_SHA"
          export ROUND025_PINNED_LINUX="$PWD/linux"
          if python3 -B swapz/tests/runtime/native/pinned-linux-zswap-sideband-test.py \
            > "$RUNNER_TEMP/sideband-rootless.log" 2>&1; then
            tail -n 10 "$RUNNER_TEMP/sideband-rootless.log"
          else
            status=$?
            echo "::error::Rootless first failure (exit $status)"
            tail -n 75 "$RUNNER_TEMP/sideband-rootless.log"
            exit "$status"
          fi
      - name: Stage only exact pinned BIO files in disposable Linux checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 -B swapz/tests/tools/stage-pinned-linux-zswap-sideband.py \
            --linux-root linux
          expected="$(printf '%s\n' block/bio.c include/linux/blk_types.h)"
          observed="$(git -C linux diff --name-only | LC_ALL=C sort)"
          test "$observed" = "$expected"
          git -C linux diff --check
          grep -Fq '#ifdef SWAPZ_ROUND025_SIDEBAND_CI_ONLY' \
            linux/include/linux/blk_types.h
          grep -Fq 'return -EOPNOTSUPP;' linux/block/bio.c
          echo 'KERNEL_SOURCE=CI_ONLY_WITH_UNCHANGED_NORMAL_BIO'
      - name: Compile actual pinned BIO object with GCC for ZSWAP enabled and disabled
        shell: bash
        run: |
          set -euo pipefail
          for setting in enabled disabled; do
            build_dir="$RUNNER_TEMP/linux-sideband-$setting"
            mkdir -p "$build_dir"
            log_file="$RUNNER_TEMP/sideband-$setting-build.log"
            if ! make -s -C linux "O=$build_dir" CC=gcc defconfig \
                > "$log_file" 2>&1; then
              echo "::error::first failure at defconfig, $setting"
              tail -n 50 "$log_file"
              exit 2
            fi
            linux/scripts/config --file "$build_dir/.config" \
              --enable KUNIT --enable SWAP
            if [ "$setting" = enabled ]; then
              linux/scripts/config --file "$build_dir/.config" --enable ZSWAP
              expected_zswap='CONFIG_ZSWAP=y'
            else
              linux/scripts/config --file "$build_dir/.config" --disable ZSWAP
              expected_zswap='# CONFIG_ZSWAP is not set'
            fi
            if ! make -s -C linux "O=$build_dir" CC=gcc olddefconfig \
                >> "$log_file" 2>&1; then
              echo "::error::first failure at olddefconfig, $setting"
              tail -n 50 "$log_file"
              exit 2
            fi
            grep -Fxq "$expected_zswap" "$build_dir/.config"
            grep -Fxq 'CONFIG_KUNIT=y' "$build_dir/.config"
            if ! make -s -j2 -C linux "O=$build_dir" CC=gcc prepare \
                >> "$log_file" 2>&1; then
              echo "::error::first failure at prepare, $setting"
              tail -n 70 "$log_file"
              exit 2
            fi
            if ! make -s -j2 -C linux "O=$build_dir" CC=gcc \
                KCFLAGS=-DSWAPZ_ROUND025_SIDEBAND_CI_ONLY \
                block/bio.o >> "$log_file" 2>&1; then
              echo "::error::first failure at real block/bio.o, $setting"
              tail -n 80 "$log_file"
              exit 2
            fi
            test -s "$build_dir/block/bio.o"
            if ! nm -a "$build_dir/block/bio.o" |
                 grep -q swapz_ci_sideband_suite; then
              echo "::error::KUnit cases not compiled into real BIO object"
              exit 3
            fi
            echo "PINNED_BIO_GCC_CONFIG_ZSWAP_${setting}_KUNIT_COMPILE=PASS"
          done
          echo 'LIVE_COMPRESSED=DISABLED LOADED_4096=NOT_RUN PHYSICAL=NOT_RUN'
      # A compiled KUnit suite is NOT a booted/executed KUnit case. This
      # workflow must never load a module, create a mapper, or touch swap.

  pinned-bio-uml-executed-kunit:
    name: "Boot REAL pinned Linux UML KUnit; verify all eleven executed BIO cases"
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout only published swapz main source
        uses: actions/checkout@v4
        with:
          path: swapz
          persist-credentials: false
      - name: Checkout exact upstream Linux pinned original
        uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          fetch-depth: 1
          path: linux
          persist-credentials: false
      - name: Install rootless UML/KUnit compiler prerequisites (no loaded module)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends build-essential bc bison flex \
            libelf-dev libssl-dev libcap-dev libncurses-dev \
            python3 python3-pyelftools binutils
      - name: Verify exact stock sources and fail-closed KUnit verdict tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C linux rev-parse HEAD)" = \
            c339f4010dea8b0d754f84ace70cd1b089878ef8
          python3 -B swapz/tests/runtime/native/fixtures/round026-sideband-kunit-verdict.py \
            --self-test
          python3 -B swapz/tests/runtime/native/pinned-linux-zswap-sideband-test.py \
            > "$RUNNER_TEMP/round026-host-regression.log" 2>&1 || {
              first_exit=$?
              echo "::error::Host strict GCC/Clang first failure (exit $first_exit)"
              tail -n 70 "$RUNNER_TEMP/round026-host-regression.log"
              exit "$first_exit"
            }
          tail -n 9 "$RUNNER_TEMP/round026-host-regression.log"
          python3 -B swapz/tests/tools/stage-pinned-linux-zswap-sideband.py \
            --linux-root linux
          expected="$(printf '%s\n' block/bio.c include/linux/blk_types.h)"
          observed="$(git -C linux diff --name-only | LC_ALL=C sort)"
          test "$observed" = "$expected"
          git -C linux diff --check
          grep -Fq '#ifdef SWAPZ_ROUND025_SIDEBAND_CI_ONLY' \
            linux/block/bio.c
          echo "ROUND026_PINNED_LINUX_STAGE_EXACT_BLOBS=PASS"
      - name: Build and BOOT disposable UML, execute KUnit cases and validate JSON plus KTAP
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/round026-uml-build"
          result_file="$RUNNER_TEMP/round026-uml-kunit.json"
          config_file="$RUNNER_TEMP/round026-uml.kunitconfig"
          runner_log="$RUNNER_TEMP/round026-uml-first-failure.log"
          mkdir -p "$build_dir"
          cat > "$config_file" <<'KUNIT_CONFIG'
          CONFIG_KUNIT=y
          CONFIG_BLOCK=y
          CONFIG_SWAP=y
          # CONFIG_ZSWAP is not set
          # CONFIG_KUNIT_ALL_TESTS is not set
          KUNIT_CONFIG
          if python3 -B linux/tools/testing/kunit/kunit.py run \
            --arch=um --build_dir="$build_dir" \
            --kunitconfig="$config_file" \
            --make_options="KCFLAGS=-DSWAPZ_ROUND025_SIDEBAND_CI_ONLY" \
            --jobs=2 --timeout=120 \
            --json="$result_file" \
            swapz_round025_sideband_compiler_only \
            > "$runner_log" 2>&1; then
            echo "ROUND026_PINNED_UML_RUN_EXIT=0"
          else
            first_exit=$?
            echo "::error::REAL UML kernel configuration/build/boot/KUnit first failure (exit $first_exit)"
            tail -n 100 "$runner_log"
            if test -s "$build_dir/test.log"; then
              echo "Last bounded original UML kernel output:"
              tail -n 55 "$build_dir/test.log"
            fi
            exit "$first_exit"
          fi
          test -x "$build_dir/linux"
          grep -Fxq 'CONFIG_KUNIT=y' "$build_dir/.config"
          grep -Fxq 'CONFIG_SWAP=y' "$build_dir/.config"
          grep -Fxq '# CONFIG_ZSWAP is not set' "$build_dir/.config"
          if python3 -B swapz/tests/runtime/native/fixtures/round026-sideband-kunit-verdict.py \
             --result "$result_file" \
             --kernel-log "$build_dir/test.log"; then
            echo "ROUND026_UML_EXECUTED_ALL_CASES=PASS"
          else
            first_exit=$?
            echo "::error::UML KUnit executed evidence refused (exit $first_exit)"
            tail -n 65 "$runner_log"
            # Print bounded ACTUAL kernel KTAP evidence on first verifier
            # mismatch; no owner/private host contents are involved.
            if test -s "$build_dir/test.log"; then
              echo "First source-bound kernel KTAP case diagnostics:"
              grep -E 'KTAP version|# Subtest:|swapz_ci_|not ok '                 "$build_dir/test.log" | tail -n 70 || true
            fi
            exit "$first_exit"
          fi
          echo "SOURCE_ONLY=PASS KUNIT_BOOT_EXECUTED=PASS LOADED_4096=NOT_RUN PHYSICAL=NOT_RUN"
          echo "LIVE_COMPRESSED=DISABLED PHASE_A=BLOCKED PHASE_B=DISABLED"
      # In GitHub's disposable UML user-mode Linux only. Never load a host
      # module, create a DM/null_blk mapper, mutate swap, or issue pressure.
