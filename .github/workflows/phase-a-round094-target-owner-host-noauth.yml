name: Round094 guarded target owner and generation host NO_AUTH
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-a-round094-target-owner-host-noauth.yml'
      - 'tests/tools/round094-target-owner-verify.py'
      - 'src/kernel/dm-target.c'
permissions:
  contents: read
jobs:
  target-owner-source-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source, policy and full parent standards prefix
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          test "$(git rev-parse HEAD^)" = "$SWAPZ_PUSH_BEFORE_SHA"
          test -z "$(git status --porcelain)"
          git diff --check "$SWAPZ_PUSH_BEFORE_SHA" HEAD
          python3 -B tests/runtime/native/repository-policy-test.py --enforce
          prior="$(mktemp)"
          trap 'rm -f "$prior"' EXIT
          git show "$SWAPZ_PUSH_BEFORE_SHA:docs/testing_standards.md" > "$prior"
          bytes="$(wc -c < "$prior")"
          test "$(git hash-object "$prior")" = "$(git rev-parse "$SWAPZ_PUSH_BEFORE_SHA:docs/testing_standards.md")"
          test "$(wc -c < docs/testing_standards.md)" -gt "$bytes"
          cmp -n "$bytes" "$prior" docs/testing_standards.md
      - name: Select independent R100 frozen extraction lane
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          if grep -Fxq 'tests/tools/round089-selected-dm-registry-verify.py' <<< "$changed" &&
             grep -Fxq 'tests/tools/round094-target-owner-verify.py' <<< "$changed" &&
             ! grep -Evx 'tests/tools/round089-selected-dm-registry-verify.py|tests/tools/round094-target-owner-verify.py|docs/testing_standards.md|.github/workflows/phase-a-round088-selected-dm-admission-host.yml|.github/workflows/phase-a-round094-target-owner-host-noauth.yml' <<< "$changed"; then
            echo 'SWAPZ_R100_FROZEN_HOST=1' >> "$GITHUB_ENV"
          fi
      - name: Actual extracted guarded target lifecycle and bounded generation
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/round094-agent3"
          python3 -B tests/tools/round094-target-owner-verify.py "$RUNNER_TEMP/round094-agent3" 2>&1 | tee "$RUNNER_TEMP/round094-agent3/target-owner.log"
      - name: Retain bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round094-agent3-target-owner-host
          path: ${{ runner.temp }}/round094-agent3
          if-no-files-found: ignore
          retention-days: 14
