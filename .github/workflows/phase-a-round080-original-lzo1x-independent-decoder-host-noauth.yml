name: "Round080 original LZO1X independent decoder HOST ONLY NO_AUTH"
on:
  push:
    branches: [main]
    paths:
      - "tests/runtime/native/fixtures/round080-original-lzo1x-independent-decoder.c"
      - "tests/tools/round080-original-lzo1x-independent-decoder-verify.py"
      - ".github/workflows/phase-a-round080-original-lzo1x-independent-decoder-host-noauth.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pristine-original-lzo1x-product-host:
    name: Original LZO1X pinned source + product decoder GCC/Clang ASan UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          fetch-depth: 1
          sparse-checkout: |
            mm/zswap.c
            crypto/lzo.c
            include/linux/lzo.h
            lib/lzo/lzo1x_compress.c
            lib/lzo/lzo1x_compress_safe.c
            lib/lzo/lzo1x_decompress_safe.c
            lib/lzo/lzodefs.h
          path: original-linux
          persist-credentials: false
      - name: Strict source identity and pristine sibling check
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$(git -C swapz rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::ROUND080_AGENT7_FIRST_ERROR main-source SHA mismatch" >&2
            exit 1
          fi
          if ! checkout_status=$(git -C swapz status --porcelain --untracked-files=all) || [[ -n "$checkout_status" ]]; then
            echo "::error::ROUND080_AGENT7_FIRST_ERROR dirty main checkout" >&2
            exit 1
          fi
          # Read the commit header, not the shallow revision traversal.
          if ! parent=$(git --no-replace-objects -C swapz cat-file -p HEAD | awk 'BEGIN { header=1 } /^$/ { header=0 } header && /^parent / { print $2 }') || [[ ! "$parent" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ROUND080_AGENT7_FIRST_ERROR source commit must have exactly one parent" >&2
            exit 1
          fi
          if ! resolved_parent=$(git -C swapz rev-parse --verify 'HEAD^1^{commit}' 2>/dev/null) || ! git -C swapz cat-file -e "$parent^{commit}" 2>/dev/null; then
            echo "::error::ROUND080_AGENT7_FIRST_ERROR source commit parent unavailable" >&2
            exit 1
          fi
          if [[ "$resolved_parent" != "$parent" ]]; then
            echo "::error::ROUND080_AGENT7_FIRST_ERROR source commit parent mismatch" >&2
            exit 1
          fi
          if ! git -C swapz diff --check HEAD^ HEAD --; then
            echo "::error::ROUND080_AGENT7_FIRST_ERROR source commit whitespace" >&2
            exit 1
          fi
          if [[ "$(git -C original-linux rev-parse HEAD)" != c339f4010dea8b0d754f84ace70cd1b089878ef8 ]]; then
            echo "::error::ROUND080_AGENT7_FIRST_ERROR original Linux pin mismatch" >&2
            exit 1
          fi
          if [[ -n "$(git -C original-linux status --porcelain --untracked-files=all)" ]]; then
            echo "::error::ROUND080_AGENT7_FIRST_ERROR dirty original Linux checkout" >&2
            exit 1
          fi
          for dependency in gcc clang python3; do
            if ! command -v "$dependency" >/dev/null; then
              echo "::error::ROUND080_AGENT7_FIRST_ERROR unavailable compiler/tool: $dependency" >&2
              exit 1
            fi
          done
          for header in /usr/include/lz4.h /usr/include/openssl/sha.h; do
            if [[ ! -f "$header" ]]; then
              echo "::error::ROUND080_AGENT7_FIRST_ERROR missing host development header: $header" >&2
              exit 1
            fi
          done
      - name: Actual pinned original Linux LZO1X and dormant product compiled executed mutants
        shell: bash
        run: |
          set -Eeuo pipefail
          if python3 -B swapz/tests/tools/round080-original-lzo1x-independent-decoder-verify.py \
               --linux-root original-linux \
               --json "$RUNNER_TEMP/agent7-host-results.json" \
               --ktap "$RUNNER_TEMP/agent7-host.ktap" \
               > "$RUNNER_TEMP/agent7-first-error.log" 2>&1; then
            tail -n 8 "$RUNNER_TEMP/agent7-first-error.log"
          else
            code=$?
            echo "::error::ROUND080_AGENT7_FIRST_ERROR source-locked host qualification exit=$code" >&2
            tail -n 18 "$RUNNER_TEMP/agent7-first-error.log" >&2
            exit "$code"
          fi
          if ! checkout_status=$(git -C swapz status --porcelain --untracked-files=all) || [[ -n "$checkout_status" ]]; then
            echo "::error::ROUND080_AGENT7_FIRST_ERROR tests modified checkout" >&2
            exit 1
          fi
      - name: Upload bounded host result and first-error evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round080-agent7-original-lzo-host
          path: |
            ${{ runner.temp }}/agent7-host-results.json
            ${{ runner.temp }}/agent7-host.ktap
            ${{ runner.temp }}/agent7-first-error.log
          if-no-files-found: warn
          retention-days: 14
