name: Round060 pristine original LZO1X LZ4 GPL decoder compile-only NO_AUTH
on:
  push:
    branches: [main]
    paths:
      - 'src/kernel/zswap-import-codec.h'
      - 'src/kernel/zswap-import-decoder-owner.h'
      - 'src/kernel/zswap-import-decoder-owner.c'
      - 'tests/runtime/native/fixtures/round066-original-decoder-owner.c'
      - 'tests/tools/round066-original-decoder-owner-verify.py'
      - 'tests/tools/round060-original-decoder-kbuild-verify.py'
      - 'tests/tools/round064-original-decoder-elf-cause-verify.py'
      - 'tests/tools/round061-original-kbuild-host-deps-verify.py'
      - 'tests/runtime/native/fixtures/round060-original-decoder-module.c'
      - '.github/workflows/phase-a-round060-original-decoder-gpl-noauth.yml'
      - 'docs/testing_standards.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          fetch-depth: 1
          sparse-checkout: |
            include/linux/lzo.h
            include/linux/lz4.h
            include/crypto/sha2.h
            crypto/lzo.c
            crypto/lz4.c
            lib/lzo
            lib/lz4
            lib/crypto/sha256.c
            lib/Kconfig
            kernel/module/main.c
          sparse-checkout-cone-mode: false
          path: linux
          persist-credentials: false
      - name: Pin 11 original source blobs; execute seven negative symbol/config cases and existing real C mutants
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git -C swapz rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C swapz status --porcelain --untracked-files=all)"
          git -C swapz diff --check HEAD^ HEAD
          python3 -B swapz/tests/tools/round060-original-decoder-kbuild-verify.py original --linux-root linux
          python3 -B swapz/tests/tools/round060-original-decoder-kbuild-verify.py self-test
          python3 -B swapz/tests/tools/round064-original-decoder-elf-cause-verify.py self-test
          python3 -B swapz/tests/tools/round061-original-kbuild-host-deps-verify.py self-test
          (cd swapz && python3 -B tests/tools/round059-codec-host-compat-verify.py)
          echo 'ROUND060_ORIGINAL_PINNED_GCC_CLANG_HOST_ASAN_UBSAN_10_SEMANTIC_MUTANTS_PASS_AUTH0'
      - name: Execute default-off original decoder reader ownership and true C semantic mutants
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          # Disposable GitHub runner packages only, never owner-host privilege.
          log="$RUNNER_TEMP/round066-decoder-owner-deps.log"
          if ! sudo -n apt-get update -qq >"$log" 2>&1; then
            echo '::error::ROUND066_DECODER_OWNER_FIRST_ERROR hosted apt metadata unavailable' >&2
            exit 3
          fi
          if ! sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              --no-install-recommends liblzo2-dev liblz4-dev libssl-dev \
              >>"$log" 2>&1; then
            echo '::error::ROUND066_DECODER_OWNER_FIRST_ERROR hosted LZO/LZ4/crypto libraries unavailable' >&2
            exit 3
          fi
          python3 -B swapz/tests/tools/round066-original-decoder-owner-verify.py --linux-root linux
          test -z "$(git -C linux status --porcelain --untracked-files=all)"

  original-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    needs: source-host
    strategy:
      fail-fast: false
      matrix:
        zswap: ['y', 'n']
    env:
      ZSWAP_MATRIX: ${{ matrix.zswap }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          fetch-depth: 1
          path: linux
          persist-credentials: false
      - name: Install original pinned x86 kernel build dependencies on ephemeral CI runner only
        shell: bash
        run: |
          set -Eeuo pipefail
          # Build-tool installation on this disposable GitHub host is NOT a
          # privileged, loaded-module, physical-I/O or owner-host test.
          if ! sudo -n apt-get update -qq >"$RUNNER_TEMP/round061-kbuild-deps.log" 2>&1; then
            echo '::error::ROUND061_DECODER_FIRST_ERROR hosted apt metadata unavailable' >&2
            exit 3
          fi
          if ! sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              --no-install-recommends build-essential bc bison flex clang \
              libelf-dev libssl-dev libncurses-dev dwarves binutils \
              >>"$RUNNER_TEMP/round061-kbuild-deps.log" 2>&1; then
            echo '::error::ROUND061_DECODER_FIRST_ERROR hosted original kernel dependencies unavailable' >&2
            exit 3
          fi
      - name: Require real GCC Clang gelf.h libelf headers and executable linkage
        shell: bash
        run: |
          set -Eeuo pipefail
          for executable in gcc clang make bc bison flex ld nm readelf objdump python3; do
            command -v "$executable" >/dev/null || {
              echo "::error::ROUND060_DECODER_FIRST_ERROR missing rootless prerequisite $executable" >&2
              exit 3
            }
          done
          python3 -B swapz/tests/tools/round061-original-kbuild-host-deps-verify.py check
      - name: Exact original ZSWAP y/n vmlinux modules GPL symvers and positive/negative real modpost
        shell: bash
        timeout-minutes: 135
        run: |
          set -Eeuo pipefail
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          test "$(git -C swapz rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B swapz/tests/tools/round060-original-decoder-kbuild-verify.py original --linux-root linux
          original="$RUNNER_TEMP/round060-linux-$ZSWAP_MATRIX"
          probe="$RUNNER_TEMP/round060-probe-$ZSWAP_MATRIX"
          negative="$RUNNER_TEMP/round060-negative-$ZSWAP_MATRIX"
          omission="$RUNNER_TEMP/round064-omission-$ZSWAP_MATRIX"
          log="$RUNNER_TEMP/round064-missing-export-$ZSWAP_MATRIX.log"
          verifier=swapz/tests/tools/round060-original-decoder-kbuild-verify.py
          inspector=swapz/tests/tools/round064-original-decoder-elf-cause-verify.py
          mkdir -p "$original"
          checked() {
            local phase="$1"; shift
            local phase_log="$RUNNER_TEMP/round064-$ZSWAP_MATRIX-$phase.log"
            if "$@" >"$phase_log" 2>&1; then
              printf 'ROUND060_ORIGINAL_KBUILD_PHASE_PASS zswap=%s phase=%s\n' "$ZSWAP_MATRIX" "$phase"
            else
              local code=$?
              python3 -B "$verifier" first-error --log "$phase_log" --phase "$phase" --exit-code "$code"
              return "$code"
            fi
          }
          checked original-defconfig make -s -C linux "O=$original" CC=gcc defconfig
          if [ "$ZSWAP_MATRIX" = y ]; then
            linux/scripts/config --file "$original/.config" --enable MODULES \
              --enable SWAP --enable ZSWAP \
              --disable ZSWAP_COMPRESSOR_DEFAULT_LZO \
              --enable ZSWAP_COMPRESSOR_DEFAULT_DEFLATE \
              --enable CRYPTO_SHA256 --module LZO_DECOMPRESS --module LZ4_DECOMPRESS
          else
            linux/scripts/config --file "$original/.config" --enable MODULES \
              --enable SWAP --disable ZSWAP --enable CRYPTO_SHA256 \
              --module LZO_DECOMPRESS --module LZ4_DECOMPRESS
          fi
          checked original-olddefconfig make -s -C linux "O=$original" CC=gcc olddefconfig
          checked original-vmlinux make -s -C linux "O=$original" CC=gcc -j2 vmlinux
          checked original-all-modules make -s -C linux "O=$original" CC=gcc -j2 modules
          test -s "$original/vmlinux"
          test -s "$original/Module.symvers"
          # Positive, diagnostics, actual absent-export negative and omission
          # negative have separate statuses; a failed positive must not skip
          # the genuine negative modpost or hide the earlier first failure.
          positive_status=0
          diagnostics_status=0
          negative_status=0
          omission_status=0
          if python3 -B "$verifier" prepare --destination "$probe" &&
             checked actual-original-GPL-modpost make -s -C linux \
               "O=$original" "M=$probe" CC=gcc -j2 W=1 KCFLAGS=-Werror modules; then
            checked actual-original-consumer-preprocess make -s -C linux \
              "O=$original" "M=$probe" CC=gcc -j2 W=1 KCFLAGS=-Werror \
              round060-original-decoder-module.i || diagnostics_status=$?
            python3 -B "$inspector" native --probe "$probe" --original "$original" \
              --evidence "$RUNNER_TEMP/round064-elf-$ZSWAP_MATRIX" \
              --zswap "$ZSWAP_MATRIX" || diagnostics_status=$?
            if release="$(make -s -C linux "O=$original" kernelrelease 2>"$RUNNER_TEMP/round064-release-$ZSWAP_MATRIX.log")"; then
              python3 -B "$verifier" verify-module \
                --original-config "$original/.config" --symvers "$original/Module.symvers" \
                --module "$probe/round060-decoder-noauth.ko" \
                --zswap "$ZSWAP_MATRIX" --kernel-release "$release" || positive_status=$?
            else
              positive_status=$?
              echo '::error::ROUND064_DECODER_FIRST_ERROR original kernelrelease failed' >&2
            fi
          else
            positive_status=$?
            diagnostics_status=1
          fi

          if python3 -B "$verifier" prepare --destination "$negative"; then
            if make -s -C linux "O=$original" "M=$negative" CC=gcc -j2 W=1 \
                KCFLAGS='-Werror -DSWAPZ_ROUND060_MISSING_DECODER_EXPORT_NEGATIVE_TEST=1' \
                modules >"$log" 2>&1; then
              echo '::error::ROUND060_DECODER_FIRST_ERROR genuine modpost accepted nonexistent decoder' >&2
              negative_status=1
            else
              python3 -B "$verifier" verify-negative --log "$log" || negative_status=$?
            fi
          else
            negative_status=$?
          fi

          # Actual source mutant in its own external-module workspace.
          # Never allow it to qualify the original positive consumer.
          if python3 -B "$verifier" prepare --destination "$omission" &&
             python3 -B "$inspector" stage-omission --probe "$omission" &&
             checked actual-omission-module make -s -C linux \
               "O=$original" "M=$omission" CC=gcc -j2 W=1 KCFLAGS=-Werror modules; then
            python3 -B "$inspector" verify-omission --probe "$omission" \
              --evidence "$RUNNER_TEMP/round064-omission-elf-$ZSWAP_MATRIX" || omission_status=$?
          else
            omission_status=$?
          fi

          test -z "$(git -C linux status --porcelain --untracked-files=all)"
          printf 'ROUND064_NATIVE_RESULTS zswap=%s positive=%s diagnostics=%s missing_export_negative=%s omitted_branch_negative=%s\n' \
            "$ZSWAP_MATRIX" "$positive_status" "$diagnostics_status" "$negative_status" "$omission_status"
          test "$positive_status" -eq 0
          test "$diagnostics_status" -eq 0
          test "$negative_status" -eq 0
          test "$omission_status" -eq 0
          echo "ROUND060_GENUINE_PINNED_X86_ZSWAP_$ZSWAP_MATRIX-GPL_DECODERS_PASS SOURCE_AUTH=0 NO_LOADED"
