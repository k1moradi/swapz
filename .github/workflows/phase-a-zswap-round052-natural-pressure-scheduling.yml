name: Round052 synthetic natural-MM-origin swapz disk scheduling (rootless)
on:
  push:
    branches: [main]
    paths:
      - 'tests/tools/round052-zswap-swapz-natural-pressure-scheduling.py'
      - 'tests/runtime/native/fixtures/round052-natural-pressure-scheduling.c'
      - 'tests/tools/round054-natural-mm-coalescing.py'
      - 'tests/runtime/native/fixtures/round054-natural-mm-coalescing.c'
      - 'tests/tools/round055-natural-mm-frontier.py'
      - 'tests/runtime/native/fixtures/round055-natural-mm-frontier.c'
      - 'src/kernel/codec.h'
      - '.github/workflows/phase-a-zswap-round052-natural-pressure-scheduling.yml'
  workflow_dispatch:
jobs:
  synthetic-rootless-only:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    env:
      SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact event source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"
          git diff --check HEAD^ HEAD
      - name: Compile and execute bounded real C model under both sanitizers
        run: python3 -B tests/tools/round052-zswap-swapz-natural-pressure-scheduling.py --self-test
      - name: Compare bounded coalescing and execute changed C semantic mutants
        run: python3 -B tests/tools/round054-natural-mm-coalescing.py
      - name: Compare finite-service ready-only and adaptive frontier
        run: python3 -B tests/tools/round055-natural-mm-frontier.py
      - name: Enforce same-commit canonical standards
        run: python3 -B tests/runtime/native/repository-policy-test.py --enforce
