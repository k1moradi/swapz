name: Round102 immutable historical guarded controller capture stop directed NO_AUTH
on:
  # Immutable historical proof; changed source has its own directed lane.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-controller-stop-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a92e3c8120c20db04dbd2c8c84e66fb611964d6c
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable historical source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = a92e3c8120c20db04dbd2c8c84e66fb611964d6c
          test "$(git hash-object src/kernel/dm-target.c)" = 087bec323ad59f365d77d3beaf1aa52907cfcfce
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Provision genuine compiler and kernel build prerequisites (runner only)
        run: |
          set -Eeuo pipefail
          sudo -n apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential binutils bc bison flex libelf-dev libssl-dev pkg-config \
            openssl perl python3 xz-utils cpio
          dpkg-query -W libelf-dev libssl-dev gcc binutils
      - uses: actions/checkout@v4
        with:
          ref: 5a36cabf0989dfffc75de52a6ab8cc021092ebf6
          path: frozen-product
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          path: frozen-linux
          persist-credentials: false
      - name: Check exact R101 stage, serial stop cases and changed objects
        run: |
          set -Eeuo pipefail
          umask 077
          python3 -B tests/tools/round102-controller-stop-verify.py frozen-product frozen-linux "$RUNNER_TEMP/round102-agent3"
      - name: Retain bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round102-agent3-controller-stop
          path: ${{ runner.temp }}/round102-agent3/
          if-no-files-found: warn
          retention-days: 14
