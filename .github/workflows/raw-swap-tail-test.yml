name: Raw swap tail and PSI progress verification
on:
  push:
    branches: [ci/raw-swap-tail-20261114]
permissions:
  contents: read
jobs:
  raw-swap-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse affected Python source
        run: |
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          for path in (
              "tests/tools/physical-swap-probe.py",
              "tests/tools/qualify-primary-real-swap.py",
              "tests/runtime/native/physical-swap-probe-test.py",
              "tests/runtime/native/primary-real-swap-test.py",
          ):
              ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
          PY
      - name: Primary real swap contracts
        run: python3 -B tests/runtime/native/primary-real-swap-test.py
      - name: Physical probe and recovery contracts
        run: python3 -B tests/runtime/native/physical-swap-probe-test.py
      - name: Changed-file whitespace
        run: git diff --check c801f756a849f2abcbb26d28ac00d71fdc814f7f HEAD
