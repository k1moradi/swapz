      - name: Actual original Linux vmlinux modules Module.symvers GPL probe and real matched DM
        shell: bash
        timeout-minutes: 85
        run: |
          set -Eeuo pipefail
          phase=initial
          log=round045-evidence/real-kbuild-first-error.log
          report=round045-evidence/real-original-x86-y-n-verdict.txt
          printf 'main_sha=%s\nupstream_sha=c339f4010dea8b0d754f84ace70cd1b089878ef8\n' \
            "$GITHUB_SHA" >"$report"
          trap 'code=$?; if ((code)); then echo "::error::Round045 first genuine original Kbuild failure phase=$phase code=$code"; tail -n 95 "$log" 2>/dev/null || :; printf "result=FAIL\nfirst_phase=%s\nexit=%d\n" "$phase" "$code" >>"$report"; fi' EXIT
          checked() {
            phase="$1"
            shift
            if "$@" >"$log" 2>&1; then
              printf '%s_exit=0\n' "$phase" >>"$report"
            else
              local code=$?
              echo "::error::Actual pinned original Kbuild first error phase=$phase code=$code"
              tail -n 85 "$log"
              return "$code"
            fi
          }
          flags="-DSWAPZ_ROUND028_SLOT_EPOCH_SOURCE=1 -DSWAPZ_ROUND030_EVICTION_SNAPSHOT_SOURCE=1 -DSWAPZ_ROUND025_SIDEBAND_CI_ONLY=1 -DSWAPZ_ROUND031_MM_BIO_SOURCE=1 -DSWAPZ_ROUND032_BIO_COPY_VIEW_CI_ONLY=1 -DSWAPZ_ROUND034_ORIGINAL_V1_KUNIT_TEST=1 -DSWAPZ_ROUND035_ORIGINAL_MM_ROUTE_WITNESS_TEST=1 -DSWAPZ_ROUND036_ORIGINAL_ROUTE_LIFETIME_TEST=1 -DSWAPZ_ROUND037_ORIGINAL_MM_LIFETIME_OWNER_TEST=1 -DSWAPZ_ROUND038_ORIGINAL_STORE_PROVENANCE_TEST=1 -DSWAPZ_ROUND040_ORIGINAL_ASYNC_SLOT_LEASE_NEGATIVE_TEST=1 -DSWAPZ_ROUND041_ORIGINAL_SECTOR_TO_DM_NONAUTHORITY_TEST=1 -DSWAPZ_ROUND042_ORIGINAL_STORED_WRITEBACK_LIFETIME_TEST=1 -DSWAPZ_ROUND043_ORIGINAL_BIO_CLONE_COPY_TEST=1 -DSWAPZ_ROUND045_ORIGINAL_STORED_BIO_SOURCE_SCOPE_TEST=1 -DSWAPZ_ROUND049_ORIGINAL_LOCKED_FOLIO_COUNT_PAIR_TEST=1 -DSWAPZ_ROUND052_ORIGINAL_PRE_UNUSE_CANCEL_TEST=1"
          info="$RUNNER_TEMP/round045-source-build-info.h"
          printf '#define SWAPZ_BUILD_SOURCE_SHA "%s"\n#define SWAPZ_BUILD_SOURCE_CLEAN 1\n#define SWAPZ_BUILD_SOURCE_CLEAN_STRING "1"\n' \
            "$GITHUB_SHA" > "$info"
          for profile in enabled disabled; do
            out="$RUNNER_TEMP/round042-original-$profile"
            mkdir -p "$out"
            checked "$profile-defconfig" make -s -C linux "O=$out" CC=gcc defconfig
            if [[ "$profile" == enabled ]]; then
              option=--enable
              effective=CONFIG_ZSWAP=y
            else
              option=--disable
              effective='# CONFIG_ZSWAP is not set'
            fi
            checked "$profile-config" linux/scripts/config --file "$out/.config" \
              --enable SWAP "$option" ZSWAP --enable KUNIT \
              --enable SWAP_BIO_ORIGIN_KUNIT_TEST --enable MODULES \
              --enable MD --enable BLK_DEV_DM --enable CRYPTO_LZ4 \
              --enable CRYPTO_SHA256 --enable LZ4_COMPRESS \
              --enable LZ4_DECOMPRESS
            checked "$profile-olddefconfig" make -s -C linux "O=$out" CC=gcc olddefconfig
            for expected in CONFIG_SWAP=y CONFIG_KUNIT=y CONFIG_MODULES=y \
                CONFIG_BLK_DEV_DM=y CONFIG_SWAP_BIO_ORIGIN_KUNIT_TEST=y \
                CONFIG_CRYPTO_LIB_SHA256=y CONFIG_LZ4_COMPRESS=y \
                CONFIG_LZ4_DECOMPRESS=y "$effective"; do
              grep -Fxq "$expected" "$out/.config"
            done
            checked "$profile-prepare" make -s -C linux "O=$out" CC=gcc -j2 W=1 prepare
            checked "$profile-default-original-objects" make -s -C linux \
              "O=$out" CC=gcc -j2 W=1 KCFLAGS=-Werror block/bio.o mm/page_io.o mm/swapfile.o
            if nm -a "$out/block/bio.o" | grep -Eq 'swapz_round035_bio_owner_matches|swapz_ci_bio_snapshot_lz4_v1|swapz_round043_bio_clone_owner_is_independent'; then
              echo "::error::Unmodified original default BIO included gated source"
              exit 3
            fi
            if nm -a "$out/mm/page_io.o" | grep -Eq 'swapz_round035_mm_route_preflight|swapz_round036_original_lifetime_probe|swapz_round037_original_mm_scoped_probe|swapz_round040_original_mm_post_put_lease_probe|swapz_round041_original_mm_sector_domain_probe|swapz_round045_original_stored_bio_scope_probe'; then
              echo "::error::Unmodified original default page-IO included gated source"
              exit 3
            fi
            if [[ "$profile" == enabled ]]; then
            checked "$profile-original-default-zswap-object" make -s -C linux \
              "O=$out" CC=gcc -j2 W=1 KCFLAGS=-Werror mm/zswap.o
            if nm -a "$out/mm/zswap.o" | grep -Eq 'swapz_round038_actual_store_provenance_probe|swapz_round042_original_stored_writeback_probe|swapz_round049_original_locked_folio_counted_pair|swapz_round052_original_preunuse_cancel_refusal'; then
              echo "::error::Original zswap default object included CI-only Round038 STORE probe"
              exit 3
            fi
          fi
          checked "$profile-original-guarded-objects" make -s -C linux \
              "O=$out" CC=gcc -j2 W=1 "KCFLAGS=$flags -Werror" \
              block/bio.o mm/page_io.o mm/swapfile.o \
              block/swap-bio-origin-kunit.o
            if [[ "$profile" == enabled ]]; then
              checked "$profile-original-guarded-zswap" make -s -C linux \
                "O=$out" CC=gcc -j2 W=1 "KCFLAGS=$flags -Werror" mm/zswap.o
              if ! nm -a "$out/mm/zswap.o" | grep -q swapz_round052_original_preunuse_cancel_refusal; then
                echo "::error::Original kernel C guarded pre-unuse negative-only KUnit refusal symbol missing"
                exit 3
              fi
              if ! nm -a "$out/mm/zswap.o" | grep -q swapz_round049_original_locked_folio_counted_pair; then
                echo "::error::Actual pinned ORIGINAL guarded folio_dup_swap/folio_put_swap C code missing"
                exit 3
              fi
              if ! nm -a "$out/mm/zswap.o" | grep -q swapz_round042_original_stored_writeback_probe; then
                echo "::error::True original guarded Round042 zswap_writeback_entry code is absent"
                exit 3
              fi
              if ! nm -a "$out/mm/zswap.o" | grep -q swapz_round038_actual_store_provenance_probe; then
                echo "::error::Real original guarded Round038 STORE provenance C machine code absent"
                exit 3
              fi
              if ! nm -a "$out/mm/zswap.o" | grep -q swapz_round038_store_observation_check; then
                echo "::error::Original Round038 provenance original C check absent"
                exit 3
              fi
            fi
            for symbol in swapz_ci_bio_snapshot_lz4_v1 \
                swapz_round035_bio_owner_matches \
                swapz_round043_bio_clone_owner_is_independent; do
              if ! nm -a "$out/block/bio.o" | grep -q "$symbol"; then
                echo "::error::Original guarded BIO source symbol missing $symbol"
                exit 3
              fi
            done
            if ! nm -a "$out/mm/page_io.o" | grep -q swapz_round035_mm_route_preflight; then
              echo "::error::Actual original Round035 page-IO route witness machine code absent"
              exit 3
            fi
            if ! nm -a "$out/mm/page_io.o" | grep -q swapz_round036_original_lifetime_probe; then
              echo "::error::Actual original Round036 page-IO lifetime machine code absent"
              exit 3
            fi
            if ! nm -a "$out/mm/page_io.o" | grep -q swapz_round041_original_mm_sector_domain_probe; then
              echo "::error::Actual original Round041 guarded sector-domain witness machine code absent"
              exit 3
            fi
            if ! nm -a "$out/mm/page_io.o" | grep -q swapz_round040_original_mm_post_put_lease_probe; then
              echo "::error::Actual original Round040 post-put async lease C machine code absent"
              exit 3
            fi
            if ! nm -a "$out/mm/page_io.o" | grep -q swapz_round037_original_mm_scoped_probe; then
              echo "::error::Actual original Round037 page-IO scoped MM witness machine code absent"
              exit 3
            fi
            if ! nm -a "$out/mm/page_io.o" | grep -q swapz_round045_original_stored_bio_scope_probe; then
              echo "::error::Round045 REAL original guarded page_io STORED typed-slot/bdev/sector owner witness machine code absent"
              exit 3
            fi
            checked "$profile-vmlinux" make -s -C linux "O=$out" CC=gcc \
              -j2 W=1 "KCFLAGS=$flags" vmlinux
            checked "$profile-modules" make -s -C linux "O=$out" CC=gcc \
              -j2 W=1 "KCFLAGS=$flags" modules
            test -s "$out/vmlinux"
            test -s "$out/Module.symvers"
            release="$(make -s -C linux "O=$out" CC=gcc kernelrelease)"
            checked "$profile-strict-gpl-symbol" python3 -B \
              swapz/tests/runtime/native/fixtures/round033-provider-symbol-gate.py \
              --symvers "$out/Module.symvers"
            grep -Fq 'ROUND033_ORIGINAL_GPL_EXPORT_PASS count=1 ' "$log"
            probe="$RUNNER_TEMP/round045-original-gpl-probe-$profile"
            mkdir -p "$probe"
            cp swapz/tests/runtime/native/fixtures/round032-bio-probe.c \
              "$probe/round032-bio-probe.c"
            printf 'obj-m := round032-bio-probe.o\n' >"$probe/Makefile"
            unset KBUILD_MODPOST_WARN
            checked "$profile-real-gpl-modpost" make -s -C linux "O=$out" \
              "M=$probe" CC=gcc -j2 W=1 "KCFLAGS=$flags -Werror" modules
            test -s "$probe/round032-bio-probe.ko"
            nm -u "$probe/round032-bio-probe.ko" |
              grep -Fq swapz_ci_bio_snapshot_lz4_v1
            readelf -p .modinfo "$probe/round032-bio-probe.ko" |
              grep -Fq "vermagic=$release"
            module="$RUNNER_TEMP/round045-real-dm-$profile"
            mkdir -p "$module"
            checked "$profile-real-dm-swapz" make -s -C swapz/src/kernel \
              "KDIR=$out" "SWAPZ_STAGE=$module" \
              "SWAPZ_BUILD_INFO=$info" CC=gcc -j2 W=1 all
            test -s "$module/dm-swapz.ko"
            readelf -p .modinfo "$module/dm-swapz.ko" |
              grep -Fq "vermagic=$release"
            printf 'profile=%s\nkernel_sha=%s\nsymvers_sha=%s\nprobe_sha=%s\ndm_sha=%s\n' \
              "$profile" "$(sha256sum "$out/vmlinux" | cut -d' ' -f1)" \
              "$(sha256sum "$out/Module.symvers" | cut -d' ' -f1)" \
              "$(sha256sum "$probe/round032-bio-probe.ko" | cut -d' ' -f1)" \
              "$(sha256sum "$module/dm-swapz.ko" | cut -d' ' -f1)" >> "$report"
          done
          printf 'result=PASS\n' >> "$report"
          echo "ROUND045_REAL_PINNED_ORIGINAL_X86_Y_N_GPL_PROBE_AND_DM_MODULE_PASS"
