name: "Round045 original Linux STORED writeback to BIO real source sector scope (NO AUTH)"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase-a-zswap-original-stored-bio-source-scope.yml"
      - "tests/tools/stage-pinned-linux-zswap-composed.py"
      - "tests/tools/round038-original-store-provenance-verify.py"
      - "tests/tools/round039-original-store-gates-verify.py"
      - "tests/tools/round040-original-lease-verify.py"
      - "tests/tools/round041-original-sector-verify.py"
      - "tests/tools/round042-original-writeback-verify.py"
      - "tests/tools/round043-original-bio-clone-verify.py"
      - "tests/tools/round045-original-stored-bio-scope-verify.py"
      - "tests/tools/round047-original-slot-incarnation-source-audit.py"
      - "tests/tools/round048-original-counted-slot-source-audit.py"
      - "tests/tools/round049-original-counted-pair-source-verify.py"
      - "tests/tools/round049-original-counted-pair-kunit-verify.py"
      - "tests/tools/round050-original-deferred-slot-source-audit.py"
      - "tests/tools/round051-original-swapoff-drain-cycle-proof.py"
      - "tests/tools/round052-original-preunuse-kunit-verify.py"
      - "tests/tools/round052-original-preunuse-source-verify.py"
      - "docs/handoff/zswapz/round052/agent2-evidence.md"
      - "docs/handoff/zswapz/round051/agent2-evidence.md"
      - "docs/handoff/zswapz/round050/agent2-evidence.md"
      - "docs/handoff/zswapz/round049/agent2-evidence.md"
      - "docs/handoff/zswapz/round048/agent2-evidence.md"
      - "docs/handoff/zswapz/round047/agent2-evidence.md"
      - "tests/runtime/native/fixtures/round045-original-stored-bio-scope-host.c"
      - "docs/handoff/zswapz/round045/agent2-evidence.md"
      - "tests/runtime/native/fixtures/round043-original-bio-clone-*.c"
      - "docs/handoff/zswapz/round043/agent2-evidence.md"
      - "tests/runtime/native/pinned-linux-zswap-composed-source-test.py"
      - "tests/runtime/native/fixtures/round038-original-store-*.c"
      - "tests/runtime/native/fixtures/round040-original-lease-*.c"
      - "tests/runtime/native/fixtures/round041-original-sector-*.c"
      - "tests/runtime/native/fixtures/round042-original-writeback-*.c"
      - "docs/handoff/zswapz/round042/agent2-evidence.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-uml-original-stored-source-scope-55:
    name: "Original CONFIG_ZSWAP=y UML inherited 53 + 2 genuine source scope C KUnit"
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          fetch-depth: 1
          path: linux
          persist-credentials: false
      - name: Install original Linux UML and real host sanitizer prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends build-essential bc bison flex clang \
            libelf-dev libssl-dev libncurses-dev liblz4-dev python3 \
            python3-pyelftools binutils
      - name: Real original source-extracted GCC Clang ASan UBSan and verifier hostile cases
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p round045-evidence
          test "$(git -C swapz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C linux rev-parse HEAD)" = c339f4010dea8b0d754f84ace70cd1b089878ef8
          test -z "$(git -C swapz status --porcelain --untracked-files=all)"
          test -z "$(git -C linux status --porcelain --untracked-files=all)"
          export ROUND031_PINNED_LINUX="$PWD/linux"
          # Prove the real original allocation/area/slot and BIO lifetime
          # before composing or modifying any of the ten pinned C files.
          if python3 -B swapz/tests/tools/round047-original-slot-incarnation-source-audit.py \
              --linux-root linux --self-test \
              >round045-evidence/round047-original-slot-audit.log 2>&1; then
            tail -n 8 round045-evidence/round047-original-slot-audit.log
          else
            code=$?
            echo "::error::Round047 first pristine original Linux slot-lifetime source audit failure exit=$code"
            tail -n 80 round045-evidence/round047-original-slot-audit.log
            exit "$code"
          fi
          # Reject an external counted swap-slot ref claim without the
          # current original locked swapcache folio and complete unwind.
          if python3 -B swapz/tests/tools/round048-original-counted-slot-source-audit.py \
              --linux-root linux --self-test \
              >round045-evidence/round048-counted-slot-source.log 2>&1; then
            tail -n 8 round045-evidence/round048-counted-slot-source.log
          else
            code=$?
            echo "::error::Round048 first original counted slot ownership negative source test exit=$code"
            tail -n 80 round045-evidence/round048-counted-slot-source.log
            exit "$code"
          fi
          # Genuine pinned upstream swapoff retries on untracked counted
          # slots; a copied slot and late void direct-put lack an independent
          # callback owner. Verify 16 function-scoped hostile original C
          # mutations before modifying any original source file.
          if python3 -B swapz/tests/tools/round050-original-deferred-slot-source-audit.py \
              --linux-root linux --self-test \
              >round045-evidence/round050-original-deferred-slot.log 2>&1; then
            tail -n 8 round045-evidence/round050-original-deferred-slot.log
          else
            code=$?
            echo "::error::Round050 first pinned original swapoff and deferred slot lifetime audit failure exit=$code"
            tail -n 80 round045-evidence/round050-original-deferred-slot.log
            exit "$code"
          fi
          # Original swapoff has NO pre-unuse hidden counted-slot callback
          # registration. The distinct 20-case dry wait graph and 14 new
          # REAL original C function mutations refuse a false cycle-free
          # retained-slot claim while preserving all 57 original KUnit.
          if python3 -B swapz/tests/tools/round051-original-swapoff-drain-cycle-proof.py \
              --linux-root linux --self-test \
              >round045-evidence/round051-original-drain-graph.log 2>&1; then
            tail -n 10 round045-evidence/round051-original-drain-graph.log
          else
            code=$?
            echo "::error::Round051 first pristine original swapoff pre-unuse cancellation graph or function-scoped C mutant error exit=$code"
            tail -n 100 round045-evidence/round051-original-drain-graph.log
            exit "$code"
          fi
          # Genuine new kernel-C refusal suite: 57 old + 3 original C tests.
          # Synthetic verifier hostiles never substitute for booted kernel.
          if python3 -B swapz/tests/tools/round052-original-preunuse-kunit-verify.py --self-test \
              >round045-evidence/round052-kunit-json-ktap-hostiles.log 2>&1; then
            tail -n 8 round045-evidence/round052-kunit-json-ktap-hostiles.log
          else
            code=$?
            echo "::error::Round052 first original 60-KUnit independent JSON+KTAP verifier hostile control failure exit=$code"
            tail -n 80 round045-evidence/round052-kunit-json-ktap-hostiles.log
            exit "$code"
          fi
          # Independently reject forged booted KUnit evidence; self-test
          # fixtures are synthetic negative controls, never kernel success.
          if python3 -B swapz/tests/tools/round049-original-counted-pair-kunit-verify.py --self-test \
              >round045-evidence/round049-kunit-hostile-self-test.log 2>&1; then
            tail -n 8 round045-evidence/round049-kunit-hostile-self-test.log
          else
            code=$?
            echo "::error::Round049 first new real original 57-case JSON KTAP verifier hostile rejection failure exit=$code"
            tail -n 80 round045-evidence/round049-kunit-hostile-self-test.log
            exit "$code"
          fi
          # Reject copied 037/038 page-IO vs zswap STORE symbol checks
          # before any full original kernel compilation; hostile mutations
          # must also be caught by the independent verifier.
          if python3 -B swapz/tests/tools/round045-original-stored-bio-scope-verify.py --self-test \
              >round045-evidence/round042-verifier-hostile.log 2>&1; then
            tail -n 8 round045-evidence/round042-verifier-hostile.log
          else
            code=$?
            echo "::error::Round045 first independent original writeback JSON+KTAP hostile verifier failure exit=$code"
            tail -n 70 round045-evidence/round042-verifier-hostile.log
            exit "$code"
          fi
          if python3 -B swapz/tests/tools/round041-original-sector-verify.py --self-test \
              >round045-evidence/round041-verifier-hostile.log 2>&1; then
            tail -n 8 round045-evidence/round041-verifier-hostile.log
          else
            code=$?
            echo "::error::Round045 first independent source JSON+KTAP hostile verifier failure exit=$code"
            tail -n 70 round045-evidence/round041-verifier-hostile.log
            exit "$code"
          fi
          if python3 -B swapz/tests/tools/round040-original-lease-verify.py --self-test \
              >round045-evidence/round040-verifier-hostile.log 2>&1; then
            tail -n 8 round045-evidence/round040-verifier-hostile.log
          else
            code=$?
            echo "::error::Round045 first independent adversarial JSON+KTAP verifier failure exit=$code"
            tail -n 70 round045-evidence/round040-verifier-hostile.log
            exit "$code"
          fi
          if python3 -B swapz/tests/tools/round039-original-store-gates-verify.py --self-test \
              >round045-evidence/round039-gates.log 2>&1; then
            tail -n 8 round045-evidence/round039-gates.log
          else
            code=$?
            echo "::error::Round039 first independent source-gate verification failure exit=$code"
            tail -n 70 round045-evidence/round039-gates.log
            exit "$code"
          fi
          if python3 -B swapz/tests/tools/round038-original-store-provenance-verify.py --self-test \
              >round045-evidence/host-verifier.log 2>&1; then
            tail -n 8 round045-evidence/host-verifier.log
          else
            code=$?
            echo "::error::Round045 first adversarial verifier failure exit=$code"
            tail -n 80 round045-evidence/host-verifier.log
            exit "$code"
          fi
          if python3 -B swapz/tests/runtime/native/pinned-linux-zswap-composed-source-test.py -v \
              >round045-evidence/host-c-test.log 2>&1; then
            tail -n 12 round045-evidence/host-c-test.log
          else
            code=$?
            echo "::error::Round045 first actual extracted source GCC/Clang/sanitizer failure exit=$code"
            tail -n 100 round045-evidence/host-c-test.log
            exit "$code"
          fi
      - name: Stage exact pristine original Linux source and SHA-verify ten files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B swapz/tests/tools/stage-pinned-linux-zswap-composed.py \
            --linux-root linux --manifest round045-evidence/ten-original-source-sha.json
          python3 - round045-evidence/ten-original-source-sha.json <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert manifest["source_sha"] == "c339f4010dea8b0d754f84ace70cd1b089878ef8"
          assert manifest["original_source_verified"] is True
          assert manifest["source_manifest_complete"] is True
          expected = {"block/Kconfig", "block/Makefile", "block/bio.c",
              "block/swap-bio-origin-kunit.c", "include/linux/bio.h",
              "include/linux/blk_types.h", "include/linux/swap_ops.h",
              "mm/page_io.c", "mm/swapfile.c", "mm/zswap.c"}
          entries = manifest["changed_paths"]
          assert len(entries) == 10 and {p["path"] for p in entries} == expected
          for item in entries:
              data = (pathlib.Path("linux") / item["path"]).read_bytes()
              assert hashlib.sha256(data).hexdigest() == item["staged_sha256"]
          PY
          git -C linux diff --check
          if python3 -B swapz/tests/tools/round052-original-preunuse-source-verify.py \
              --linux-root linux --self-test \
              >round045-evidence/round052-staged-original-C-mutants.log 2>&1; then
            tail -n 9 round045-evidence/round052-staged-original-C-mutants.log
          else
            code=$?
            echo "::error::Round052 first staged ACTUAL original C pre-unuse refusal mutant failure exit=$code"
            tail -n 80 round045-evidence/round052-staged-original-C-mutants.log
            exit "$code"
          fi
          # TRUE original C staged: function-scoped hostile mutants and
          # exact current source placement of the counted local pair.
          if python3 -B swapz/tests/tools/round049-original-counted-pair-source-verify.py \
              --linux-root linux --self-test \
              >round045-evidence/round049-staged-real-c-hostile.log 2>&1; then
            tail -n 9 round045-evidence/round049-staged-real-c-hostile.log
          else
            code=$?
            echo "::error::Round049 first actual original C counted slot paired source mutant failure exit=$code"
            tail -n 80 round045-evidence/round049-staged-real-c-hostile.log
            exit "$code"
          fi
          grep -Fq 'swapz_round049_original_locked_folio_counted_pair(' linux/mm/zswap.c
          grep -Fq 'kunit_test_suite(swapz_round049_original_counted_pair_suite);' linux/mm/zswap.c
          grep -Fq '"swapz_round049_original_locked_folio_counted_pair_no_authority"' linux/mm/zswap.c
          grep -Fq 'swapz_round035_mm_route_preflight(' linux/mm/page_io.c
          grep -Fq 'swapz_round036_original_lifetime_probe(' linux/mm/page_io.c
          grep -Fq 'swapz_round037_original_mm_scoped_probe(' linux/mm/page_io.c
          grep -Fq 'swapz_round040_original_mm_post_put_lease_probe(' linux/mm/page_io.c
          grep -Fq 'swapz_round041_original_mm_sector_domain_probe(' linux/mm/page_io.c
          grep -Fq 'swapz_round042_original_stored_writeback_probe(' linux/mm/zswap.c
          grep -Fq 'swapz_round042_stored_writeback_refuse(' linux/mm/zswap.c
          grep -Fq 'kunit_test_suite(swapz_round042_stored_writeback_suite);' linux/mm/zswap.c
          grep -Fq '"swapz_round042_original_stored_writeback_no_authority"' linux/mm/zswap.c
          grep -Fq 'swapz_round041_sector_domain_refuse(' linux/mm/page_io.c
          grep -Fq 'kunit_test_suite(swapz_round041_sector_domain_suite);' linux/mm/page_io.c
          grep -Fq '"swapz_round041_original_sector_domain_no_authority"' linux/mm/page_io.c
          grep -Fq 'swapz_round041_sector_domain_cases[]' linux/mm/page_io.c
          grep -Fq 'swapz_round040_async_lease_refuse(' linux/mm/page_io.c
          grep -Fq 'kunit_test_suite(swapz_round040_async_lease_suite);' linux/mm/page_io.c
          grep -Fq '"swapz_round040_original_mm_async_lease_no_authority"' linux/mm/page_io.c
          grep -Fq 'kunit_test_suite(swapz_round037_scope_suite);' linux/mm/page_io.c
          # Keep the prior original MM scoped witness separate from the new
          # original zswap STORE producer and its five-case KUnit suite.
          grep -Fq 'swapz_round038_actual_store_provenance_probe(' linux/mm/zswap.c
          grep -Fq 'swapz_round038_store_crc32c = ~crc32c(' linux/mm/zswap.c
          grep -Fq 'entry->swapz_round038_store_crc32c == source_crc32c' linux/mm/zswap.c
          grep -Fq 'kunit_test_suite(swapz_round038_store_suite);' linux/mm/zswap.c
          grep -Fq '"swapz_round038_original_store_provenance_no_authority"' linux/mm/zswap.c
          grep -Fq 'put_swap_device(active_area)' linux/mm/page_io.c
          grep -Fq 'kunit_test_suite(swapz_round036_lifetime_suite);' linux/mm/page_io.c
          grep -Fq 'swap_folio_sector(folio)' linux/mm/page_io.c
          grep -Fq 'get_swap_device(original_slot)' linux/mm/page_io.c
          grep -Fq 'swapz_round035_original_slot = swpentry' linux/mm/zswap.c
          grep -Fq 'swapz_round035_bio_owner_matches' linux/block/bio.c
          grep -Fq 'kunit_test_suite(swapz_round035_route_suite);' linux/mm/page_io.c
          grep -Fq 'swapz_round043_bio_clone_owner_is_independent(' linux/block/bio.c
          grep -Fq 'bi_swapz_ci_full_clone_owned' linux/include/linux/blk_types.h
          grep -Fq 'kunit_test_suite(swapz_round043_clone_copy_suite);' linux/block/bio.c
          grep -Fq 'swapz_round045_original_stored_bio_scope_probe(' linux/mm/page_io.c
          grep -Fq 'kunit_test_suite(swapz_round045_stored_bio_scope_suite);' linux/mm/page_io.c
          grep -Fq '"swapz_round045_original_stored_bio_source_scope_no_authority"' linux/mm/page_io.c
          grep -Fq 'get_swap_device(original_slot)' linux/mm/page_io.c
          grep -Fq 'put_swap_device(active_area)' linux/mm/page_io.c
          echo "ROUND045_ORIGINAL_10_FILE_MANIFEST_SOURCE_SCOPE_PASS"
      - name: Real original UML boot with CONFIG_ZSWAP=y and independent 60-case JSON KTAP
        shell: bash
        timeout-minutes: 80
        run: |
          set -Eeuo pipefail
          phase=original-kunit-config
          log=round045-evidence/uml-first-error.log
          out="$RUNNER_TEMP/round045-source-scope-uml"
          result="$PWD/round045-evidence/real-original-60.json"
          request="$PWD/round045-evidence/real-original.kunitconfig"
          printf 'main_sha=%s\noriginal_sha=c339f4010dea8b0d754f84ace70cd1b089878ef8\n' \
            "$GITHUB_SHA" >round045-evidence/verdict.txt
          trap 'status=$?; if ((status)); then echo "::error::Round045 actual original UML first failure phase=$phase code=$status"; tail -n 100 "$log" 2>/dev/null || :; printf "result=FAIL\nfirst_phase=%s\nexit=%d\n" "$phase" "$status" >>round045-evidence/verdict.txt; fi' EXIT
          cat >"$request" <<'KUNIT_CFG'
          CONFIG_KUNIT=y
          CONFIG_BLOCK=y
          CONFIG_SWAP=y
          CONFIG_ZSWAP=y
          CONFIG_SWAP_BIO_ORIGIN_KUNIT_TEST=y
          CONFIG_CRYPTO=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_SHA256=y
          CONFIG_LZ4_COMPRESS=y
          CONFIG_LZ4_DECOMPRESS=y
          # CONFIG_CGROUPS is not set
          # CONFIG_KUNIT_ALL_TESTS is not set
          KUNIT_CFG
          flags="-DSWAPZ_ROUND028_SLOT_EPOCH_SOURCE=1 -DSWAPZ_ROUND030_EVICTION_SNAPSHOT_SOURCE=1 -DSWAPZ_ROUND025_SIDEBAND_CI_ONLY=1 -DSWAPZ_ROUND031_MM_BIO_SOURCE=1 -DSWAPZ_ROUND032_BIO_COPY_VIEW_CI_ONLY=1 -DSWAPZ_ROUND034_ORIGINAL_V1_KUNIT_TEST=1 -DSWAPZ_ROUND035_ORIGINAL_MM_ROUTE_WITNESS_TEST=1 -DSWAPZ_ROUND036_ORIGINAL_ROUTE_LIFETIME_TEST=1 -DSWAPZ_ROUND037_ORIGINAL_MM_LIFETIME_OWNER_TEST=1 -DSWAPZ_ROUND038_ORIGINAL_STORE_PROVENANCE_TEST=1 -DSWAPZ_ROUND040_ORIGINAL_ASYNC_SLOT_LEASE_NEGATIVE_TEST=1 -DSWAPZ_ROUND041_ORIGINAL_SECTOR_TO_DM_NONAUTHORITY_TEST=1 -DSWAPZ_ROUND042_ORIGINAL_STORED_WRITEBACK_LIFETIME_TEST=1 -DSWAPZ_ROUND043_ORIGINAL_BIO_CLONE_COPY_TEST=1 -DSWAPZ_ROUND045_ORIGINAL_STORED_BIO_SOURCE_SCOPE_TEST=1 -DSWAPZ_ROUND049_ORIGINAL_LOCKED_FOLIO_COUNT_PAIR_TEST=1 -DSWAPZ_ROUND052_ORIGINAL_PRE_UNUSE_CANCEL_TEST=1"
          phase=real-original-uml-build-boot
          if timeout -k 10s 65m python3 -B linux/tools/testing/kunit/kunit.py run \
              --arch=um --build_dir="$out" --kunitconfig="$request" \
              --make_options="KCFLAGS=$flags -Werror" --jobs=2 --timeout=120 \
              --json="$result" 'swapz_round0*' >"$log" 2>&1; then
            echo "ROUND045_REAL_ORIGINAL_UML_RETURN=0"
          else
            exit "$?"
          fi
          phase=real-original-effective-kconfig
          test -x "$out/linux"
          test -s "$result"
          test -s "$out/test.log"
          for exact in CONFIG_ZSWAP=y CONFIG_SWAP=y CONFIG_KUNIT=y \
              CONFIG_CRYPTO_SHA256=y CONFIG_CRYPTO_LIB_SHA256=y \
              CONFIG_LZ4_COMPRESS=y CONFIG_LZ4_DECOMPRESS=y \
              CONFIG_SWAP_BIO_ORIGIN_KUNIT_TEST=y \
              '# CONFIG_CGROUPS is not set'; do
            grep -Fxq "$exact" "$out/.config"
          done
          if grep -Eq '^CONFIG_BLK_CGROUP=[ym]$' "$out/.config"; then
            echo "::error::Original UML CGROUPS-off BLK_CGROUP unexpectedly enabled"
            exit 3
          fi
          printf 'effective_config_sha256=%s\n' "$(sha256sum "$out/.config" | cut -d' ' -f1)" >>round045-evidence/verdict.txt
          printf 'actual_kernel_sha256=%s\n' "$(sha256sum "$out/linux" | cut -d' ' -f1)" >>round045-evidence/verdict.txt
          printf 'json_sha256=%s\n' "$(sha256sum "$result" | cut -d' ' -f1)" >>round045-evidence/verdict.txt
          printf 'ktap_sha256=%s\n' "$(sha256sum "$out/test.log" | cut -d' ' -f1)" >>round045-evidence/verdict.txt
          cp "$out/test.log" round045-evidence/original-kernel-ktap.log
          phase=independent-60-case-original-json-ktap
          if python3 -B swapz/tests/tools/round052-original-preunuse-kunit-verify.py \
              --result "$result" --kernel-log "$out/test.log" \
              >round045-evidence/verified-60.log 2>&1; then
            cat round045-evidence/verified-60.log
          else
            code=$?
            cat round045-evidence/verified-60.log
            exit "$code"
          fi
          printf 'prior_original_executed_cases=50\nnew_bio_clone_cases=3\nnew_source_scope_cases=2\nnew_original_counted_refusal_cases=2\nnew_preunuse_refusal_cases=3\nexecuted_total=60\nresult=PASS\n' \
            >>round045-evidence/verdict.txt
          echo "ORIGINAL_STORE_EXECUTED=NO SOURCE_MAPPED_AUTHENTICATED=0 MM_PRESSURE_EVICTION=NOT_RUN PHASE_A=BLOCKED"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round045-real-original-stored-bio-scope-uml
          path: round045-evidence/
          if-no-files-found: ignore
          retention-days: 7

  original-x86-y-n:
    name: "Real original x86 ZSWAP y/n full kernel, GPL probe and matched DM module"
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          fetch-depth: 1
          path: linux
          persist-credentials: false
      - name: Install real original Linux full Kbuild dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends build-essential bc bison flex \
            libelf-dev libssl-dev python3 binutils
      - name: Stage exact original source and validate all manifest SHA256
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p round045-evidence
          test "$(git -C swapz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C linux rev-parse HEAD)" = c339f4010dea8b0d754f84ace70cd1b089878ef8
          test -z "$(git -C linux status --porcelain --untracked-files=all)"
          python3 -B swapz/tests/tools/round047-original-slot-incarnation-source-audit.py \
            --linux-root linux
          python3 -B swapz/tests/tools/round048-original-counted-slot-source-audit.py \
            --linux-root linux --self-test
          python3 -B swapz/tests/tools/round049-original-counted-pair-kunit-verify.py --self-test
          python3 -B swapz/tests/tools/round052-original-preunuse-kunit-verify.py --self-test
