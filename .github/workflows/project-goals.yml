name: Native kernel-C project-goal regressions
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
# GitHub replaces an older pending member of a shared concurrency group even
# when cancel-in-progress is false. Keep every exact-SHA run independently
# observable; hosted-runner capacity may queue it without superseding it.
concurrency:
  group: project-goals-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
env:
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/build/python-cache
jobs:
  native-rootless:
    name: Native rootless ${{ github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SWAPZ_CI_ARTIFACT_NAME: project-goals-native-rootless-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Configure the reusable build root
        run: mkdir -p build/tests/native build/tests/model build/python-cache
      - name: Install native prerequisites on GitHub-hosted runner
        run: |
          python3 -B tests/tools/product_goals.py ci-run --suite apt-prerequisites -- bash -c 'sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential liblz4-dev'
      - name: Build and execute production C/C++ tests
        run: |
          python3 -B tests/tools/product_goals.py ci-run --suite native-rootless -- bash tests/tools/test-rootless.sh
          python3 -B tests/tools/product_goals.py ci-run --suite native-artifacts -- bash -c 'test -x build/tests/native/lower-write-aggregation || { echo "SOURCE_CONTRACT_MISMATCH: missing lower-write-aggregation"; exit 1; }; test -x build/tests/native/mapping-authority || { echo "SOURCE_CONTRACT_MISMATCH: missing mapping-authority"; exit 1; }'
      - name: Verify build tidiness
        shell: bash
        run: |
          cat > build/ci-build-policy.sh <<'SWAPZ_CI_SCRIPT'
          set -Eeuo pipefail
          trap 'printf "SOURCE_CONTRACT_MISMATCH: check failed at line %s: %s\n" "$LINENO" "$BASH_COMMAND" >&2' ERR
          if find src tests -type f \( -name '*.ko' -o -name '*.o' -o -name '*.mod.o' \) | grep -q .; then
            echo 'FAIL: generated native output outside build/'
            exit 1
          fi
          git diff --check
          test -x build/tests/native/codec-roundtrip
          SWAPZ_CI_SCRIPT
          python3 -B tests/tools/product_goals.py ci-run --suite build-policy -- bash build/ci-build-policy.sh
      - name: Retain bounded sanitized failing-suite logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: project-goals-native-rootless-${{ github.sha }}
          path: build/ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  make-contract:
    name: Make interface ${{ github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SWAPZ_CI_ARTIFACT_NAME: project-goals-make-contract-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Configure the reusable build root
        run: mkdir -p build/tests/native build/tests/model build/python-cache
      - name: Install native prerequisites on GitHub-hosted runner
        run: |
          python3 -B tests/tools/product_goals.py ci-run --suite apt-prerequisites -- bash -c 'sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential liblz4-dev'
      - name: Run synthetic CI diagnostics and Make interface regression
        run: python3 -B tests/tools/product_goals.py ci-run --suite make-interface -- python3 -B tests/runtime/native/make-interface-test.py -v
      - name: Independently validate official qualification report boundaries
        run: python3 -B tests/tools/product_goals.py ci-run --suite test-report -- python3 -B tests/runtime/native/test-report-test.py -v
      - name: Enforce the Make API and mandatory test discovery
        run: |
          cat > build/ci-make-policy.sh <<'SWAPZ_CI_SCRIPT'
          set -Eeuo pipefail
          trap 'printf "SOURCE_CONTRACT_MISMATCH: check failed at line %s: %s\n" "$LINENO" "$BASH_COMMAND" >&2' ERR
          grep -Fxq '.DEFAULT_GOAL := all' Makefile
          grep -Fxq '.PHONY: all install uninstall test fast_test' Makefile
          grep -Fq '@+python3 -B tests/tools/run-tests.py --kdir' Makefile
          grep -Fq 'tests/tools/test-rootless.sh' tests/tools/run-tests.py
          grep -Fq 'python3 -B tests/runtime/native/source-contract-test.py -v' tests/tools/test-rootless.sh
          grep -Fq 'python3 -B tests/runtime/native/primary-lifecycle-audit-test.py -v' tests/tools/test-rootless.sh
          grep -Fq 'python3 -B tests/runtime/native/primary-lifecycle-nullblk-qualifier-test.py -v' tests/tools/test-rootless.sh
          grep -Fq 'python3 -B tests/runtime/native/primary-real-swap-test.py -v' tests/tools/test-rootless.sh
          grep -Fq 'python3 -B tests/runtime/native/production-readiness-test.py -v' tests/tools/test-rootless.sh
          grep -Fq 'python3 -B tests/runtime/native/systemd/swapz-primary-systemd-test.py -v' tests/tools/test-rootless.sh
          grep -Fq 'test-predictor: $(OUT)/predictor-qualification test-anon-page-analyzer' tests/suites/Makefile
          grep -Fq 'anon-page-analyzer-test.py' tests/suites/Makefile
          grep -Fq 'tests/tools/test-loaded.sh' tests/tools/run-tests.py
          grep -Fq 'sudo -n true' tests/tools/test-loaded.sh
          grep -Fq 'BLOCKED_LOADED_QUALIFICATION' tests/tools/test-loaded.sh
          if sed -n '/^test:$/,$p' Makefile | grep -Eq 'sudo -v|sudo bash|modprobe|dmsetup'; then
            echo 'FAIL: make test must not prompt or provision directly'
            exit 1
          fi
          SWAPZ_CI_SCRIPT
          python3 -B tests/tools/product_goals.py ci-run --suite make-policy -- bash build/ci-make-policy.sh
      - name: Retain bounded sanitized failing-suite logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: project-goals-make-contract-${{ github.sha }}
          path: build/ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  focused-rootless:
    name: Rootless ${{ matrix.suite }} ${{ github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: source-contract
            script: tests/runtime/native/source-contract-test.py
          - suite: primary-lifecycle-audit
            script: tests/runtime/native/primary-lifecycle-audit-test.py
          - suite: production-readiness
            script: tests/runtime/native/production-readiness-test.py
    env:
      SWAPZ_CI_ARTIFACT_NAME: project-goals-focused-rootless-${{ matrix.suite }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Configure the reusable build root
        run: mkdir -p build/tests/native build/tests/model build/python-cache
      - name: Run independently observable rootless safety regression
        run: |
          python3 -B tests/tools/product_goals.py ci-run --suite '${{ matrix.suite }}' -- python3 -B '${{ matrix.script }}' -v
      - name: Retain bounded sanitized failing-suite logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: project-goals-focused-rootless-${{ matrix.suite }}-${{ github.sha }}
          path: build/ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  repository-policy:
    name: Repository policy ${{ github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SWAPZ_CI_ARTIFACT_NAME: project-goals-repository-policy-${{ github.sha }}
      SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure the reusable build root
        run: mkdir -p build/tests/native build/tests/model build/python-cache
      - name: Enforce active product layout and naming
        shell: bash
        run: |
          cat > build/ci-layout-policy.sh <<'SWAPZ_CI_SCRIPT'
          set -Eeuo pipefail
          trap 'printf "SOURCE_CONTRACT_MISMATCH: check failed at line %s: %s\n" "$LINENO" "$BASH_COMMAND" >&2' ERR
          test -s src/kernel/VERSION
          test -s src/kernel/dm-target.c
          test -s src/userspace/swapzctl.c
          grep -Fq 'MODULE_VERSION(SWAPZ_ALPHA_VERSION)' src/kernel/dm-target.c
          grep -Fq 'swapz-version.h' src/kernel/Makefile
          grep -Fq 'CANDIDATES = ("off", "swapz")' tests/runtime/benchmark/io-replay.py
          test ! -e kernel
          test ! -e userspace
          test ! -e tools
          if git grep -nE '\b([s]v3_|[S]V3_|swapz[3]ctl|extent-v[3]|swapz_extent_v[3])\b' -- ':!docs/**' ':!test_results.json'; then
            echo 'FAIL: versioned implementation name remains outside documentation'
            exit 1
          fi
          SWAPZ_CI_SCRIPT
          python3 -B tests/tools/product_goals.py ci-run --suite layout-policy -- bash build/ci-layout-policy.sh
      - name: Enforce documentation and test-code placement
        shell: bash
        run: |
          cat > build/ci-documentation-policy.sh <<'SWAPZ_CI_SCRIPT'
          set -Eeuo pipefail
          trap 'printf "SOURCE_CONTRACT_MISMATCH: check failed at line %s: %s\n" "$LINENO" "$BASH_COMMAND" >&2' ERR
          required=(docs/README.md docs/VISION.md docs/ROADMAP.md docs/coding_standards.md docs/testing_standards.md docs/compile.md docs/benchmark.md)
          for file in "${required[@]}"; do
            test -s "$file" || { echo "FAIL: missing documentation $file"; exit 1; }
          done
          # AGENTS.md is repository-control metadata intentionally rooted where
          # coding agents discover it; all maintained project documentation
          # remains under docs/.
          if git ls-files '*.md' | grep -vE '^(docs/|AGENTS\.md$)' | grep -q .; then
            echo 'FAIL: maintained project Markdown must live under docs/ (root AGENTS.md is the sole control-file exception)'
            git ls-files '*.md' | grep -vE '^(docs/|AGENTS\.md$)' || true
            exit 1
          fi
          if git ls-files '*.py' | grep -v '^tests/' | grep -q .; then
            echo 'FAIL: Python is test-only and must live under tests/'
            git ls-files '*.py' | grep -v '^tests/' || true
            exit 1
          fi
          if git ls-files '*.c' '*.h' '*.cpp' '*.hpp' |
             grep -vE '^(src/|tests/)' | grep -q .; then
            echo 'FAIL: native product/test source must live under src/ or tests/'
            git ls-files '*.c' '*.h' '*.cpp' '*.hpp' |
              grep -vE '^(src/|tests/)' || true
            exit 1
          fi
          test -s tests/tools/request-plateau.py
          python3 -B tests/tools/request-plateau.py --bandwidth 20 --sizes 4,8             --latencies 1 --ratios 1 | grep -Fq 'first_plateau_kib=8'
          SWAPZ_CI_SCRIPT
          python3 -B tests/tools/product_goals.py ci-run --suite documentation-policy -- bash build/ci-documentation-policy.sh
      - name: Regression-test repository policy on synthetic main-only histories
        run: python3 -B tests/tools/product_goals.py ci-run --suite repository-policy-regression -- python3 -B tests/runtime/native/repository-policy-test.py -v
      - name: Require applicable non-whitespace canonical co-change
        run: python3 -B tests/tools/product_goals.py ci-run --suite standards-applicability -- python3 -B tests/runtime/native/repository-policy-test.py --enforce
      - name: Require standards co-change for implementation work
        shell: bash
        run: |
          cat > build/ci-standards-policy.sh <<'SWAPZ_CI_SCRIPT'
          set -Eeuo pipefail
          trap 'printf "SOURCE_CONTRACT_MISMATCH: check failed at line %s: %s\n" "$LINENO" "$BASH_COMMAND" >&2' ERR
          standards=(docs/coding_standards.md docs/testing_standards.md docs/compile.md docs/benchmark.md)
          fail() { printf 'SOURCE_CONTRACT_MISMATCH: %s\n' "$*" >&2; exit 1; }
          if ! head_sha="$(git rev-parse --verify 'HEAD^{commit}' 2>/dev/null)"; then
            fail 'missing checked-out HEAD commit'
          fi
          if [[ ! "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ || "$head_sha" != "$GITHUB_SHA" ]]; then
            fail "checkout SHA mismatch expected=${GITHUB_SHA:-unset} actual=$head_sha"
          fi
          if [[ "$(git symbolic-ref --quiet --short HEAD)" != main ]]; then
            fail "commit=$head_sha checkout must be on main"
          fi
          changeset_file="$(mktemp)"
          commit_list_file="$(mktemp)"
          trap 'rm -f "$changeset_file" "$commit_list_file"' EXIT
          if [[ "${GITHUB_EVENT_NAME:-}" == push ]]; then
            push_before="${SWAPZ_PUSH_BEFORE_SHA:-}"
            if [[ ! "$push_before" =~ ^[0-9a-f]{40}$ ||
                  "$push_before" == 0000000000000000000000000000000000000000 ]]; then
              fail "commit=$head_sha push base SHA unavailable or malformed: ${push_before:-unset}"
            fi
            if ! git merge-base --is-ancestor "$push_before" "$head_sha"; then
              fail "commit=$head_sha push base=$push_before is not an ancestor (non-fast-forward or incomplete checkout)"
            fi
            if ! git rev-list --first-parent --reverse "$push_before..$head_sha" > "$commit_list_file"; then
              fail "commit=$head_sha unable to enumerate pushed first-parent commits"
            fi
          else
            printf '%s\n' "$head_sha" > "$commit_list_file"
          fi
          audit_count=0
          last_audited_sha=
          while IFS= read -r commit_sha; do
            if [[ ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
              fail "commit=$head_sha malformed commit-list metadata"
            fi
            ((audit_count += 1))
            last_audited_sha="$commit_sha"
            if ! parent_sha="$(git rev-parse --verify "$commit_sha^1^{commit}" 2>/dev/null)"; then
              fail "commit=$commit_sha missing first parent (checkout must include pushed history)"
            fi
            if (( audit_count == 1 )) && [[ "${GITHUB_EVENT_NAME:-}" == push ]] &&
               [[ "$parent_sha" != "$push_before" ]]; then
              fail "commit=$commit_sha first_parent=$parent_sha does not match push base=$push_before"
            fi
            : > "$changeset_file"
            # Compare each commit object to its own first parent. A later documentation
            # commit cannot qualify an earlier implementation commit from the same push.
            if ! git diff --name-only --no-renames -z "$parent_sha" "$commit_sha" -- > "$changeset_file"; then
              fail "commit=$commit_sha unable to read first-parent changeset"
            fi
            # A partial NUL-delimited record must not silently disappear from the policy scan.
            if [[ -s "$changeset_file" ]] &&
               [[ "$(tail -c 1 "$changeset_file" | od -An -tu1 | tr -d '[:space:]')" != 0 ]]; then
              fail "commit=$commit_sha malformed NUL-delimited changeset metadata"
            fi
            implementation_count=0
            implementation_paths=()
            standard_changed=0
            while IFS= read -r -d '' changed_path; do
              if [[ -z "$changed_path" ]]; then
                fail "commit=$commit_sha empty path in changeset metadata"
              fi
              case "$changed_path" in
                src/*|tests/*|packaging/*|.github/workflows/*|Makefile|dkms.conf)
                  ((implementation_count += 1))
                  if (( ${#implementation_paths[@]} < 8 )); then
                    implementation_paths+=("$changed_path")
                  fi
                  ;;
                docs/coding_standards.md|docs/testing_standards.md|docs/compile.md|docs/benchmark.md)
                  standard_changed=1
                  ;;
              esac
            done < "$changeset_file"
            if (( implementation_count > 0 && !standard_changed )); then
              printf -v first_implementation_path '%q' "${implementation_paths[0]:0:64}"
              printf 'SOURCE_CONTRACT_MISMATCH: commit=%s implementation_path=%s requires same-commit change to one of: %s\n' \
                "$commit_sha" "$first_implementation_path" "${standards[*]}" >&2
              printf 'SOURCE_CONTRACT_MISMATCH: commit=%s first_parent=%s implementation paths (showing %d/%d):\n' \
                "$commit_sha" "$parent_sha" "${#implementation_paths[@]}" "$implementation_count" >&2
              for implementation_path in "${implementation_paths[@]}"; do
                printf 'SOURCE_CONTRACT_MISMATCH: implementation_path=%q\n' "$implementation_path" >&2
              done
              printf 'SOURCE_CONTRACT_MISMATCH: commit=%s corrective_procedure=published history cannot be repaired retroactively; do not amend or force-push and do not add a documentation-only repair; make future release-candidate implementation/test/CI changes together with a meaningful canonical standards update in the same new commit, then non-force fast-forward main and require exact-SHA CI\n' \
                "$commit_sha" >&2
              exit 1
            fi
          done < "$commit_list_file"
          if (( audit_count == 0 )); then
            fail "commit=$head_sha pushed first-parent range is empty"
          fi
          if [[ "$last_audited_sha" != "$head_sha" ]]; then
            fail "commit=$head_sha pushed first-parent range ended at=$last_audited_sha"
          fi
          SWAPZ_CI_SCRIPT
          python3 -B tests/tools/product_goals.py ci-run --suite standards-policy -- bash build/ci-standards-policy.sh
      - name: Retain bounded sanitized failing-suite logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: project-goals-repository-policy-${{ github.sha }}
          path: build/ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  project-goals-conclusion:
    name: Exact-SHA CI result ${{ github.sha }}
    if: always()
    needs: [native-rootless, make-contract, focused-rootless, repository-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      NATIVE_RESULT: ${{ needs.native-rootless.result }}
      MAKE_RESULT: ${{ needs.make-contract.result }}
      FOCUSED_RESULT: ${{ needs.focused-rootless.result }}
      POLICY_RESULT: ${{ needs.repository-policy.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify intentionally skipped exact-SHA commits
        shell: bash
        run: |
          set -euo pipefail
          if ! commit_message="$(git log -1 --format=%B "$GITHUB_SHA" 2>/dev/null)"; then
            printf 'SOURCE_CONTRACT_MISMATCH: commit=%s path=<commit-message> reason=unable to read tested commit message; corrective_procedure=do not qualify this run; verify the exact published SHA and rerun only a code-bearing release candidate without rewriting history\n' "$GITHUB_SHA" >&2
            exit 1
          fi
          if grep -Fqi '[skip ci]' <<<"$commit_message"; then
            changeset_file="$(mktemp)"
            trap 'rm -f "$changeset_file"' EXIT
            if ! git diff --name-only --no-renames -z "$GITHUB_SHA^1" "$GITHUB_SHA" -- > "$changeset_file"; then
              printf 'SOURCE_CONTRACT_MISMATCH: commit=%s path=<unavailable> reason=unable to inspect skipped commit changeset; corrective_procedure=do not qualify this run or rewrite published history; qualify a future code-bearing release-candidate commit normally\n' "$GITHUB_SHA" >&2
              exit 1
            fi
            offending_path='<no-changed-path>'
            if IFS= read -r -d '' changed_path < "$changeset_file"; then
              offending_path="$changed_path"
            fi
            printf -v quoted_path '%q' "$offending_path"
            printf 'SOURCE_CONTRACT_MISMATCH: commit=%s path=%s reason=[skip ci] commits cannot receive fresh exact-SHA CI qualification; corrective_procedure=do not amend or force-push published history; use already-valid CI for the original code-bearing source if available, otherwise qualify a future code-bearing release-candidate commit through a normal non-force main push\n' "$GITHUB_SHA" "$quoted_path" >&2
            printf 'SWAPZ_SKIP_CI_HEAD=1\n' >> "$GITHUB_ENV"
          fi
      - name: Reject failed, skipped, or cancelled prerequisite jobs
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          if [[ "${SWAPZ_SKIP_CI_HEAD:-0}" == 1 ]]; then
            failures=1
          fi
          for job in NATIVE MAKE FOCUSED POLICY; do
            result_variable="${job}_RESULT"
            result="${!result_variable}"
            if [[ "$result" != success ]]; then
              printf '::error title=CI_NOT_QUALIFIED::job=%s result=%s tested_sha=%s gate=dependency required=success observed=%s corrective_procedure=fix-first-blocking-prerequisite-and-qualify-new-main-SHA logs=https://github.com/k1moradi/swapz/actions/runs/%s\n' "$job" "$result" "$GITHUB_SHA" "$result" "$GITHUB_RUN_ID"
              failures=1
            fi
          done
          if (( failures )); then
            echo "FAIL: exact-SHA CI did not complete successfully; skipped and cancelled are not PASS"
            exit 1
          fi
      - name: Audit current-run mandatory jobs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request


          def refuse(gate, required, observed, corrective):
              # Only source-controlled labels and bounded classifications reach CI logs.
              print(f"CI_NOT_QUALIFIED gate={gate} required={required} "
                    f"observed={observed} corrective_procedure={corrective}",
                    file=sys.stderr)
              raise SystemExit(1)


          source_sha = os.environ.get("GITHUB_SHA", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "")
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GITHUB_TOKEN", "")
          if (not re.fullmatch(r"[0-9a-f]{40}", source_sha) or
                  not re.fullmatch(r"[1-9][0-9]*", run_id) or
                  not re.fullmatch(r"[1-9][0-9]*", run_attempt) or
                  not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository) or
                  not token):
              refuse("run-identity", "current-SHA/run/attempt/repository/Actions-token",
                     "missing-or-invalid", "use-a-normal-authenticated-main-push")

          checkout = subprocess.run(["git", "rev-parse", "--verify", "HEAD"],
                                    capture_output=True, text=True, check=False,
                                    timeout=5)
          if checkout.returncode != 0 or checkout.stdout.strip() != source_sha:
              refuse("checkout-source", "HEAD-equals-GITHUB_SHA", "mismatched-or-unavailable",
                     "checkout-the-exact-published-source")

          url = (f"{os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')}"
                 f"/repos/{repository}/actions/runs/{run_id}/attempts/"
                 f"{run_attempt}/jobs?per_page=100")
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  payload = response.read(512 * 1024 + 1)
              if len(payload) > 512 * 1024:
                  raise ValueError("oversized manifest")
              manifest = json.loads(payload)
          except (OSError, ValueError, UnicodeError, TypeError):
              refuse("job-census-api", "bounded-authenticated-current-attempt-job-manifest",
                     "unavailable-or-invalid", "restore-Actions-read-and-recheck-current-attempt")

          prefixes = (
              "Native rootless", "Make interface", "Rootless source-contract",
              "Rootless primary-lifecycle-audit", "Rootless production-readiness",
              "Repository policy",
          )
          expected_count = len(prefixes) + 1  # This in-progress conclusion is the seventh job.
          if (not isinstance(manifest, dict) or
                  type(manifest.get("total_count")) is not int or
                  manifest["total_count"] != expected_count or
                  not isinstance(manifest.get("jobs"), list) or
                  len(manifest["jobs"]) != expected_count or
                  not all(isinstance(job, dict) for job in manifest["jobs"])):
              refuse("job-census-size", f"exactly-{expected_count}-current-attempt-jobs",
                     "missing-extra-or-incomplete", "complete-every-mandatory-job-on-current-SHA")

          jobs = manifest["jobs"]


          def find_unique(prefix):
              name = f"{prefix} {source_sha}"
              matches = [job for job in jobs if job.get("name") == name]
              if len(matches) != 1:
                  refuse("job-census-" + prefix.replace(" ", "-"),
                         "exactly-one-current-SHA-job", f"matching-count-{len(matches)}",
                         "run-all-mandatory-jobs-without-duplicates")
              job = matches[0]
              if (job.get("head_sha") != source_sha or
                      job.get("run_id") != int(run_id) or
                      job.get("run_attempt") != int(run_attempt)):
                  refuse("job-source-" + prefix.replace(" ", "-"),
                         "same-source-run-and-attempt", "stale-or-mismatched",
                         "use-current-run-exact-SHA-job-evidence")
              return job


          for prefix in prefixes:
              job = find_unique(prefix)
              if job.get("status") != "completed" or job.get("conclusion") != "success":
                  allowed = {"queued", "in_progress", "completed", "success", "failure",
                             "skipped", "cancelled", "timed_out", "neutral", "action_required"}
                  status = job.get("status")
                  conclusion = job.get("conclusion")
                  status = status if isinstance(status, str) and status in allowed else "invalid"
                  conclusion = (conclusion if isinstance(conclusion, str) and
                                conclusion in allowed else "invalid")
                  refuse("mandatory-job-" + prefix.replace(" ", "-"),
                         "completed-success", f"{status}-{conclusion}",
                         "fix-failing-or-incomplete-job-and-qualify-a-new-main-SHA")

          conclusion = find_unique("Exact-SHA CI result")
          if conclusion.get("status") != "in_progress":
              refuse("conclusion-job", "current-gate-in-progress", "unexpected-status",
                     "verify-current-run-job-manifest")
          print(f"EXACT_SHA_ROOTLESS_CI_COMPLETE={source_sha}")
          PY
