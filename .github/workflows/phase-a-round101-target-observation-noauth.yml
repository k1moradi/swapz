name: Round101 immutable historical target original completion directed NO_AUTH
on:
  # Historical source proof, not a current-target qualification. No automatic replay.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-target-object:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 790fcb30bad5062956808f0cd0418d2123511245
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact immutable historical checkout
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 790fcb30bad5062956808f0cd0418d2123511245
          test "$(git hash-object src/kernel/dm-target.c)" = 46c2cb832ff0071a028a27b35f63daa84f29914f
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Provision genuine compiler and kernel build prerequisites (runner only)
        run: |
          set -Eeuo pipefail
          sudo -n apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential binutils bc bison flex libelf-dev libssl-dev pkg-config \
            openssl perl python3 xz-utils cpio
          dpkg-query -W libelf-dev libssl-dev gcc binutils
      - uses: actions/checkout@v4
        with:
          ref: 5a36cabf0989dfffc75de52a6ab8cc021092ebf6
          path: frozen-product
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          path: frozen-linux
          persist-credentials: false
      - name: Check immutable historical stage, serial host and target object
        run: |
          set -Eeuo pipefail
          umask 077
          python3 -B tests/tools/round101-target-observation-verify.py frozen-product frozen-linux "$RUNNER_TEMP/round101-agent3"
      - name: Retain bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round101-agent3-target
          path: ${{ runner.temp }}/round101-agent3/
          if-no-files-found: warn
          retention-days: 14
