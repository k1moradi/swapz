name: "Round084 original extent HOST ONLY NO_AUTH"
on:
  push:
    branches: [main]
    paths:
      - "src/kernel/zswap-original-extent.h"
      - "src/kernel/zswap-original-extent.c"
      - "tests/runtime/native/fixtures/round084-original-extent.c"
      - "tests/tools/round084-original-extent-verify.py"
      - ".github/workflows/phase-a-round084-original-extent-host-noauth.yml"
permissions:
  contents: read
jobs:
  original-extent-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact push source policy and actual extent semantic qualification
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          python3 -B tests/tools/round084-original-extent-verify.py "$RUNNER_TEMP/agent5-results.json"
      - name: Retain failure before verifier entry
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          if [[ ! -f "$RUNNER_TEMP/agent5-results.json" ]]; then
            python3 -B - "$RUNNER_TEMP/agent5-results.json" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path
          sha = os.environ.get("GITHUB_SHA", "")
          reason = "checkout or verifier entry failed before result creation"
          Path(sys.argv[1]).write_text(json.dumps({
              "tested_commit": sha if re.fullmatch(r"[0-9a-f]{40}", sha) else None,
              "preflight": {"status": "FAIL"}, "compilers": {},
              "first_error": reason, "conclusion": "FAIL",
              "source_mapped_authenticated": 0, "phase_a": "BLOCKED",
              "import_active": 0, "native": "NOT_RUN"
          }, indent=2) + "\n")
          print("ROUND086_AGENT5_FIRST_ERROR " + reason, file=sys.stderr)
          print("Corrective action: inspect failed exact-source checkout/entry step; "
                "do not bypass policy.", file=sys.stderr)
          PY
          fi
      - name: Preserve bounded host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round084-agent5-original-extent-host
          path: ${{ runner.temp }}/agent5-results.json
          if-no-files-found: warn
          retention-days: 14
