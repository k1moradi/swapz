name: Round066 actual allocator-owned native-tag disk map no-auth source proof
on:
  push:
    branches: [main]
    paths:
      - 'src/kernel/authority.c'
      - 'src/kernel/authority.h'
      - 'tests/runtime/native/fixtures/round066-import-disk-actual-authority.c'
      - 'tests/tools/round066-authority-import-owned-map-verify.py'
      - '.github/workflows/phase-a-round066-authority-import-owned-map-noauth.yml'
      - 'docs/testing_standards.md'
  workflow_dispatch:
jobs:
  actual-import-disk-owner-noauth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact main source and safe diff
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
      - name: Actual allocator owner GCC Clang ASan UBSan and 20 real semantic mutants
        run: python3 -B tests/tools/round066-authority-import-owned-map-verify.py
      - name: Original dormant import and actual strict product semantic regressions
        run: python3 -B tests/tools/round059-authority-import-lifetime.py
      - name: Original linked production RAW CRC flush and actual semantic regressions
        run: python3 -B tests/tools/round057-transaction-product.py
      - name: Enforce first-parent and same-commit canonical testing standards
        run: python3 -B tests/runtime/native/repository-policy-test.py --enforce
