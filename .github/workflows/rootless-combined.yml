name: Rootless combined source qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rootless-combined.yml'
      - '.github/workflows/rootless-nbd.yml'
      - '.github/workflows/rootless-teardown.yml'
      - 'tests/runtime/**'
  pull_request:
    paths:
      - '.github/workflows/rootless-combined.yml'
      - '.github/workflows/rootless-nbd.yml'
      - '.github/workflows/rootless-teardown.yml'
      - 'tests/runtime/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Record exact joint source identity
        shell: bash
        run: |
          set -euo pipefail
          echo "COMBINED_TESTED_HEAD=$(git rev-parse HEAD)"
          echo "NBD_BLOB=$(git rev-parse HEAD:tests/runtime/size-aware-nbd.py)"
          echo "KERNEL_BLOB=$(git rev-parse HEAD:kernel/dm-swapz.c)"
          git status --short
      - name: Refuse captured syscalls before running NBD selftest
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          source = Path("tests/runtime/size-aware-nbd.py").read_text()
          tree = ast.parse(source)
          functions = {node.name: node for node in tree.body
                       if isinstance(node, ast.FunctionDef)}
          shutdown = functions["shutdown_kernel_session"]
          defaults = dict(zip((arg.arg for arg in shutdown.args.kwonlyargs),
                              shutdown.args.kw_defaults))
          for key in ("ioctl", "close_fd"):
              value = defaults[key]
              assert isinstance(value, ast.Constant) and value.value is None, (
                  f"unsafe captured syscall default: {key}")
          gates = functions["selftest_failure_gates"]
          assert any(
              isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "fake_fd"
                      for target in node.targets)
              and isinstance(node.value, ast.Call)
              and isinstance(node.value.func, ast.Name)
              and node.value.func.id == "object"
              for node in ast.walk(gates)
          ), "mock must use non-integer fd sentinel"
          assert 'return_value=fake_fd' in source, "mocked os.open missing sentinel"
          assert 'mock.patch("fcntl.ioctl"' in source, "ioctl patch missing"
          assert 'mock.patch("os.close"' in source, "close patch missing"
          print("COMBINED_NBD_STATIC_SYSCALL_ISOLATION: PASS")
          PY
      - name: All rootless Bash syntax gates
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            tests/runtime/test-stack-teardown.sh \
            tests/runtime/test-stack-teardown-regression.sh \
            tests/runtime/pressure-teardown.sh \
            tests/runtime/pressure-teardown-regression.sh \
            tests/runtime/no-discard-livegc.sh \
            tests/runtime/buffer-recall.sh \
            tests/runtime/pressure.sh \
            tests/runtime/pressure-runner.sh \
            tests/runtime/pressure-runner-regression.sh \
            tests/runtime/streaming-benchmark.sh \
            tests/runtime/streaming-benchmark-teardown.sh \
            tests/runtime/size-aware-nbd-teardown-test.sh; do
            bash -n "$file"
          done
          echo "COMBINED_BASH_SYNTAX_12: PASS"
      - name: Full DM and loop teardown mocks
        run: bash tests/runtime/test-stack-teardown-regression.sh
      - name: Full pressure teardown mocks
        run: bash tests/runtime/pressure-teardown-regression.sh
      - name: Gated pidfd supervisor rootless safety regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/test-child-supervisor.py tests/runtime/test-child-supervisor-regression.py
          timeout 40s python3 tests/runtime/test-child-supervisor-regression.py -v
      - name: Repeat pidfd supervisor regression in separate processes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..3}; do
            if ! timeout 40s python3 tests/runtime/test-child-supervisor-regression.py -q >"$RUNNER_TEMP/pidfd-supervisor-repeat.log" 2>&1; then
              echo "PIDFD_SUPERVISOR_REPEAT $attempt/3: FAIL"
              cat "$RUNNER_TEMP/pidfd-supervisor-repeat.log"
              exit 1
            fi
            echo "PIDFD_SUPERVISOR_REPEAT $attempt/3: PASS"
          done
      - name: Rootless pidfd supervisor IPC service regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/test-child-supervisor-service.py tests/runtime/test-child-supervisor-service-regression.py
          timeout 50s python3 tests/runtime/test-child-supervisor-service-regression.py -v
      - name: Repeat pidfd IPC service regression in ten separate processes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if ! timeout 15s python3 tests/runtime/test-child-supervisor-service-regression.py -q >"$RUNNER_TEMP/pidfd-ipc-repeat.log" 2>&1; then
              echo "PIDFD_IPC_REPEAT $attempt/10: FAIL"
              cat "$RUNNER_TEMP/pidfd-ipc-repeat.log"
              exit 1
            fi
            echo "PIDFD_IPC_REPEAT $attempt/10: PASS"
          done
      - name: Rootless recall IPC adapter regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-ipc-adapter.py tests/runtime/recall-ipc-adapter-test.py
          timeout 60s python3 tests/runtime/recall-ipc-adapter-test.py -v
      - name: Rootless five-role readback and IPC bridge regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-role-bridge-test.py
          timeout 35s python3 tests/runtime/recall-role-bridge-test.py -v
      - name: Rootless real role service IPC protocol integration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-role-service-integration-test.py
          timeout 35s python3 tests/runtime/recall-role-service-integration-test.py -v
      - name: Separate-process pinned direct dd recall and attested readback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-role-process-fixture.py tests/runtime/recall-role-process-integration-test.py
          timeout 65s python3 -B tests/runtime/recall-role-process-integration-test.py -v
      - name: Genuine Bash synthetic role coprocess lifecycle
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/runtime/recall-role-bridge-regression.sh
          python3 -m py_compile tests/runtime/recall-role-bridge-fixture.py
          timeout 35s bash tests/runtime/recall-role-bridge-regression.sh
      - name: Persistent Bash pidfd IPC control bridge rootless regression
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/runtime/recall-control-bridge-regression.sh
          python3 -m py_compile tests/runtime/recall-control-bridge.py tests/runtime/recall-control-bridge-test.py
          timeout 110s bash tests/runtime/recall-control-bridge-regression.sh
      - name: Strict fixture-bound direct dd role allowlist regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-dd-allowlist.py tests/runtime/recall-dd-allowlist-test.py
          timeout 20s python3 tests/runtime/recall-dd-allowlist-test.py -v
      - name: GNU provenance and worker build-record binding unit tests (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/gnu-coreutils-qualification.py tests/runtime/gnu-coreutils-qualification-test.py tests/runtime/recall-gnu-dd-seccomp-qualification.py tests/runtime/recall-gnu-dd-seccomp-qualification-test.py
          timeout 30s python3 -B tests/runtime/gnu-coreutils-qualification-test.py -v
          timeout 20s python3 -B tests/runtime/recall-gnu-dd-seccomp-qualification-test.py -v
          echo "GNU_POLICY_UNIT_TESTS_ONLY: PASS (no authenticated GNU build or real worker executed)"
      - name: Rootless pinned direct dd worker integration regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-dd-worker-integration-test.py
          timeout 35s python3 tests/runtime/recall-dd-worker-integration-test.py -v
      - name: Pinned recall readback identity regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-readback-identity.py tests/runtime/recall-readback-identity-test.py
          timeout 20s python3 tests/runtime/recall-readback-identity-test.py -v
      - name: Rootless direct recall I/O orchestration test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-io-plan.py tests/runtime/recall-io-plan-test.py
          python3 tests/runtime/recall-io-plan-test.py -v
      - name: Strict pressure swap inventory parser unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/pressure-swap-inventory.py tests/runtime/pressure-swap-inventory-test.py
          python3 tests/runtime/pressure-swap-inventory-test.py -v
      - name: Rootless production pressure controller regression
        run: bash tests/runtime/pressure-runner-regression.sh
      - name: Rootless pressure checkpoint release-token tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/pressure_checkpoint.py tests/runtime/pressure-helper.py tests/runtime/pressure-checkpoint-test.py
          python3 tests/runtime/pressure-checkpoint-test.py -v
      - name: Repeat pressure token safety regression in separate processes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if ! timeout 12s python3 tests/runtime/pressure-checkpoint-test.py \
                >"$RUNNER_TEMP/pressure-token-repeat.log" 2>&1; then
              echo "PRESSURE_TOKEN_REPEAT $attempt/10: FAIL"
              cat "$RUNNER_TEMP/pressure-token-repeat.log"
              exit 1
            fi
            echo "PRESSURE_TOKEN_REPEAT $attempt/10: PASS"
          done
      - name: Rootless streaming single-sweep reporting safety regression
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/runtime/streaming-benchmark.sh
          python3 -m py_compile tests/runtime/streaming-benchmark-report.py tests/runtime/streaming-benchmark-report-test.py
          timeout 25s python3 -B tests/runtime/streaming-benchmark-report-test.py -v
      - name: Rootless pidfd-owned NBD mock server lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/nbd-pidfd-owned-session.py tests/runtime/nbd-pidfd-owned-mock-child.py tests/runtime/nbd-pidfd-owned-session-test.py tests/runtime/nbd-pidfd-crash-owner.py tests/runtime/nbd_pidfd_child_policy.py
          timeout 35s python3 -B tests/runtime/nbd-pidfd-owned-session-test.py -v
      - name: Rootless DM IO drain policy and synthetic orchestration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-io-drain-policy.py tests/runtime/recall-io-drain-policy-test.py tests/runtime/recall-io-drain-orchestrator.py tests/runtime/recall-io-drain-orchestrator-test.py
          timeout 25s python3 -B tests/runtime/recall-io-drain-policy-test.py -v
          timeout 25s python3 -B tests/runtime/recall-io-drain-orchestrator-test.py -v
      - name: Rootless offline physical drain plateau evidence regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/v22-drain-plateau-analyze.py tests/runtime/v22-drain-plateau-analyze-test.py
          timeout 25s python3 -B tests/runtime/v22-drain-plateau-analyze-test.py -v
      - name: Offline live GC analyzer tests
        run: python3 tests/runtime/live-gc-latency-analyze-test.py -v
      - name: Compile and run full NBD userspace protocol selftest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/size-aware-nbd.py
          python3 tests/runtime/size-aware-nbd.py selftest
      - name: Recheck NBD selftest race in 25 separate processes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..25}; do
            if ! timeout 15s python3 tests/runtime/size-aware-nbd.py selftest \
                >"$RUNNER_TEMP/joint-nbd-selftest.log" 2>&1; then
              printf 'FAIL: NBD selftest process %s/25\n' "$attempt"
              cat "$RUNNER_TEMP/joint-nbd-selftest.log"
              exit 1
            fi
            echo "COMBINED_NBD_STRESS $attempt/25: PASS"
          done
      - name: Rootless NBD teardown mock
        run: bash tests/runtime/size-aware-nbd-teardown-test.sh
      - name: Rootless streaming teardown mock
        run: bash tests/runtime/streaming-teardown-regression.sh
      - name: Report joint rootless gate PASS
        shell: bash
        run: |
          {
            echo "## Combined rootless source gate: PASS"
            echo ""
            echo "Tested commit: \`$(git rev-parse HEAD)\`"
            echo ""
            echo "12 Bash syntax checks, 3 teardown regressions, 27-test pidfd supervisor with 3 repeats, 23-test IPC service with 10 repeats, rootless IPC adapter, persistent Bash pidfd control bridge, direct-dd allowlist, direct recall I/O, strict swap inventory and pressure token tests, 11 offline GC analyzer"
            echo "tests, static NBD syscall isolation, NBD compilation, 26 complete"
            echo "NBD selftests and 2 NBD/streaming teardown mocks all passed."
            echo ""
            echo "**No real DM/loop/NBD, swap or physical device operations.**"
          } >>"$GITHUB_STEP_SUMMARY"
