name: Round073 pinned original reader pin GC retained decoder NO_AUTH
on:
  push:
    branches: [main]
    paths:
      - 'tests/runtime/native/fixtures/round073-original-reader-pin-gc-kunit.cfrag'
      - 'tests/tools/round073-stage-original-reader-pin-gc.py'
      - 'tests/tools/round073-original-reader-pin-gc-verify.py'
      - 'tests/tools/round077-original-reader-delay-compile-verify.py'
      - 'tests/tools/round080-original-reader-late-lease-verify.py'
      - '.github/workflows/phase-a-round073-original-reader-pin-gc-noauth.yml'
      - 'src/kernel/authority.c'
      - 'src/kernel/zswap-import-decoder-owner.c'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  original-reader-strict-source-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install rootless host compiler and original codec headers
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/round073-host-deps.log"
          if ! sudo -n apt-get update -qq >"$log" 2>&1 ||
             ! sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq                --no-install-recommends gcc clang liblzo2-dev liblz4-dev libssl-dev >>"$log" 2>&1; then
            echo '::error::ROUND073_READER_FIRST_ERROR phase=host-dependencies' >&2
            exit 3
          fi
      - name: Strict original-source C23 GCC Clang sanitizers and executed semantic mutants
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
          python3 -B tests/tools/round073-original-reader-pin-gc-verify.py self-test
          python3 -B tests/tools/round073-original-reader-pin-gc-verify.py host
          python3 -B tests/tools/round080-original-reader-late-lease-verify.py
      # This original kernel sparse read happens AFTER the clean repo and
      # policy checks, so nested original-linux remains test-only and cannot
      # taint the tracked checkout cleanliness preflight.
      - name: Canonical cumulative testing standards and no-extra-branch policy
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 -B tests/runtime/native/repository-policy-test.py --enforce

      - name: Checkout pinned original Linux declaration and source exact blobs
        uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          fetch-depth: 1
          path: original-linux
          persist-credentials: false
          sparse-checkout: |
            include/linux/delay.h
            mm/zswap.c
          sparse-checkout-cone-mode: false
      - name: Compile execute original pinned inline and reject undeclared source call
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C original-linux rev-parse HEAD)" = c339f4010dea8b0d754f84ace70cd1b089878ef8
          python3 -B tests/tools/round077-original-reader-delay-compile-verify.py --linux-root original-linux
  original-linux-uml-reader-pin-gc-kunit:
    needs: original-reader-strict-source-host
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          fetch-depth: 1
          path: linux
          persist-credentials: false
      - name: Pristine pinned original and independent original READ-side scratch stage
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          test "$(git -C swapz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C linux rev-parse HEAD)" = c339f4010dea8b0d754f84ace70cd1b089878ef8
          test -z "$(git -C swapz status --porcelain --untracked-files=all)"
          mkdir -p round073-evidence
          python3 -B swapz/tests/tools/round058-original-stored-bio-chain.py stage             --linux-root linux --manifest round073-evidence/inherited-round058.json
          python3 -B swapz/tests/tools/round069-stage-original-zswap-stored-source.py             --linux-root linux --base-manifest round073-evidence/inherited-round058.json             --manifest round073-evidence/inherited-round069.json --verify-only
          python3 -B swapz/tests/tools/round069-stage-original-zswap-stored-source.py             --linux-root linux --base-manifest round073-evidence/inherited-round058.json             --manifest round073-evidence/inherited-round069.json
          python3 -B swapz/tests/tools/round073-stage-original-reader-pin-gc.py             --linux-root linux --base-manifest round073-evidence/inherited-round069.json             --manifest round073-evidence/reader-stage.json --verify-only
          python3 -B swapz/tests/tools/round073-stage-original-reader-pin-gc.py             --linux-root linux --base-manifest round073-evidence/inherited-round069.json             --manifest round073-evidence/reader-stage.json
          python3 -B swapz/tests/tools/round073-stage-original-reader-pin-gc.py             --linux-root linux --base-manifest round073-evidence/inherited-round069.json             --manifest round073-evidence/reader-stage.json --verify-stage
          git -C linux diff --check
      - name: Install ephemeral original UML build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/round073-native-deps.log"
          if ! sudo -n apt-get update -qq >"$log" 2>&1 ||
             ! sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq                --no-install-recommends build-essential bc bison flex clang                libelf-dev libssl-dev libncurses-dev liblz4-dev python3                python3-pyelftools binutils >>"$log" 2>&1; then
            echo '::error::ROUND073_READER_FIRST_ERROR phase=original-UML-dependencies' >&2
            exit 3
          fi
      - name: Original pinned Linux UML compile boot and genuine reader GC KUnit JSON KTAP
        shell: bash
        timeout-minutes: 95
        run: |
          set -Eeuo pipefail
          umask 077
          phase=original-uml-build-boot
          log=round073-evidence/first-native-error.log
          out="$RUNNER_TEMP/round073-original-reader-uml"
          request="$RUNNER_TEMP/round073-original-reader.kunitconfig"
          result="$PWD/round073-evidence/original-reader-kunit.json"
          cat >"$request" <<'KUNIT_CONFIG'
          CONFIG_KUNIT=y
          CONFIG_BLOCK=y
          CONFIG_SWAP=y
          CONFIG_ZSWAP=y
          CONFIG_CRYPTO=y
          CONFIG_CRYPTO_LZO=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_CRC32C=y
          CONFIG_CRYPTO_SHA256=y
          CONFIG_CRYPTO_LIB_SHA256=y
          CONFIG_CRC32=y
          CONFIG_LZO_COMPRESS=y
          CONFIG_LZO_DECOMPRESS=y
          CONFIG_LZ4_COMPRESS=y
          CONFIG_LZ4_DECOMPRESS=y
          # CONFIG_CGROUPS is not set
          # CONFIG_KUNIT_ALL_TESTS is not set
          KUNIT_CONFIG
          first_error() {
            local code="$1"
            echo "::error::ROUND073_READER_FIRST_ERROR phase=$phase exit=$code" >&2
            # The previous timeout artifact omitted raw KTAP and its hang
            # stage. Preserve it on failure before reporting the first cause.
            if test -s "$out/test.log"; then
              cp "$out/test.log" round073-evidence/last-native-raw-KTAP.log
            fi
            grep -hE -m1 'ROUND080_READER_NATIVE_FIRST_ERROR|ROUND073_READER_NATIVE_FIRST_ERROR|fatal error:|error:|undefined reference|not ok|Kernel panic|KASAN:|UBSAN:|timed out after' "$out/test.log" "$log" 2>/dev/null |
              cut -c1-260 >&2 || true
            return "$code"
          }
          flags='-DSWAPZ_ROUND069_ORIGINAL_STORED_SOURCE_TEST=1 -DSWAPZ_ROUND065_ORIGINAL_DM_TABLE_TEST=1 -DSWAPZ_ROUND064_ORIGINAL_SLOT_TARGET_TEST=1 -DSWAPZ_ROUND056_PREERASE_SINGLE_OWNER_TEST=1 -DSWAPZ_ROUND063_ORIGINAL_DM_OWNER_TEST=1 -DSWAPZ_ROUND028_SLOT_EPOCH_SOURCE=1 -DSWAPZ_ROUND030_EVICTION_SNAPSHOT_SOURCE=1 -DSWAPZ_ROUND025_SIDEBAND_CI_ONLY=1 -DSWAPZ_ROUND031_MM_BIO_SOURCE=1 -DSWAPZ_ROUND032_BIO_COPY_VIEW_CI_ONLY=1 -DSWAPZ_ROUND034_ORIGINAL_V1_KUNIT_TEST=1 -DSWAPZ_ROUND035_ORIGINAL_MM_ROUTE_WITNESS_TEST=1 -DSWAPZ_ROUND036_ORIGINAL_ROUTE_LIFETIME_TEST=1 -DSWAPZ_ROUND037_ORIGINAL_MM_LIFETIME_OWNER_TEST=1 -DSWAPZ_ROUND038_ORIGINAL_STORE_PROVENANCE_TEST=1 -DSWAPZ_ROUND040_ORIGINAL_ASYNC_SLOT_LEASE_NEGATIVE_TEST=1 -DSWAPZ_ROUND041_ORIGINAL_SECTOR_TO_DM_NONAUTHORITY_TEST=1 -DSWAPZ_ROUND042_ORIGINAL_STORED_WRITEBACK_LIFETIME_TEST=1 -DSWAPZ_ROUND043_ORIGINAL_BIO_CLONE_COPY_TEST=1 -DSWAPZ_ROUND045_ORIGINAL_STORED_BIO_SOURCE_SCOPE_TEST=1 -DSWAPZ_ROUND049_ORIGINAL_LOCKED_FOLIO_COUNT_PAIR_TEST=1 -DSWAPZ_ROUND052_ORIGINAL_PRE_UNUSE_CANCEL_TEST=1 -DSWAPZ_ROUND056_ORIGINAL_CLONE_PROVENANCE_TEST=1 -DSWAPZ_ROUND058_ORIGINAL_STORED_BIO_CHAIN_TEST=1 -DSWAPZ_ROUND066_IMPORT_DISK_TEST=1 -DSWAPZ_ROUND067_IMPORT_DISK_PAYLOAD_TEST=1 -DSWAPZ_ROUND068_IMPORT_LOWER_BIO_TEST=1 -DSWAPZ_ROUND069_ORIGINAL_BIO_AUTHORITY_JOIN_KUNIT=1 -DSWAPZ_ROUND073_ORIGINAL_READER_PIN_GC_KUNIT=1'
          # Actual staging and postimage validation already succeeded.
          # Build once, then keep a separate JSON and raw KTAP for each boot.
          phase=original-uml-build
          if timeout -k 10s 82m python3 -B linux/tools/testing/kunit/kunit.py build \
              --arch=um --build_dir="$out" --kunitconfig="$request" \
              --make_options="KCFLAGS=$flags -Werror" --jobs=2 >"$log" 2>&1; then
            test -x "$out/linux" || { first_error 3; exit 3; }
          else
            code=$?
            first_error "$code"
            exit "$code"
          fi
          for case in swapz_round073_original_lz4_old_reader_gc \
                      swapz_round073_original_lzo1x_old_reader_gc \
                      swapz_round073_original_stale_crc_sha_codec \
                      swapz_round073_original_decoder_retire_with_pin; do
            phase="isolated-$case"
            log="round073-evidence/$case-run.log"
            isolated="$PWD/round073-evidence/$case.json"
            if timeout -k 5s 40s python3 -B linux/tools/testing/kunit/kunit.py exec \
                --arch=um --build_dir="$out" --timeout=25 --json="$isolated" \
                "swapz_round073_original_reader_pin_gc.$case" >"$log" 2>&1; then
              cp "$out/test.log" "round073-evidence/$case-KTAP.log"
              python3 -B swapz/tests/tools/round073-original-reader-pin-gc-verify.py \
                verify-native --case "$case" --result "$isolated" --kernel-log "$out/test.log" ||
                { first_error 3; exit 3; }
            else
              code=$?
              first_error "$code"
              exit "$code"
            fi
          done
          # Reuse that exact binary; only the combined suite can qualify
          # full original Linux native KUnit 4/4 JSON + raw KTAP.
          phase=original-uml-combined-four
          log=round073-evidence/combined-first-native-error.log
          if timeout -k 10s 5m python3 -B linux/tools/testing/kunit/kunit.py exec             --arch=um --build_dir="$out" --timeout=120             --json="$result" 'swapz_round073_original_reader_pin_gc*' >"$log" 2>&1; then
            cp "$out/test.log" round073-evidence/combined-native-KTAP.log
            echo 'ROUND073_ORIGINAL_LINUX_UML_BOOT_EXECUTED'
          else
            code=$?
            first_error "$code"
            exit "$code"
          fi
          phase=effective-original-config
          test -x "$out/linux" && test -s "$out/test.log" && test -s "$result" ||
            { first_error 3; exit 3; }
          for symbol in CONFIG_KUNIT=y CONFIG_ZSWAP=y CONFIG_CRYPTO_LZO=y             CONFIG_CRYPTO_LZ4=y CONFIG_CRYPTO_CRC32C=y             CONFIG_LZO_COMPRESS=y CONFIG_LZO_DECOMPRESS=y             CONFIG_LZ4_COMPRESS=y CONFIG_LZ4_DECOMPRESS=y; do
            grep -Fxq "$symbol" "$out/.config" ||
              { echo "::error::ROUND073_READER_FIRST_ERROR effective-config=$symbol" >&2; exit 3; }
          done
          phase=native-real-JSON-KTAP
          python3 -B swapz/tests/tools/round073-original-reader-pin-gc-verify.py             verify-native --result "$result" --kernel-log "$out/test.log" ||
            { first_error 3; exit 3; }
          cp "$out/test.log" round073-evidence/native-original-KTAP.log
          echo 'ROUND073_GENUINE_PINNED_ORIGINAL_NATIVE_READER_KUNIT_PASS 4/4 original codecs=2 GC pin + decoder close AUTH=0'
      - name: Upload bounded original-native evidence without publishing any activation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round073-original-reader-pin-gc-native
          path: round073-evidence/
          if-no-files-found: warn
          retention-days: 14
