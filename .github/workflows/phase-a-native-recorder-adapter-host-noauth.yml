name: Kernel observation adapter host NO_AUTH
on:
  push:
    branches: [main]
    paths:
      - 'src/kernel/native-observation-recorder.c'
      - 'src/kernel/native-observation-recorder.h'
      - 'tests/runtime/native/fixtures/native-observation-kernel-adapter.c'
      - 'tests/runtime/native/fixtures/native-observation-kernel-shim.h'
      - '.github/workflows/phase-a-native-recorder-adapter-host-noauth.yml'
permissions:
  contents: read
jobs:
  adapter-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source and complete historical standards prefix
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD^)" = "$SWAPZ_PUSH_BEFORE_SHA"
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
          python3 -B tests/runtime/native/repository-policy-test.py --enforce
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          previous = subprocess.check_output(["git", "show", "HEAD^:docs/testing_standards.md"])
          freeze = subprocess.check_output(["git", "show", "cb38c5de310edc4842e77099b92fc709e1934322:docs/testing_standards.md"])
          current = Path("docs/testing_standards.md").read_bytes()
          assert len(freeze) == 1856114
          assert previous.startswith(freeze)
          assert current.startswith(previous) and len(current) > len(previous)
          print("complete standards prefix", len(previous), len(current), hashlib.sha256(previous).hexdigest())
          PY
      - name: Actual adapter C with explicitly substituted host primitives
        run: |
          set -Eeuo pipefail
          umask 077
          out="$RUNNER_TEMP/native-recorder-adapter"
          mkdir -p "$out/include/linux" "$out/include/asm"
          for header in linux/types.h linux/atomic.h linux/compiler.h linux/limits.h linux/string.h asm/barrier.h; do
            printf '#include "native-observation-kernel-shim.h"\n' > "$out/include/$header"
          done
          for compiler in gcc clang; do
            "$compiler" --version | head -1
            "$compiler" -std=gnu11 -O2 -g -Wall -Wextra -Wconversion -Wsign-conversion -Wshadow -Werror \
              -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie -pthread \
              -I"$out/include" -Itests/runtime/native/fixtures -Isrc/kernel \
              src/kernel/native-observation-recorder.c \
              tests/runtime/native/fixtures/native-observation-kernel-adapter.c \
              -o "$out/$compiler-adapter" 2>&1 | tee "$out/$compiler-compile.log"
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
              timeout 20 "$out/$compiler-adapter" 2>&1 | tee "$out/$compiler-adapter.log"
          done
      - name: Retain bounded host diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-recorder-adapter-host-noauth
          path: ${{ runner.temp }}/native-recorder-adapter/*.log
          if-no-files-found: warn
          retention-days: 14
