name: Round096 actual provider broker lifetime HOST ONLY NO_AUTH
on:
  push:
    branches: [main]
    paths:
      - 'tests/runtime/native/fixtures/round096-provider-broker-lifetime.c'
      - 'tests/tools/round096-provider-broker-lifetime-verify.py'
      - '.github/workflows/phase-a-round096-provider-broker-lifetime-host-noauth.yml'
permissions:
  contents: read
jobs:
  actual-provider-broker-lifetime-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source and sole main push parent
        shell: bash
        working-directory: swapz
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::R096_A7_FIRST_ERROR source preflight line=$LINENO" >&2' ERR
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          test "$(git rev-parse HEAD^1)" = "$SWAPZ_PUSH_BEFORE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
          python3 -B tests/runtime/native/repository-policy-test.py --enforce
          test "$(grep -Fc '#define SWAPZ_ORIGINAL_DECODER_SHARED_ACTIVE 0U' src/kernel/zswap-original-decoder-shared.h)" -eq 1
          test "$(grep -Fc '#define SWAPZ_ORIGINAL_DECODER_BRIDGE_ACTIVE 0U' src/kernel/zswap-original-decoder-bridge.h)" -eq 1
          test "$(grep -Fc '#define SWAPZ_ZSWAP_IMPORT_ACTIVE 0U' src/kernel/zswap-import-codec.h)" -eq 1
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          path: original-linux
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            mm/zswap.c
            crypto/lzo.c
            crypto/lz4.c
            include/linux/lzo.h
            include/linux/lz4.h
            lib/lzo/lzo1x_compress.c
            lib/lzo/lzo1x_compress_safe.c
            lib/lzo/lzo1x_decompress_safe.c
            lib/lzo/lzodefs.h
            lib/lz4/lz4_compress.c
            lib/lz4/lz4_decompress.c
            lib/lz4/lz4defs.h
      - name: Actual frozen gate and broker with real original codecs
        shell: bash
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          umask 077
          evidence="$RUNNER_TEMP/round096-agent7"
          mkdir -p "$evidence"
          for tool in gcc clang python3; do
            command -v "$tool" >/dev/null || {
              echo "::error::R096_A7_FIRST_ERROR missing compiler or verifier" >&2
              exit 1
            }
          done
          test -f /usr/include/openssl/sha.h
          if python3 -B swapz/tests/tools/round096-provider-broker-lifetime-verify.py \
              --linux-root original-linux --evidence-dir "$evidence" \
              >"$evidence/console.log" 2>"$evidence/console.err"; then
            grep -E 'PASS R096_A7 ' "$evidence/console.log"
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(json.dumps({k:r[k] for k in ("tested_commit","parent","compilers","conclusion","first_error")}))' "$evidence/results.json"
          else
            exit_code=$?
            echo "::error::R096_A7_FIRST_ERROR source-linked qualification exit=$exit_code" >&2
            grep -E '^R096_A7_FIRST_ERROR ' "$evidence/console.err" >&2 || true
            exit "$exit_code"
          fi
      - name: Retain bounded source-linked results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round096-agent7-actual-provider-broker-host
          path: ${{ runner.temp }}/round096-agent7/
          if-no-files-found: warn
          retention-days: 14
