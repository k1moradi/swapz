name: Rootless NBD source safety

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rootless-nbd.yml'
      - '.github/workflows/rootless-combined.yml'
      - '.github/workflows/rootless-teardown.yml'
      - 'tests/runtime/size-aware-nbd.py'
      - 'tests/runtime/size-aware-nbd-teardown-test.sh'
      - 'tests/runtime/streaming-teardown-regression.sh'
      - 'tests/runtime/streaming-benchmark.sh'
      - 'tests/runtime/streaming-benchmark-plan.py'
      - 'tests/runtime/streaming-benchmark-plan-test.py'
      - 'tests/runtime/streaming-benchmark-read-latency.py'
      - 'tests/runtime/streaming-benchmark-read-latency-test.py'
      - 'tests/runtime/streaming-benchmark-teardown.sh'
      - 'tests/runtime/nbd-pidfd-owned-session.py'
      - 'tests/runtime/nbd-pidfd-owned-mock-child.py'
      - 'tests/runtime/nbd-pidfd-owned-session-test.py'
      - 'tests/runtime/nbd-pidfd-crash-owner.py'
      - 'tests/runtime/nbd_pidfd_child_policy.py'
      - 'tests/runtime/rootless-workflow-contract-test.py'
  pull_request:
    paths:
      - '.github/workflows/rootless-nbd.yml'
      - '.github/workflows/rootless-combined.yml'
      - '.github/workflows/rootless-teardown.yml'
      - 'tests/runtime/size-aware-nbd.py'
      - 'tests/runtime/size-aware-nbd-teardown-test.sh'
      - 'tests/runtime/streaming-teardown-regression.sh'
      - 'tests/runtime/streaming-benchmark.sh'
      - 'tests/runtime/streaming-benchmark-plan.py'
      - 'tests/runtime/streaming-benchmark-plan-test.py'
      - 'tests/runtime/streaming-benchmark-read-latency.py'
      - 'tests/runtime/streaming-benchmark-read-latency-test.py'
      - 'tests/runtime/streaming-benchmark-teardown.sh'
      - 'tests/runtime/nbd-pidfd-owned-session.py'
      - 'tests/runtime/nbd-pidfd-owned-mock-child.py'
      - 'tests/runtime/nbd-pidfd-owned-session-test.py'
      - 'tests/runtime/nbd-pidfd-crash-owner.py'
      - 'tests/runtime/nbd_pidfd_child_policy.py'
      - 'tests/runtime/rootless-workflow-contract-test.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Guard standalone rootless NBD source and syscall/stress gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/rootless-workflow-contract-test.py
          timeout 20s python3 -B tests/runtime/rootless-workflow-contract-test.py -v
          echo "ROOTLESS_NBD_WORKFLOW_CONTRACT: PASS (no real device attachment)"
      - name: Static syscall isolation gate (before any selftest)
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          src = Path("tests/runtime/size-aware-nbd.py").read_text()
          tree = ast.parse(src)
          def function(name):
              return next(n for n in tree.body if isinstance(n, ast.FunctionDef)
                          and n.name == name)
          shutdown = function("shutdown_kernel_session")
          defaults = dict(zip((a.arg for a in shutdown.args.kwonlyargs),
                              shutdown.args.kw_defaults))
          for key in ("ioctl", "close_fd"):
              assert isinstance(defaults[key], ast.Constant) and defaults[key].value is None, (
                  f"unsafe captured syscall default: {key}")
          guards = function("selftest_failure_gates")
          assert any(
              isinstance(n, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "fake_fd" for t in n.targets)
              and isinstance(n.value, ast.Call)
              and isinstance(n.value.func, ast.Name)
              and n.value.func.id == "object"
              for n in ast.walk(guards)
          ), "fake setup fd must be a non-integer object"
          assert "return_value=fake_fd" in src, "mocked os.open must return sentinel fd"
          assert "mock.patch(\"fcntl.ioctl\"" in src and "mock.patch(\"os.close\"" in src, (
              "syscalls must be patched inside setup mock")
          print("NBD syscall isolation static gate: PASS")
          PY
      - name: Compile NBD userspace backend
        run: python3 -m py_compile tests/runtime/size-aware-nbd.py
      - name: Run rootless NBD selftest
        run: python3 tests/runtime/size-aware-nbd.py selftest
      - name: Repeat rootless NBD selftest 25 times to catch socket races
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..25}; do
            if ! timeout 15s python3 tests/runtime/size-aware-nbd.py selftest >"$RUNNER_TEMP/nbd-repeat.log" 2>&1; then
              echo "FAIL: rootless NBD selftest repetition $i/25"
              cat "$RUNNER_TEMP/nbd-repeat.log"
              exit 1
            fi
            echo "NBD rootless selftest repetition $i/25: PASS"
          done
      - name: Rootless exact fio read-latency sidecar conversion
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/streaming-benchmark-read-latency.py tests/runtime/streaming-benchmark-read-latency-test.py
          timeout 25s python3 -B tests/runtime/streaming-benchmark-read-latency-test.py -v
      - name: Rootless V2.2 benchmark plan and pre-device admission contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/streaming-benchmark-plan.py tests/runtime/streaming-benchmark-plan-test.py
          timeout 25s python3 -B tests/runtime/streaming-benchmark-plan-test.py -v
      - name: Verify benchmark and NBD teardown Bash syntax
        run: |
          bash -n tests/runtime/streaming-benchmark.sh
          bash -n tests/runtime/streaming-benchmark-teardown.sh
          bash -n tests/runtime/size-aware-nbd-teardown-test.sh
      - name: Rootless pidfd-owned NBD mock server lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/nbd-pidfd-owned-session.py tests/runtime/nbd-pidfd-owned-mock-child.py tests/runtime/nbd-pidfd-owned-session-test.py tests/runtime/nbd-pidfd-crash-owner.py tests/runtime/nbd_pidfd_child_policy.py
          timeout 35s python3 -B tests/runtime/nbd-pidfd-owned-session-test.py -v
      - name: Rootless NBD teardown mock
        run: bash tests/runtime/size-aware-nbd-teardown-test.sh
      - name: Rootless streaming teardown mock
        run: bash tests/runtime/streaming-teardown-regression.sh
