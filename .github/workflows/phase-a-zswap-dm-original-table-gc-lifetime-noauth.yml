name: Round048 genuine pinned DM SRCU table and product async GC dtr NO_AUTH source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-dm-source-and-current-product-negatives:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install rootless actual C compiler and source test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang gcc liblz4-dev libssl-dev
      - name: Checkout exact pristine Linux DM core C without raw HTTP 429
        uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          path: round048-pristine-dm
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            drivers/md/dm.c
            drivers/md/dm-table.c
            include/linux/device-mapper.h
          persist-credentials: false
      - name: Verify pinned Linux commit and exact original DM Git blobs
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE/round048-pristine-dm"
          test "$(git -C "$original" rev-parse HEAD)" = c339f4010dea8b0d754f84ace70cd1b089878ef8
          test -z "$(git -C "$original" status --porcelain --untracked-files=all)"
          test "$(git -C "$original" hash-object "$original/drivers/md/dm.c")" = 1881d86111fb2e655893ad898cf21b88f0e4e7f3
          test "$(git -C "$original" hash-object "$original/drivers/md/dm-table.c")" = a483f49dd4ce6383ef66464707865187aa4cf51c
          test "$(git -C "$original" hash-object "$original/include/linux/device-mapper.h")" = cd4faaf5d4275c038d06ccef4da3d77430154388
          echo "ROUND048_ORIGINAL_DM_PINNED_COMMIT_THREE_BLOBS_VERIFIED_NO_AUTH"
      - name: Validate exact pinned Linux and production C; reject 18 plus export-hostile mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/tools/round048-dm-live-table-source-audit.py \
            --kernel-root "$GITHUB_WORKSPACE/round048-pristine-dm"
      - name: Round049 real target-owned clone ACK GC dtr and 26 actual source-hostile negatives
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/tools/round049-dm-target-owned-intake-audit.py \
            --kernel-root "$GITHUB_WORKSPACE/round048-pristine-dm"
      - name: Round050 extract genuine product guarded C and run 168 negative cases GCC Clang ASan UBSan plus 22 hostile binaries each
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/tools/round050-dm-one-shot-real-c-verify.py host-test
      - name: Round052 actual accepted normal BIO internal one-shot source C 144 GCC Clang sanitizer plus 13 mutant binaries each
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/tools/round052-dm-internal-one-shot-real-c-verify.py host-test
      - name: Round053 actual accepted NORMAL 4096 upper BIO lifecycle 162 C cases and 17 real changed C mutants per compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/tools/round053-dm-accepted-normal-bio-real-c-verify.py host-test
      - name: Round054 real guarded DM stale abort and reversed callback reissue 24 cases plus six executable mutants per compiler
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          python3 -B tests/tools/round054-dm-reissue-verify.py
      - name: Re-execute real Round043 old 150 90 and seven nine source hostile and GCC Clang ASan UBSan
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/tools/round043-dm-real-ingress-verify.py host-test
      - name: Re-execute genuine Round046 90 GC dtr ABA 12 source hostile GCC Clang ASan UBSan
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/tools/round046-dm-real-lifetime-verify.py host-test
