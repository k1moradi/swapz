name: Round094 frozen R093 native storage decoder composite AUTH0
on:
  push:
    branches: [main]
    paths:
      - 'tests/tools/round094-native-storage-composite-verify.py'
      - '.github/workflows/phase-a-round094-native-storage-composite-noauth.yml'
      - 'tests/runtime/native/fixtures/round094-native-value-decoder-link.c'
permissions:
  contents: read
  actions: read
jobs:
  native-storage-decoder-composite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          fetch-depth: 2
          persist-credentials: false
      - name: Canonical exact source and parent before scratch checkout
        working-directory: swapz
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$SWAPZ_PUSH_BEFORE_SHA"
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check "$SWAPZ_PUSH_BEFORE_SHA" HEAD
          python3 - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          import os
          path = 'docs/testing_standards.md'
          before = os.environ['SWAPZ_PUSH_BEFORE_SHA']
          previous = subprocess.check_output(['git', 'show', before + ':' + path])
          current = pathlib.Path(path).read_bytes()
          if not previous or len(current) <= len(previous) or not current.startswith(previous):
              raise SystemExit('FAIL: complete parent standards byte prefix not preserved')
          print('R094_STANDARDS_PREFIX_PASS', len(previous), hashlib.sha256(previous).hexdigest(),
                len(current), hashlib.sha256(current).hexdigest())
          PY
          python3 -B tests/runtime/native/repository-policy-test.py --enforce
      - uses: actions/checkout@v4
        with:
          ref: efd77858cd20650213559ceb9cb4d0362db32ea5
          path: baseline
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          path: linux
          fetch-depth: 1
          persist-credentials: false
      - name: Provision compiler, ELF and kernel build prerequisites (runner packages only)
        run: |
          set -Eeuo pipefail
          sudo -n apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential binutils bc bison flex libelf-dev libssl-dev pkg-config \
            openssl perl python3 xz-utils cpio
          dpkg-query -W libelf-dev libssl-dev gcc binutils
      - name: Read only accepted R093 reference artifact (no rebuild)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45666130617
          name: round093-actual-raw-r092-x86-compile-evidence
          path: prior-r093
      - name: Actual raw staging, directed native storage objects and relocatable composite
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          python3 -B swapz/tests/tools/round094-native-storage-composite-verify.py \
            --baseline baseline --linux linux --prior prior-r093 \
            --out "$RUNNER_TEMP/round094-x86-build" \
            --module "$RUNNER_TEMP/round094-product-module" \
            --evidence round094-compile-evidence \
            --source-sha "$GITHUB_SHA" --source-parent "$SWAPZ_PUSH_BEFORE_SHA"
      - name: Preserve exact compile logs and manifest even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round094-native-storage-composite-evidence
          path: round094-compile-evidence/
          if-no-files-found: warn
          retention-days: 14
