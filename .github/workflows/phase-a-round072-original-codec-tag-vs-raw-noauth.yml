name: Round072 original zswap codec versus RAW HOST no-auth
on:
  push:
    branches: [main]
    paths:
      - 'tests/runtime/native/fixtures/round072-original-codec-tag-vs-raw.c'
      - 'tests/tools/round072-original-codec-tag-vs-raw-verify.py'
      - 'src/kernel/codec.c'
      - 'src/kernel/codec.h'
      - 'src/kernel/authority.h'
      - 'src/kernel/zswap-import-codec.h'
      - 'src/kernel/zswap-direct-handoff.h'
      - 'src/kernel/zswap-import-admission.h'
      - 'docs/testing_standards.md'
      - '.github/workflows/phase-a-round072-original-codec-tag-vs-raw-noauth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gcc-clang-sanitizers-and-semantic-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify sole-main exact source and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
      - name: Install rootless host test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc clang liblz4-dev libssl-dev
      - name: Read-only product headers and source, GCC/Clang ASan UBSan plus 28 compiled C mutants
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/tools/round072-original-codec-tag-vs-raw-verify.py \
            --json round072-agent7-evidence/host.json \
            --ktap round072-agent7-evidence/host.ktap
      - name: Canonical exact-source testing standards policy
        shell: bash
        run: python3 -B tests/runtime/native/repository-policy-test.py --enforce
      - name: Attach HOST-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round072-agent7-host-only
          path: round072-agent7-evidence/
          if-no-files-found: warn
