name: Rootless teardown safety

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rootless-teardown.yml'
      - 'tests/runtime/test-stack-teardown.sh'
      - 'tests/runtime/test-stack-teardown-regression.sh'
      - 'tests/runtime/pressure-teardown.sh'
      - 'tests/runtime/pressure-teardown-regression.sh'
      - 'tests/runtime/pressure_checkpoint.py'
      - 'tests/runtime/pressure-checkpoint-test.py'
      - 'tests/runtime/pressure-helper.py'
      - 'tests/runtime/pressure-runner.sh'
      - 'tests/runtime/pressure-runner-regression.sh'
      - 'tests/runtime/pressure.sh'
      - 'tests/runtime/buffer-recall.sh'
      - 'tests/runtime/live-gc-latency-analyze-test.py'
      - 'tests/runtime/live-gc-latency-analyze.py'
  pull_request:
    paths:
      - '.github/workflows/rootless-teardown.yml'
      - 'tests/runtime/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Bash syntax
        run: |
          set -euo pipefail
          bash -n tests/runtime/test-stack-teardown.sh
          bash -n tests/runtime/test-stack-teardown-regression.sh
          bash -n tests/runtime/pressure-teardown.sh
          bash -n tests/runtime/pressure-teardown-regression.sh
          bash -n tests/runtime/no-discard-livegc.sh
          bash -n tests/runtime/buffer-recall.sh
          bash -n tests/runtime/pressure.sh
          bash -n tests/runtime/pressure-runner.sh
          bash -n tests/runtime/pressure-runner-regression.sh
      - name: Rootless DM and loop teardown regression
        run: bash tests/runtime/test-stack-teardown-regression.sh
      - name: Rootless pressure teardown regression
        run: bash tests/runtime/pressure-teardown-regression.sh
      - name: Rootless production pressure controller regression
        run: bash tests/runtime/pressure-runner-regression.sh
      - name: Rootless pressure release-token protocol regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/pressure_checkpoint.py tests/runtime/pressure-helper.py tests/runtime/pressure-checkpoint-test.py
          python3 tests/runtime/pressure-checkpoint-test.py -v
      - name: Repeat pressure token safety regression in separate processes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if ! timeout 12s python3 tests/runtime/pressure-checkpoint-test.py \
                >"$RUNNER_TEMP/pressure-token-repeat.log" 2>&1; then
              echo "PRESSURE_TOKEN_REPEAT $attempt/10: FAIL"
              cat "$RUNNER_TEMP/pressure-token-repeat.log"
              exit 1
            fi
            echo "PRESSURE_TOKEN_REPEAT $attempt/10: PASS"
          done
      - name: Offline GC latency analyzer regression
        run: python3 tests/runtime/live-gc-latency-analyze-test.py -v
