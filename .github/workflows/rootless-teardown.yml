name: Rootless teardown safety

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rootless-teardown.yml'
      - '.github/workflows/rootless-combined.yml'
      - '.github/workflows/rootless-nbd.yml'
      - 'kernel/dm-swapz.c'
      - 'tests/runtime/test-stack-teardown.sh'
      - 'tests/runtime/test-stack-teardown-regression.sh'
      - 'tests/runtime/pressure-teardown.sh'
      - 'tests/runtime/pressure-teardown-regression.sh'
      - 'tests/runtime/no-discard-livegc.sh'
      - 'tests/runtime/pressure_checkpoint.py'
      - 'tests/runtime/pressure-checkpoint-test.py'
      - 'tests/runtime/pressure-helper.py'
      - 'tests/runtime/pressure-runner.sh'
      - 'tests/runtime/pressure-runner-regression.sh'
      - 'tests/runtime/pressure-swap-inventory.py'
      - 'tests/runtime/pressure-swap-inventory-test.py'
      - 'tests/runtime/pressure.sh'
      - 'tests/runtime/buffer-recall.sh'
      - 'tests/runtime/test-child-supervisor.py'
      - 'tests/runtime/test-child-supervisor-regression.py'
      - 'tests/runtime/test-child-supervisor-service.py'
      - 'tests/runtime/test-child-supervisor-service-regression.py'
      - 'tests/runtime/recall-ipc-adapter.py'
      - 'tests/runtime/recall-ipc-adapter-test.py'
      - 'tests/runtime/recall-role-bridge-test.py'
      - 'tests/runtime/recall-role-service-integration-test.py'
      - 'tests/runtime/recall-role-process-fixture.py'
      - 'tests/runtime/recall-role-process-integration-test.py'
      - 'tests/runtime/recall-role-bridge-fixture.py'
      - 'tests/runtime/recall-role-bridge-regression.sh'
      - 'tests/runtime/recall-dd-allowlist.py'
      - 'tests/runtime/recall-dd-allowlist-test.py'
      - 'tests/runtime/gnu-coreutils-qualification.py'
      - 'tests/runtime/gnu-coreutils-qualification-test.py'
      - 'tests/runtime/recall-gnu-dd-seccomp-qualification.py'
      - 'tests/runtime/recall-gnu-dd-seccomp-qualification-test.py'
      - 'tests/runtime/recall-dd-worker-integration-test.py'
      - 'tests/runtime/recall-readback-identity.py'
      - 'tests/runtime/recall-readback-identity-test.py'
      - 'tests/runtime/recall-control-bridge.py'
      - 'tests/runtime/recall-control-bridge-test.py'
      - 'tests/runtime/recall-control-bridge-regression.sh'
      - 'tests/runtime/recall-io-plan.py'
      - 'tests/runtime/recall-io-plan-test.py'
      - 'tests/runtime/recall-io-drain-policy.py'
      - 'tests/runtime/recall-io-drain-policy-test.py'
      - 'tests/runtime/recall-io-drain-orchestrator.py'
      - 'tests/runtime/recall-io-drain-orchestrator-test.py'
      - 'tests/runtime/recall-fixture-release-policy.py'
      - 'tests/runtime/recall-fixture-release-policy-test.py'
      - 'tests/runtime/recall-fixture-owner.py'
      - 'tests/runtime/recall-fixture-owner-test.py'
      - 'tests/runtime/recall-broker-external-contract-test.py'
      - 'tests/runtime/recall-denial-telemetry.py'
      - 'tests/runtime/recall-denial-telemetry-test.py'
      - 'tests/runtime/rootless-ci-evidence-inventory.py'
      - 'tests/runtime/rootless-ci-evidence-inventory-test.py'
      - 'tests/runtime/rootless-workflow-contract-test.py'
      - 'tests/runtime/live-gc-latency-analyze-test.py'
      - 'tests/runtime/live-gc-latency-analyze.py'
      - 'tests/runtime/v22-drain-plateau-analyze.py'
      - 'tests/runtime/v22-drain-plateau-analyze-test.py'
      - 'tests/runtime/v22-latency-v3-test.py'
      - 'tests/runtime/v22-evidence-bundle-check.py'
      - 'tests/runtime/v22-evidence-bundle-check-test.py'
      - 'tests/runtime/v22-evidence-bundle-v3.py'
      - 'tests/runtime/v22-evidence-bundle-v3-test.py'
      - 'tests/runtime/swapz-kernel-range-contract-test.py'
      - 'tests/runtime/swapz-gc-source-contract-test.py'
      - 'tests/runtime/streaming-benchmark.sh'
      - 'tests/runtime/streaming-benchmark-report.py'
      - 'tests/runtime/streaming-benchmark-report-test.py'
      - 'tests/runtime/streaming-benchmark-teardown.sh'
      - 'tests/runtime/streaming-teardown-regression.sh'
      - 'tests/runtime/size-aware-nbd-teardown-test.sh'
      - 'tests/runtime/nbd-pidfd-owned-session.py'
      - 'tests/runtime/nbd-pidfd-owned-mock-child.py'
      - 'tests/runtime/nbd-pidfd-owned-session-test.py'
      - 'tests/runtime/nbd-pidfd-crash-owner.py'
      - 'tests/runtime/nbd_pidfd_child_policy.py'
  pull_request:
    paths:
      - '.github/workflows/rootless-teardown.yml'
      - '.github/workflows/rootless-combined.yml'
      - '.github/workflows/rootless-nbd.yml'
      - 'kernel/dm-swapz.c'
      - 'tests/runtime/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Guard rootless workflow safety gates and push-trigger coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/rootless-workflow-contract-test.py
          timeout 20s python3 -B tests/runtime/rootless-workflow-contract-test.py -v
          echo "ROOTLESS_WORKFLOW_CONTRACT: PASS (mandatory tests and source trigger coverage)"
      - name: Verify Bash syntax
        run: |
          set -euo pipefail
          bash -n tests/runtime/test-stack-teardown.sh
          bash -n tests/runtime/test-stack-teardown-regression.sh
          bash -n tests/runtime/pressure-teardown.sh
          bash -n tests/runtime/pressure-teardown-regression.sh
          bash -n tests/runtime/no-discard-livegc.sh
          bash -n tests/runtime/buffer-recall.sh
          bash -n tests/runtime/pressure.sh
          bash -n tests/runtime/pressure-runner.sh
          bash -n tests/runtime/pressure-runner-regression.sh
      - name: Rootless DM and loop teardown regression
        run: bash tests/runtime/test-stack-teardown-regression.sh
      - name: Rootless pidfd-owned NBD mock server lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/nbd-pidfd-owned-session.py tests/runtime/nbd-pidfd-owned-mock-child.py tests/runtime/nbd-pidfd-owned-session-test.py tests/runtime/nbd-pidfd-crash-owner.py tests/runtime/nbd_pidfd_child_policy.py
          timeout 35s python3 -B tests/runtime/nbd-pidfd-owned-session-test.py -v
      - name: Rootless NBD and streaming fail-closed teardown mocks
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/runtime/streaming-benchmark-teardown.sh tests/runtime/streaming-teardown-regression.sh tests/runtime/size-aware-nbd-teardown-test.sh
          timeout 15s bash tests/runtime/size-aware-nbd-teardown-test.sh
          timeout 15s bash tests/runtime/streaming-teardown-regression.sh
      - name: Rootless pressure teardown regression
        run: bash tests/runtime/pressure-teardown-regression.sh
      - name: Gated pidfd supervisor rootless safety regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/test-child-supervisor.py tests/runtime/test-child-supervisor-regression.py
          timeout 40s python3 tests/runtime/test-child-supervisor-regression.py -v
      - name: Repeat pidfd supervisor regression in separate processes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..3}; do
            if ! timeout 40s python3 tests/runtime/test-child-supervisor-regression.py -q >"$RUNNER_TEMP/pidfd-supervisor-repeat.log" 2>&1; then
              echo "PIDFD_SUPERVISOR_REPEAT $attempt/3: FAIL"
              cat "$RUNNER_TEMP/pidfd-supervisor-repeat.log"
              exit 1
            fi
            echo "PIDFD_SUPERVISOR_REPEAT $attempt/3: PASS"
          done
      - name: Rootless pidfd supervisor IPC service regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/test-child-supervisor-service.py tests/runtime/test-child-supervisor-service-regression.py
          timeout 50s python3 tests/runtime/test-child-supervisor-service-regression.py -v
      - name: Repeat pidfd IPC service regression in ten separate processes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if ! timeout 15s python3 tests/runtime/test-child-supervisor-service-regression.py -q >"$RUNNER_TEMP/pidfd-ipc-repeat.log" 2>&1; then
              echo "PIDFD_IPC_REPEAT $attempt/10: FAIL"
              cat "$RUNNER_TEMP/pidfd-ipc-repeat.log"
              exit 1
            fi
            echo "PIDFD_IPC_REPEAT $attempt/10: PASS"
          done
      - name: Rootless recall IPC adapter regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-ipc-adapter.py tests/runtime/recall-ipc-adapter-test.py
          timeout 60s python3 tests/runtime/recall-ipc-adapter-test.py -v
      - name: Rootless five-role readback and IPC bridge regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-role-bridge-test.py
          timeout 35s python3 tests/runtime/recall-role-bridge-test.py -v
      - name: Rootless real role service IPC protocol integration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-role-service-integration-test.py
          timeout 35s python3 tests/runtime/recall-role-service-integration-test.py -v
      - name: Separate-process pinned direct dd recall and attested readback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-role-process-fixture.py tests/runtime/recall-role-process-integration-test.py
          timeout 65s python3 -B tests/runtime/recall-role-process-integration-test.py -v
      - name: Repeated separate-process readback admission qualification
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if ! timeout 20s python3 -B tests/runtime/recall-role-process-integration-test.py               ActualServiceAndDirectDDTests.test_real_service_process_five_pinned_workers_and_exact_readback -q               >"$RUNNER_TEMP/recall-direct-process-repeat.log" 2>&1; then
              echo "RECALL_DIRECT_ROLE_REPEAT $attempt/6: FAIL — preserve backing, do not retry this session"
              cat "$RUNNER_TEMP/recall-direct-process-repeat.log"
              exit 1
            fi
            echo "RECALL_DIRECT_ROLE_REPEAT $attempt/6: PASS"
          done
      - name: Genuine Bash synthetic role coprocess lifecycle
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/runtime/recall-role-bridge-regression.sh
          python3 -m py_compile tests/runtime/recall-role-bridge-fixture.py
          timeout 35s bash tests/runtime/recall-role-bridge-regression.sh
      - name: Persistent Bash pidfd IPC control bridge rootless regression
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/runtime/recall-control-bridge-regression.sh
          python3 -m py_compile tests/runtime/recall-control-bridge.py tests/runtime/recall-control-bridge-test.py
          timeout 110s bash tests/runtime/recall-control-bridge-regression.sh
      - name: Strict fixture-bound direct dd role allowlist regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-dd-allowlist.py tests/runtime/recall-dd-allowlist-test.py
          timeout 20s python3 tests/runtime/recall-dd-allowlist-test.py -v
      - name: GNU provenance and worker build-record binding unit tests (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/gnu-coreutils-qualification.py tests/runtime/gnu-coreutils-qualification-test.py tests/runtime/recall-gnu-dd-seccomp-qualification.py tests/runtime/recall-gnu-dd-seccomp-qualification-test.py
          timeout 30s python3 -B tests/runtime/gnu-coreutils-qualification-test.py -v
          timeout 20s python3 -B tests/runtime/recall-gnu-dd-seccomp-qualification-test.py -v
          echo "GNU_POLICY_UNIT_TESTS_ONLY: PASS (no authenticated GNU build or real worker executed)"
      - name: Rootless pinned direct dd worker integration regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-dd-worker-integration-test.py
          timeout 35s python3 tests/runtime/recall-dd-worker-integration-test.py -v
      - name: Pinned recall readback identity regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-readback-identity.py tests/runtime/recall-readback-identity-test.py
          timeout 20s python3 tests/runtime/recall-readback-identity-test.py -v
      - name: Rootless direct recall I/O orchestration test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-io-plan.py tests/runtime/recall-io-plan-test.py
          python3 tests/runtime/recall-io-plan-test.py -v
      - name: Strict pressure swap inventory parser unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/pressure-swap-inventory.py tests/runtime/pressure-swap-inventory-test.py
          python3 tests/runtime/pressure-swap-inventory-test.py -v
      - name: Rootless production pressure controller regression
        run: bash tests/runtime/pressure-runner-regression.sh
      - name: Rootless pressure release-token protocol regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/pressure_checkpoint.py tests/runtime/pressure-helper.py tests/runtime/pressure-checkpoint-test.py
          python3 tests/runtime/pressure-checkpoint-test.py -v
      - name: Repeat pressure token safety regression in separate processes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if ! timeout 12s python3 tests/runtime/pressure-checkpoint-test.py \
                >"$RUNNER_TEMP/pressure-token-repeat.log" 2>&1; then
              echo "PRESSURE_TOKEN_REPEAT $attempt/10: FAIL"
              cat "$RUNNER_TEMP/pressure-token-repeat.log"
              exit 1
            fi
            echo "PRESSURE_TOKEN_REPEAT $attempt/10: PASS"
          done
      - name: Rootless streaming single-sweep reporting safety regression
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/runtime/streaming-benchmark.sh
          python3 -m py_compile tests/runtime/streaming-benchmark-report.py tests/runtime/streaming-benchmark-report-test.py
          timeout 25s python3 -B tests/runtime/streaming-benchmark-report-test.py -v
      - name: Rootless DM IO drain policy and synthetic orchestration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-io-drain-policy.py tests/runtime/recall-io-drain-policy-test.py tests/runtime/recall-io-drain-orchestrator.py tests/runtime/recall-io-drain-orchestrator-test.py
          timeout 25s python3 -B tests/runtime/recall-io-drain-policy-test.py -v
          timeout 25s python3 -B tests/runtime/recall-io-drain-orchestrator-test.py -v
      - name: Rootless authenticated fixture-release policy regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-fixture-release-policy.py tests/runtime/recall-fixture-release-policy-test.py
          timeout 35s python3 -B tests/runtime/recall-fixture-release-policy-test.py -v
          echo "FIXTURE_RELEASE_POLICY_MODEL_ONLY: PASS (no kernel drain or backing cleanup)"
      - name: Rootless fixture-owner broker and evidence producer policy suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-fixture-owner.py tests/runtime/recall-fixture-owner-test.py
          timeout 45s python3 -B tests/runtime/recall-fixture-owner-test.py -v
          echo "FIXTURE_OWNER_BROKER_MODEL_ONLY: PASS (fake peers, fake kernel observations; no device cleanup)"
          for attempt in {1..3}; do
            if ! timeout 25s python3 -B tests/runtime/recall-fixture-owner-test.py -q \
                >"$RUNNER_TEMP/fixture-owner-broker-repeat.log" 2>&1; then
              echo "FIXTURE_OWNER_BROKER_REPEAT $attempt/3: FAIL (do not authorize backing)"
              cat "$RUNNER_TEMP/fixture-owner-broker-repeat.log"
              exit 1
            fi
            echo "FIXTURE_OWNER_BROKER_REPEAT $attempt/3: PASS"
          done
      - name: Independent rootless five-role broker and ambiguous-child contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-broker-external-contract-test.py
          timeout 25s python3 -B tests/runtime/recall-broker-external-contract-test.py -v
      - name: Offline exact-revision rootless CI evidence inventory regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/rootless-ci-evidence-inventory.py tests/runtime/rootless-ci-evidence-inventory-test.py
          timeout 25s python3 -B tests/runtime/rootless-ci-evidence-inventory-test.py -v
      - name: Offline synthetic recall-denial telemetry classification regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/recall-denial-telemetry.py tests/runtime/recall-denial-telemetry-test.py
          timeout 25s python3 -B tests/runtime/recall-denial-telemetry-test.py -v
      - name: Compiled GC source snapshot and generation publication contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/swapz-gc-source-contract-test.py
          timeout 25s python3 -B tests/runtime/swapz-gc-source-contract-test.py -v
      - name: Compiled exact kernel range guards and GC order contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/swapz-kernel-range-contract-test.py
          timeout 25s python3 -B tests/runtime/swapz-kernel-range-contract-test.py -v
      - name: Rootless offline physical drain plateau evidence regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/v22-drain-plateau-analyze.py tests/runtime/v22-drain-plateau-analyze-test.py
          timeout 25s python3 -B tests/runtime/v22-drain-plateau-analyze-test.py -v
      - name: V3 lossless exact-latency sidecar adversarial regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/v22-drain-plateau-analyze.py tests/runtime/v22-latency-v3-test.py
          timeout 35s python3 -B tests/runtime/v22-latency-v3-test.py -v
      - name: V3 sidecar-aware measurement bundle binding regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/v22-evidence-bundle-v3.py tests/runtime/v22-evidence-bundle-v3-test.py
          timeout 35s python3 -B tests/runtime/v22-evidence-bundle-v3-test.py -v
      - name: Offline V2.2 evidence bundle identity and artifact integrity policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/runtime/v22-evidence-bundle-check.py tests/runtime/v22-evidence-bundle-check-test.py
          timeout 35s python3 -B tests/runtime/v22-evidence-bundle-check-test.py -v
          echo "V22_OFFLINE_BUNDLE_CONSISTENCY_ONLY: PASS (not authenticated, no device access)"
      - name: Offline GC latency analyzer regression
        run: python3 tests/runtime/live-gc-latency-analyze-test.py -v
