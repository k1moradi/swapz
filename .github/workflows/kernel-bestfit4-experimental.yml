name: Historical V2.2 kernel geometry (manual archival run)

on:
  workflow_dispatch:

permissions:
  contents: read
env:
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/build/python-cache

jobs:
  source-and-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Exact-source geometry guards, no device loading
        run: |
          set -euo pipefail
          python3 -B tests/runtime/kernel-bestfit4-geometry-test.py -v
  compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution kernel headers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential linux-headers-generic-hwe-24.04
      - name: Compile stable kernel module with W=1 into the one build root
        run: |
          set -euo pipefail
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)"
          test -n "$KDIR"
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          make -C kernel KDIR="$KDIR" W=1 -j2 all
          test -s build/kernel/stable/dm-swapz.ko
          sha256sum build/kernel/stable/dm-swapz.ko
          echo "STABLE_COMPILE_ONLY_NO_MODULE_INSERTION"
