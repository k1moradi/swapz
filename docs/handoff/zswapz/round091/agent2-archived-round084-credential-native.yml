name: Round084 pinned original compressor store credential NO_AUTH
on:
  push:
    branches: [main]
    paths:
      - 'tests/runtime/native/fixtures/round084-original-store-credential-*.cfrag'
      - 'tests/tools/round084-stage-original-store-credential.py'
      - 'tests/tools/round084-original-store-credential-verify.py'
      - '.github/workflows/phase-a-round084-original-store-credential-noauth.yml'
permissions:
  contents: read
jobs:
  original-credential-strict-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          fetch-depth: 2
          persist-credentials: false
      - name: Exact main source and canonical standards before any compiler
        working-directory: swapz
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD^)" = "$SWAPZ_PUSH_BEFORE_SHA"
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
          python3 -B tests/runtime/native/repository-policy-test.py --enforce
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          path: linux
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            mm/zswap.c
            mm/zsmalloc.c
            crypto/lz4.c
            crypto/lzo.c
            crypto/lzo-rle.c
            crypto/scompress.c
            include/crypto/acompress.h
            include/crypto/sha2.h
            include/linux/crc32.h
            lib/lzo/lzo1x_compress.c
            lib/lzo/lzo1x_compress_safe.c
            lib/lz4/lz4_compress.c
      - name: Actual pinned original stage plan and negative anchors
        run: |
          set -Eeuo pipefail
          python3 -B swapz/tests/tools/round084-stage-original-store-credential.py \
            --linux-root linux --manifest "$RUNNER_TEMP/r084-stage.json" --verify-only
      - name: Install ephemeral host compiler dependencies
        run: |
          set -Eeuo pipefail
          sudo -n apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gcc clang libssl-dev
      - name: Actual staged credential helper strict sanitizer baseline and semantic mutants
        run: python3 -B swapz/tests/tools/round084-original-store-credential-verify.py host
  original-credential-pinned-uml:
    needs: original-credential-strict-host
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          path: swapz
          fetch-depth: 2
          persist-credentials: false
      - name: Exact source parent and clean product
        working-directory: swapz
        env:
          SWAPZ_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD^)" = "$SWAPZ_PUSH_BEFORE_SHA"
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check HEAD^ HEAD
      - uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: c339f4010dea8b0d754f84ace70cd1b089878ef8
          path: linux
          fetch-depth: 1
          persist-credentials: false
      - name: Actual pristine original stage and exact postimage before build
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p round084-evidence
          python3 -B swapz/tests/tools/round084-stage-original-store-credential.py \
            --linux-root linux --manifest round084-evidence/stage.json --verify-only
          python3 -B swapz/tests/tools/round084-stage-original-store-credential.py \
            --linux-root linux --manifest round084-evidence/stage.json --stage
          python3 -B swapz/tests/tools/round084-stage-original-store-credential.py \
            --linux-root linux --manifest round084-evidence/stage.json --verify-stage
      - name: Install ephemeral original UML build dependencies
        run: |
          set -Eeuo pipefail
          sudo -n apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex clang libelf-dev libssl-dev libncurses-dev \
            python3 python3-pyelftools binutils
      - name: Build once then run actual original compressor KUnit JSON and raw KTAP
        shell: bash
        timeout-minutes: 95
        run: |
          set -Eeuo pipefail
          umask 077
          out="$RUNNER_TEMP/r084-original-uml"
          config="$RUNNER_TEMP/r084.kunitconfig"
          result="$PWD/round084-evidence/original-credential.json"
          phase=build
          log=round084-evidence/build.log
          first_error() {
            local code="$1"
            echo "::error::R084_NATIVE_FIRST_ERROR phase=$phase exit=$code" >&2
            if test -s "$out/test.log"; then
              cp "$out/test.log" round084-evidence/original-credential-KTAP.log
            fi
            { grep -hE -m1 'fatal error:|error:|undefined reference|not ok|Kernel panic|KASAN:|UBSAN:|timed out' \
              "$log" "$out/test.log" 2>/dev/null || true; } | cut -c1-250 >&2
            return "$code"
          }
          cat >"$config" <<'KUNIT_CONFIG'
          CONFIG_KUNIT=y
          CONFIG_BLOCK=y
          CONFIG_SWAP=y
          CONFIG_ZSWAP=y
          # CONFIG_ZSWAP_DEFAULT_ON is not set
          CONFIG_CRYPTO=y
          CONFIG_CRYPTO_LZO=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_SHA256=y
          CONFIG_CRYPTO_LIB_SHA256=y
          CONFIG_CRYPTO_CRC32C=y
          CONFIG_CRC32=y
          CONFIG_LZO_COMPRESS=y
          CONFIG_LZO_DECOMPRESS=y
          CONFIG_LZ4_COMPRESS=y
          CONFIG_LZ4_DECOMPRESS=y
          # CONFIG_CGROUPS is not set
          # CONFIG_KUNIT_ALL_TESTS is not set
          KUNIT_CONFIG
          if timeout -k 10s 82m python3 -B linux/tools/testing/kunit/kunit.py build \
              --arch=um --build_dir="$out" --kunitconfig="$config" \
              --make_options="KCFLAGS=-DSWAPZ_ROUND084_ORIGINAL_STORE_CREDENTIAL_TEST=1 -Werror" \
              --jobs=2 >"$log" 2>&1; then
            test -x "$out/linux" || { first_error 3; exit 3; }
          else
            code=$?
            first_error "$code"
            exit "$code"
          fi
          phase=effective-config
          for symbol in CONFIG_KUNIT=y CONFIG_ZSWAP=y CONFIG_CRYPTO_LZO=y CONFIG_CRYPTO_LZ4=y CONFIG_CRYPTO_LIB_SHA256=y CONFIG_CRC32=y; do
            grep -Fxq "$symbol" "$out/.config" || { first_error 3; exit 3; }
          done
          grep -Fxq '# CONFIG_ZSWAP_DEFAULT_ON is not set' "$out/.config" || { first_error 3; exit 3; }
          phase=original-compressor-boot
          log=round084-evidence/run.log
          if timeout -k 10s 5m python3 -B linux/tools/testing/kunit/kunit.py exec \
              --arch=um --build_dir="$out" --timeout=120 --json="$result" \
              'swapz_round084_original_store_credential*' >"$log" 2>&1; then
            cp "$out/test.log" round084-evidence/original-credential-KTAP.log
          else
            code=$?
            first_error "$code"
            exit "$code"
          fi
          phase=actual-json-ktap
          python3 -B swapz/tests/tools/round084-original-store-credential-verify.py verify-native \
            --result "$result" --kernel-log "$out/test.log" || { first_error 3; exit 3; }
      - name: Retain bounded original native evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round084-original-store-credential-native
          path: round084-evidence/
          if-no-files-found: warn
          retention-days: 14
